(function () {
  var COR = {"claro": "#f6f7f9", "escuro": "#1e1f22"}, BOTAO = "<button class=\"tema-btn\" id=\"tema-btn\" type=\"button\" role=\"switch\" title=\"Ligar modo escuro\" aria-label=\"Modo escuro\" aria-checked=\"false\"><span class=\"tc-bola\"><span class=\"ic-sol\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg></span><span class=\"ic-lua\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/></svg></span></span></button>", COMP = "<button class=\"comp-btn\" id=\"comp-btn\" type=\"button\" title=\"Compartilhar o site\" aria-label=\"Compartilhar o site\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"18\" cy=\"5\" r=\"2.5\"/><circle cx=\"6\" cy=\"12\" r=\"2.5\"/><circle cx=\"18\" cy=\"19\" r=\"2.5\"/><path d=\"M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4\"/></svg></button>";
  function le() { try { return localStorage.getItem('portal_tema') === 'escuro' ? 'escuro' : 'claro'; } catch (e) { return 'claro'; } }
  function aplica(t) {
    var r = document.documentElement;

    var m = document.querySelector('meta[name="theme-color"]');

  window.temaAlterna = function () {

  addEventListener('storage', function (e) { if (e.key === 'portal_tema') aplica(le()); });
  document.addEventListener('DOMContentLoaded', function () {

    var tb = document.getElementById('tema-btn');
    if (tb && !document.getElementById('comp-btn')) {
      var dc = document.createElement('div');
      dc.innerHTML = COMP;

      if (tb.classList.contains('tema-solto')) cb.classList.add('comp-solto');

  });
  // --- Compartilhar o site ---
  var LINK_PARAMS_OK = ['tab', 'aba', 'casa', 'semana', 'mes'];
  function linkDaPagina() {
    var q = new URLSearchParams(location.search), fica = new URLSearchParams();
    LINK_PARAMS_OK.forEach(function (k) { if (q.has(k)) fica.set(k, q.get(k)); });

  function abreComp() {

      document.body.appendChild(d);

    }
    d.querySelector('#comp-link').value = linkDaPagina();

  function fechaComp() { var d = document.getElementById('comp-dlg'); if (d) { if (d.close) d.close(); else d.removeAttribute('open'); } }
  function copiaComp() {
    var campo = document.getElementById('comp-link'), url = campo.value;
    function feito() { fechaComp(); aviso('Link copiado'); }
    function reserva() {
      campo.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      if (ok) feito(); else { campo.focus(); campo.select(); aviso('Selecione e copie o link'); }
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(feito, reserva);
    else reserva();
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('#tema-btn')) { window.temaAlterna(); return; }
    if (e.target.closest('#comp-btn')) { abreComp(); return; }
    var c = e.target.closest('[data-comp]');
    if (!c) return;
    var a = c.getAttribute('data-comp');
    if (a === 'copiar') copiaComp();
    else if (a === 'enviar') navigator.share({ title: document.title, url: document.getElementById('comp-link').value }).then(fechaComp, function () {});
    else fechaComp();
  });
})();

<script>
window.BENTO_WORKER = "https://bento-portal-contagem.rodrigopcviana.workers.dev";
window.SESSAO_BENTO_LS = 'bento_sessao';
// Modo prévia (admin-ver-como.html, 2026-09-25): o admin abre o mural de
// outro nível numa moldura e a página se comporta como se o acesso fosse
// daquele nível — sem trocar de login. Só liga quando AS DUAS coisas valem:
// a sessão REAL é admin, e o topo da aba é admin-ver-como.html do MESMO site
// (topo de outro domínio lança exceção ao ler location → sem prévia). Nenhum
// nível ganha acesso que não tinha: o admin já vê tudo isso nas páginas dele,
// e o token continua sendo o do admin — o worker decide pelo token real.
window.previaBento = function () {
  try {
    if (window.self === window.top) return null;
    if (window.top.location.pathname.split('/').pop() !== 'admin-ver-como.html') return null;
    var p = window.top.bentoPrevia;
    return p && p.nivel ? p : null;
  } catch (e) { return null; }
};
window.sessaoBentoLer = function () {
  try {
    var raw = localStorage.getItem(window.SESSAO_BENTO_LS);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.token || !s.exp || Date.now() > s.exp) return null;
    var pv = s.nivel === 'admin' ? window.previaBento() : null;
    if (pv) return { nivel: pv.nivel, pessoa: pv.pessoa || null, token: s.token, exp: s.exp, previa: true };
    return s;
  } catch (e) { return null; }
};
// Token da sessão em toda chamada ao Worker (PLANO_CHAVES_PUBLICAS_BENTO.md,
// 2026-11). As rotas que pediam chave fixa no corpo ou no X-Chave passaram a
// aceitar o X-Token da sessão (autorizaRotaBento no worker), e a chave saiu do
// HTML publicado. Em vez de mexer em cada fetch das ~100 páginas, o fetch da
// página é embrulhado uma vez aqui: pedido para window.BENTO_WORKER ganha o
// X-Token da sessão, se a página ainda não mandou um. Pedido para outro
// endereço sai intocado, e sem sessão o pedido sai igual ao de antes (o worker
// recusa com 401, como recusava chave errada). Na prévia do admin o token é o
// do próprio admin (ver sessaoBentoLer acima), então nenhum nível ganha acesso.
(function () {
  if (!window.fetch || window.fetch.__tokenBento) return;
  var original = window.fetch;
  var embrulhado = function (entrada, opcoes) {
    try {
      var url = entrada && typeof entrada === 'object' && 'url' in entrada ? entrada.url : String(entrada);
      var s = window.BENTO_WORKER && url.indexOf(window.BENTO_WORKER + '/') === 0 ? window.sessaoBentoLer() : null;
      if (s && s.token) {
        var o = opcoes ? Object.assign({}, opcoes) : {};
        var h = new Headers(o.headers || (entrada && entrada.headers) || undefined);
        if (!h.has('X-Token')) h.set('X-Token', s.token);
        o.headers = h;
        return original.call(window, entrada, o);
      }
    } catch (e) {}
    return original.apply(window, arguments);
  };
  embrulhado.__tokenBento = true;
  window.fetch = embrulhado;
})();
// Faixa fixa dentro da moldura: a prévia nunca pode ser confundida com a tela
// real, e o que se envia daqui GRAVA DE VERDADE (decisão do Rodrigo).
(function () {
  var s = window.sessaoBentoLer();
  if (!s || !s.previa) return;
  var nomes = { equipe: 'Equipe de Bar', maitres: 'Maîtres', rh: 'RH', suprimentos: 'Suprimentos',
                controladoria: 'Controladoria', diretoria: 'Diretoria' };
  function faixa() {
    if (document.getElementById('previa-faixa')) return;
    var f = document.createElement('div');
    f.id = 'previa-faixa';
    f.setAttribute('role', 'status');
    f.style.cssText = 'position:sticky;top:0;z-index:99;background:var(--c-5a3fa0);color:#fff;font:600 12px/1.35 -apple-system,sans-serif;padding:7px 12px;text-align:center';
    f.textContent = 'Modo prévia · vendo como ' + (nomes[s.nivel] || s.nivel) +
      (s.pessoa ? ' (' + s.pessoa + ')' : '') + ' — o que você enviar aqui é gravado de verdade';
    document.body.insertBefore(f, document.body.firstChild);
  }
  if (document.body) faixa(); else document.addEventListener('DOMContentLoaded', faixa);
})();
// `pessoa` passou a ser guardada (2026-07-25): o worker já devolvia, mas a
// sessão descartava — e sem ela a página de Acessos não sabe quem está
// decidindo. Campo opcional: sessão de silo (sem pessoa) continua igual.
// Dentro da prévia, "Trocar acesso" ou um login na moldura NÃO podem mexer na
// sessão real do admin — o localStorage é o mesmo da aba de fora.
window.sessaoBentoSalvar = function (nivel, token, exp, pessoa) {
  if (window.previaBento()) return;
  try { localStorage.setItem(window.SESSAO_BENTO_LS, JSON.stringify({ nivel: nivel, token: token, exp: exp, pessoa: pessoa || null })); } catch (e) {}
};
window.sessaoBentoLimpar = function () {
  if (window.previaBento()) return;
  try { localStorage.removeItem(window.SESSAO_BENTO_LS); } catch (e) {}
};
window.loginSenhaBento = function (senha) {
  return fetch(window.BENTO_WORKER + '/api/nivel', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ senha: senha }),
  }).then(function (r) {
    if (r.status === 401) return { ok: false, status: 401 };
    if (!r.ok) return { ok: false, status: r.status };
    return r.json().then(function (d) {
      if (d.token) window.sessaoBentoSalvar(d.nivel, d.token, d.exp, d.pessoa);
      return { ok: true, nivel: d.nivel, token: d.token, pessoa: d.pessoa || null };
    });
  }).catch(function () { return { ok: false, status: 0 }; });
};
// Gate padrão das páginas protegidas: sem sessão -> manda pra home logar,
// com volta automática pra cá. "volta" é o NOME DO ARQUIVO atual (lido de
// location.pathname, não o slug de nav — mural.html/maitres-mural.html/
// admin-mural.html compartilham o mesmo slug "mural" pro nav, mas são
// arquivos diferentes; voltar pro slug errado abriria o silo errado depois
// do login). Sessão de nível diferente do exigido (ex.: Equipe abrindo
// maitres-mural.html direto por URL) -> NÃO redireciona (senão a home
// logada devolveria pra cá e viraria loop); mostra mensagem.
window.irParaLoginBento = function () {
  var atual = location.pathname.split('/').pop().replace(/\.html$/, '') || 'index';
  location.replace('index.html?volta=' + encodeURIComponent(atual) + '#acesso');
};
window.exigirNivel = function (niveisOk, slug) {
  var s = window.sessaoBentoLer();
  if (s && niveisOk.indexOf(s.nivel) >= 0) return { ok: true, sessao: s };
  if (!s) { window.irParaLoginBento(); return { ok: false, redirecionou: true }; }
  document.body.innerHTML = '<div id="acesso-negado" class="capa-wrap capa-centro"><p class="capa-sub">'
    + 'Seu acesso atual não abre esta página. '
    + '<a href="index.html?trocar=1">Trocar acesso</a>.</p></div>';
  // Esta função roda DURANTE a leitura do HTML: trocar o <body> não impede o
  // navegador de continuar lendo o resto da página e montá-lo embaixo da
  // mensagem (achado 2026-09-25 — toda página do site mostrava a casca
  // inteira pra quem não tinha acesso; dado não vazava, o worker confere o
  // token). Duas camadas: parar o carregamento (o resto nem é montado nem
  // executado) e, de reserva, esconder tudo que não for a mensagem.
  try {
    var st = document.createElement('style');
    st.textContent = 'body > :not(#acesso-negado) { display: none !important; }';
    (document.head || document.documentElement).appendChild(st);
  } catch (e) {}
  try { window.stop(); } catch (e) {}
  return { ok: false, nivelAtual: s.nivel };
};
// Injeta um fragmento vindo de /api/protegido/<chave> (vendas/ranking/
// equipe-vendas/feedback-nutricionista — dado que embutido direto no HTML
// público vazaria por URL sem senha, ver PLANO_LOGIN_TOKEN_BENTO.md seção 3).
// innerHTML NÃO executa <script> injetado — recria os nós pra rodar mesmo.
window.injetaProtegido = function (el, htmlTexto) {
  el.innerHTML = htmlTexto;
  el.querySelectorAll('script').forEach(function (velho) {
    var novo = document.createElement('script');
    if (velho.src) novo.src = velho.src; else novo.textContent = velho.textContent;
    velho.replaceWith(novo);
  });
};
window.carregaProtegido = function (chave, containerId) {
  var el = document.getElementById(containerId);
  var s = window.sessaoBentoLer();
  if (!s || !el) return;
  fetch(window.BENTO_WORKER + '/api/protegido/' + chave, { headers: { 'X-Token': s.token } })
    .then(function (r) {
      if (r.status === 401) { el.innerHTML = '<div class="panel"><p>Sua sessão não abre este conteúdo. <a href="index.html?trocar=1">Trocar acesso</a>.</p></div>'; return null; }
