<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f5f2;--sup:#fff;--sup2:#f0ede7;--linha:#e2ddd3;--tx:#1f1b16;--tx2:#5c5446;--tx3:#7d7363;--acento:#94601e;--acento-bg:#f6e9d4;--acento-tx:#6a4310;--verde:#2f7a4f;--verde-bg:#dcefe2;--verde-tx:#1f5a39;--coral:#b4443a;--coral-bg:#f6dcd8;--coral-tx:#842e26;--faixa:#2b2620;--faixa-tx:#f0e7d8;--faixa-linha:#5d5142;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif}
:root[data-tema="escuro"]{--bg:#2b2620;--sup:#342e26;--sup2:#3b342a;--linha:#4a4133;--tx:#f0e7d8;--tx2:#b3a68f;--tx3:#9a8e7a;--acento:#e0b273;--acento-bg:rgba(213,160,92,.16);--acento-tx:#f0cf9a;--verde:#9fdcae;--verde-bg:rgba(80,170,110,.18);--verde-tx:#bfe8c9;--coral:#f09b9b;--coral-bg:rgba(226,75,74,.16);--coral-tx:#f6bdbd;--faixa:#1d1915;--faixa-tx:#f0e7d8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--acento)}
.ic{flex-shrink:0}
.faixa{background:var(--faixa);color:var(--faixa-tx);padding:10px 16px 12px;font-size:13px}
.faixa b{font-weight:600}
/* Linha 1: a chave Chat | Funções e, à direita, o selo do piloto e o site de sempre.
   Linha 2 (só administração): "Ver como" num controle segmentado discreto. */
.faixa .fx1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.faixa .fx-dir{display:flex;align-items:center;gap:12px;flex-shrink:0}
/* Topo novo (24/11/2026): saudação à esquerda; sino, escala, tema,
   compartilhar e conta à direita, iguais em toda tela. */
.faixa .fx-esq{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.faixa .fx-esq b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faixa .fx-esq small{font-size:11.5px;opacity:.7;margin-top:2px}
.faixa .fx-dir.ics{gap:6px}
.fx-ic{position:relative;width:30px;height:30px;border-radius:999px;border:1px solid var(--faixa-linha);display:inline-flex;align-items:center;justify-content:center;color:var(--faixa-tx);flex-shrink:0;text-decoration:none}
.fx-ic.on{background:rgba(255,255,255,.17)}
.fx-ic .cont{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;font-size:10.5px;padding:0 4px}
.faixa .fx-dir.ics{gap:8px}
.fx-ic .ic{width:16px;height:16px}
/* Chave dia/noite flutuante (24/11/2026): canto inferior direito, acima da
   barra de baixo; no chat sobe acima do campo de escrever. */
.tema-fl{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sup);color:var(--tx2);border:1px solid var(--linha);box-shadow:0 4px 14px rgba(0,0,0,.18)}
body[data-tela="chat"] .tema-fl{bottom:calc(176px + env(safe-area-inset-bottom))}
body.digitando .tema-fl{display:none}
@media (min-width:900px){.tema-fl,body[data-tela="chat"] .tema-fl{bottom:20px;right:20px}}
/* Conteúdo flutuante (26/11/2026): saiu da barra de baixo e virou bola no
   canto inferior esquerdo, espelhando a chave dia/noite da direita, na cor de
   destaque (onde ficava o Chat flutuante antes de ele voltar ao meio da
   barra). Some na própria tela do Conteúdo, ao digitar e no computador, onde
   a coluna da esquerda já tem o Conteúdo. */
.ct-fl{position:fixed;left:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--acento);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.28)}
:root[data-tema="escuro"] .ct-fl{color:#2b2620}
body[data-tela="chat"] .ct-fl{bottom:calc(176px + env(safe-area-inset-bottom))}
body[data-tela="conteudo"] .ct-fl,body.digitando .ct-fl{display:none}
@media (min-width:900px){.ct-fl{display:none}}
.conta-l{display:flex;flex-direction:column;gap:2px;margin:4px 0 0}
.conta-l a,.conta-l button{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 6px;border-radius:10px;color:var(--tx);font-size:15px;text-align:left;text-decoration:none;width:100%}
.conta-l a:hover,.conta-l button:hover{background:var(--bg)}
.conta-l .ic{color:var(--tx3)}
.conta-l hr{border:0;border-top:1px solid var(--linha);margin:6px 0}
/* Performance (24/11/2026): só quantidade, nenhum valor de dinheiro. */
.pf-sel{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.pf-sel select{min-height:44px;font:inherit;font-size:16px;padding:0 10px;border:1px solid var(--linha);border-radius:10px;background:var(--sup);color:var(--tx)}
.pf-tot{font-size:14px;color:var(--tx2);margin:0 0 10px}
.pf-tot b{font-size:22px;color:var(--tx);font-family:var(--serif);font-weight:500;margin-right:4px}
.pf-it{display:grid;grid-template-columns:28px 1fr auto;gap:2px 8px;align-items:center;padding:9px 0;border-top:1px solid var(--linha)}
.pf-it .pos{font-size:12px;color:var(--tx3);text-align:right}
.pf-it .nm{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-it .q{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.pf-it .br{grid-column:2/4;height:6px;border-radius:999px;background:var(--sup2);overflow:hidden}
.pf-it .br i{display:block;height:100%;background:var(--acento);border-radius:999px}
.pf-it .dl{font-size:12px;font-weight:600;margin-left:6px}
.pf-it .dl.up{color:var(--verde-tx)}
.pf-it .dl.dn{color:var(--coral-tx)}
/* Ranking (26/11/2026): pódio dos 3 primeiros + lista com a posição que
   subiu ou desceu em relação ao período anterior. */
.pf-pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;margin:6px 0 14px}
.pf-pod .pd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px 10px;border-radius:14px;background:var(--sup);border:1px solid var(--linha);min-width:0}
.pf-pod .pd.p1{padding-top:18px;background:var(--acento-bg);border-color:var(--acento)}
.pf-pod .md{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#2b2620;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.pf-pod .p1 .md{width:42px;height:42px;font-size:19px}
.pf-pod .p1 .md{background:#e3b341}.pf-pod .p2 .md{background:#c3c8ce}.pf-pod .p3 .md{background:#cf9461}
.pf-pod .nm{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:2.5em}
.pf-pod .p1 .nm{font-size:14.5px}
.pf-pod .q{font-family:var(--serif);font-size:20px;line-height:1}
.pf-pod .p1 .q{font-size:25px}
.pf-pod .sh{font-size:12px;color:var(--tx3)}
.pf-mv{font-size:11.5px;font-weight:700;white-space:nowrap}
.pf-mv.up{color:var(--verde-tx)}.pf-mv.dn{color:var(--coral-tx)}.pf-mv.eq{color:var(--tx3);font-weight:600}
.pf-it .pos{font-size:14px;font-weight:700;color:var(--tx2);text-align:center}
.pf-it .meio{min-width:0;display:flex;align-items:baseline;gap:6px}
.pf-it .meio .nm{flex:0 1 auto}
.pf-it .q small{display:block;font-size:11.5px;font-weight:500;color:var(--tx3)}
/* Busca do topo (24/11/2026): em toda tela, procura tela, ficha, venda e aula. */
.fx-busca{position:relative;margin-top:10px}
.fx-busca input{width:100%;height:40px;padding:0 14px 0 38px;border-radius:999px;border:1px solid var(--faixa-linha);background:rgba(255,255,255,.09);color:var(--faixa-tx);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.fx-busca input::placeholder{color:var(--faixa-tx);opacity:.6}
.fx-busca>.ic{position:absolute;left:13px;top:12px;width:16px;height:16px;opacity:.7;pointer-events:none}
.bg-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;max-height:min(62vh,520px);overflow:auto;background:var(--sup);color:var(--tx);border:1px solid var(--linha);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:6px 0}
.bg-res h4{margin:8px 14px 2px;font-size:11.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.03em}
.bg-res button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 14px;color:var(--tx);text-align:left;font-size:15px}
.bg-res button:hover,.bg-res button.foco{background:var(--bg)}
.bg-res button small{display:block;font-size:12.5px;color:var(--tx3);margin-top:1px}
.bg-res button .ic{color:var(--tx3)}
.bg-res p{margin:10px 14px;font-size:14px;color:var(--tx3)}
.pf-cats{margin:-4px 0 10px}
.pf-filtro{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--acento-bg,var(--sup2));color:var(--acento-tx);font-size:13.5px;font-weight:600}
.pf-filtro button{width:26px;height:26px;border-radius:50%;font-size:17px;line-height:1;color:inherit}
.faixa .site{padding:8px 0;color:var(--faixa-tx);opacity:.85;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.faixa .como{display:flex;align-items:center;gap:10px;margin-top:10px}
.faixa .como>span{font-size:12px;opacity:.7;flex-shrink:0}
.faixa .como .seg{flex:1;display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.07)}
.faixa .como .seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--faixa-tx);opacity:.8}
.faixa .como .seg button.on{background:rgba(255,255,255,.17);opacity:1;font-weight:600}
.app{display:flex;min-height:calc(100vh - 42px)}
.lado{display:none}
main{flex:1;min-width:0;padding:0 16px 104px}
.topo{padding:20px 0 12px}
.topo h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;margin:0}
.topo .sub{color:var(--tx2);font-size:14px;margin-top:4px}
#conteudo{display:flex;flex-direction:column;gap:14px;max-width:860px}
.blk{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:16px}
.blk h2{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px}
.blk.destaque{border:2px solid var(--acento)}
.blk p{margin:0}
.vazio{color:var(--tx3);font-size:14px}
.linha{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--linha);width:100%;text-align:left;text-decoration:none;color:inherit}
.blk h2+.linha,.blk .linha:first-child,.grupo h3+.ck{border-top:0}
.linha .t{flex:1;min-width:0}
.linha .t small{display:block;color:var(--tx3);font-size:12.5px;margin-top:2px}
.linha .v{color:var(--tx2);font-size:14px;white-space:nowrap}
a.linha .v::after,.linha.vai .v::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--tx3);border-top:2px solid var(--tx3);transform:rotate(45deg);margin-left:8px;vertical-align:1px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sup2);color:var(--tx2);white-space:nowrap}
.ok{background:var(--verde-bg);color:var(--verde-tx)}
.atencao{background:var(--acento-bg);color:var(--acento-tx)}
.ruim{background:var(--coral-bg);color:var(--coral-tx)}
.saud h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 4px}
.saud p{color:var(--tx2)}
.agora .tt{font-family:var(--serif);font-size:22px;margin:2px 0 4px}
.barra{height:10px;border-radius:5px;background:var(--sup2);overflow:hidden;margin:10px 0 8px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:5px;transition:width .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--acento);color:#fff;font-weight:600;text-decoration:none;font-size:15px}
:root[data-tema="escuro"] .btn{color:#2b2620}
.btn.sec{background:var(--sup2);color:var(--tx)}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
/* Ações do topo da parte Copos (24/11/2026): dois botões lado a lado, fora do
   cartão do resumo. */
/* Aviso de nova versão (24/11/2026), como o do site. */
.nova-v{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:60;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--faixa);color:var(--faixa-tx);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.nova-v span{flex:1}
.nova-v .ok{min-height:40px;padding:0 14px;border-radius:999px;background:var(--acento);color:#fff;font-weight:600}
.nova-v .x{width:36px;height:40px;font-size:22px;color:var(--faixa-tx);opacity:.7}
.inv-bts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.inv-bts .btn{width:100%;min-height:48px;padding:0 10px;font-size:14.5px;white-space:nowrap}
.qb-tot{display:flex;gap:8px;margin:6px 0 10px}
.qb-tot div{flex:1;padding:10px 12px;border-radius:12px;background:var(--bg)}
.qb-tot b{display:block;font-size:22px;font-family:var(--serif);font-weight:500}
.qb-tot small{font-size:12px;color:var(--tx3)}
/* Quebras por mês (24/11/2026): barras dos 12 meses, mês escolhido embaixo. */
.qb-barras{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:118px;margin:4px 0 2px}
.qb-barras button{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;padding:0;border-radius:8px}
.qb-barras .n{font-size:10.5px;color:var(--tx2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.qb-barras i{display:block;width:72%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--linha);min-height:3px}
.qb-barras .m{font-size:10px;color:var(--tx3);margin-top:4px;text-transform:uppercase}
.qb-barras button.tem i{background:var(--coral)}
.qb-barras button.on i{background:var(--acento)}
.qb-barras button.on .m{color:var(--acento-tx);font-weight:700}
.qb-nav{display:flex;align-items:center;gap:6px;margin:14px 0 6px;padding-top:12px;border-top:1px solid var(--linha)}
.qb-nav b{flex:1;font-family:var(--serif);font-weight:500;font-size:19px}
.qb-nav button{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--tx2);border:1px solid var(--linha)}
.qb-nav button[disabled]{opacity:.35}
.qb-res{font-size:13.5px;color:var(--tx2);margin-bottom:8px}
.qb-top{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.qb-dia{font-size:12px;font-weight:600;color:var(--tx3);margin:10px 0 0;text-transform:uppercase;letter-spacing:.02em}
.seg{display:inline-flex;background:var(--sup2);border-radius:999px;padding:3px;gap:2px}
.uz-tot{display:flex;flex-wrap:wrap;gap:8px 22px;margin:12px 0 4px;font-size:20px;font-weight:600}
.uz-tot small{display:block;font-size:12px;font-weight:400;color:var(--tx3)}
.uz-nota{font-size:13px;color:var(--tx3);margin:8px 0 0}
.uz-conta{display:flex;flex-direction:column;gap:8px}
.uz-cab{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.uz-cab .t{min-width:0}
.uz-cab small{display:block;color:var(--tx3);font-size:12.5px;font-weight:400}
.uz-cab .v{text-align:right;white-space:nowrap;font-size:14px}
.uz-num{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--tx2)}
.uz-tira{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.uz-tira i{display:block;height:14px;border-radius:3px;background:var(--sup2)}
.uz-tira i.n1{background:var(--verde);opacity:.3}
.uz-tira i.n2{background:var(--verde);opacity:.55}
.uz-tira i.n3{background:var(--verde);opacity:.8}
.uz-tira i.n4{background:var(--verde)}
.seg button{padding:9px 15px;border-radius:999px;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--sup);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.controles{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--tx2)}
.chk input{width:18px;height:18px;accent-color:var(--acento)}
.envios{display:flex;flex-wrap:wrap;gap:6px}
.grupo h3{font-size:13px;font-weight:600;color:var(--tx2);margin:14px 0 2px}
/* Rotina (24/11/2026): calendário e tarefas diárias x periódicas. */
.rc-sec{font-family:var(--serif);font-weight:500;font-size:19px;margin:18px 0 0;display:flex;align-items:baseline;gap:8px}
.rc-sec:first-child{margin-top:0}
.rc-sec small{font-family:var(--sans,inherit);font-size:12.5px;color:var(--tx3);font-weight:400}
.rc-cal .cab{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rc-cal .cab b{flex:1;font-family:var(--serif);font-weight:500;font-size:17px}
.rc-cal .cab button{height:34px;min-width:34px;border-radius:999px;font-size:18px;color:var(--tx2)}
.rc-cal .cab .mes-bt{font-size:13px;font-weight:600;padding:0 12px;border:1px solid var(--linha);color:var(--tx)}
.rc-cal .grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.rc-cal .grade .ds{font-size:10.5px;color:var(--tx3);text-transform:uppercase;text-align:center}
.rc-cal .grade button{border-radius:10px;padding:5px 0 6px;text-align:center;min-width:0}
.rc-cal .grade .n{font-size:15px;font-weight:600;line-height:1.2}
.rc-cal .grade button.on{background:var(--acento-bg);outline:1px solid var(--acento)}
.rc-cal .grade button.on .n{color:var(--acento-tx)}
.rc-cal .grade button.hj .n{text-decoration:underline;text-underline-offset:3px}
.rc-cal .grade button.fora .n{color:var(--tx3);opacity:.55}
.rc-cal .pts{display:flex;justify-content:center;gap:3px;height:6px;margin-top:3px}

.ch-opc button.on{background:var(--acento-bg);border-color:var(--acento);color:var(--acento-tx);font-weight:600}

    Object.keys(div).forEach(function (p) {
      (div[p] || []).forEach(function (id) { (out[id] = out[id] || []).push(p); });
    });
    return out;
  }
  function meusIds(d, turno) {
    if (!CTX.pessoa) return null;
    var div = (d.hoje && d.hoje.divisao && d.hoje.divisao[turno]) || {};
    var meu = null;
    Object.keys(div).forEach(function (p) {
      if (p.toLowerCase() === CTX.pessoa.toLowerCase()) meu = div[p] || [];
    });
    return meu;
  }

  // Semana da contagem: a de início mais recente que já começou. Sem página
  // da semana não é "atrasada": a página nasce pelo robô de sexta.
  function situacaoSemana(lista, tipo) {
    var hoje = RC.hoje();
    var doTipo = lista.filter(function (x) { return x.tipo === tipo && x.inicio && x.inicio <= hoje; })
      .sort(function (a, b) { return a.inicio < b.inicio ? 1 : -1; });
    var s = doTipo[0];
    if (!s) return { rotulo: 'sem semana aberta', cls: '', detalhe: 'Nenhuma semana nos últimos dois meses', semana: null };
    var dias = Math.round((new Date(hoje) - new Date(s.inicio)) / 86400000);
    var atual = dias < 7;
    if (s.itens) {
      return { rotulo: atual ? 'feita' : 'última feita', cls: atual ? 'ok' : 'atencao', semana: s,
        detalhe: rotSemana(s.semana) + ' · ' + s.itens + ' itens' + (s.responsavel ? ' · ' + quemContou(s.responsavel) : '') +
          (s.data ? ' · ' + dataBr(s.data) : '') };
    }
    return { rotulo: atual ? 'falta contar' : 'atrasada', cls: atual ? 'atencao' : 'ruim', semana: s,
      detalhe: rotSemana(s.semana) + ' aberta em ' + dataBr(s.inicio) };
  }

  // --- Turno: o checklist do dia, marcável -----------------------------------
  var turnoSel = null, faseSel = null, soMeus = null;

  // --- Calendário da Rotina (24/11/2026) --------------------------------------
  // Semana com setas e, num toque em "Mês", a grade do mês. Dia futuro mostra
  // o que está agendado (do horizonte publicado); dia passado mostra o que foi
  // marcado e os envios (D1). Marcar só no dia de hoje.
  var RCAL = { dia: null, ver: 'semana', ref: null, meses: {} };
  function rcMes(mes) {
    if (!RCAL.meses[mes]) RCAL.meses[mes] = api('/api/rotinas/mes?mes=' + mes).then(function (r) {
      if (!r.ok) delete RCAL.meses[mes];
      return r.ok ? r.d : null;
    });
    return RCAL.meses[mes];
  }
  function rcHoje() { return RC.diaOperacional(); }
  function rcDiaDe(d) { return (d && d.dia) || rcHoje(); }
  function rcEditavel(d) { return rcDiaDe(d) === rcHoje(); }
  function desenhaCal(el, c) {
    var hoje = rcHoje(), dia = RCAL.dia || hoje;
    var ref = RCAL.ref || dia;
    var h = '';
    var dias;
    if (RCAL.ver === 'mes') {
      var mesRef = ref.slice(0, 7), ini = mesRef + '-01';
      var x = dDate(ini);
      h += '<div class="cab"><button type="button" data-rc-nav="-1" aria-label="Mês anterior">‹</button><b>' +
        MESES[x.getUTCMonth()].replace(/^./, function (m) { return m.toUpperCase(); }) + ' ' + x.getUTCFullYear() +
        '</b><button type="button" data-rc-nav="1" aria-label="Próximo mês">›</button><button type="button" class="mes-bt" data-rc-ver="semana">Semana</button></div>';
      dias = semanaDe(ini);
      while (somaDias(dias[dias.length - 1], 1).slice(0, 7) === mesRef) dias = dias.concat(semanaDe(somaDias(dias[dias.length - 1], 1)));
    } else {
      dias = semanaDe(ref);
      var a = dDate(dias[0]), z = dDate(dias[6]);
      h += '<div class="cab"><button type="button" data-rc-nav="-1" aria-label="Semana anterior">‹</button><b>' +
        a.getUTCDate() + (a.getUTCMonth() !== z.getUTCMonth() ? ' ' + MESES[a.getUTCMonth()].slice(0, 3) : '') + ' a ' + z.getUTCDate() + ' ' + MESES[z.getUTCMonth()].slice(0, 3) +
        '</b><button type="button" data-rc-nav="1" aria-label="Próxima semana">›</button><button type="button" class="mes-bt" data-rc-ver="mes">Mês</button></div>';
    }
    h += '<div class="grade">' + DIAS_SEM.slice(1).concat(DIAS_SEM[0]).map(function (n) { return '<div class="ds">' + n + '</div>'; }).join('') +
      dias.map(function (d) {
        var fora = RCAL.ver === 'mes' && d.slice(0, 7) !== ref.slice(0, 7);
        return '<button type="button" data-rc-dia="' + d + '" class="' + (d === dia ? 'on ' : '') + (d === hoje ? 'hj ' : '') + (fora ? 'fora' : '') +
          '" aria-label="' + esc(diaTxt(d)) + '"><div class="n">' + dDate(d).getUTCDate() + '</div><div class="pts" data-rc-pt="' + d + '"></div></button>';
      }).join('') + '</div>' +
      '<div class="leg"><span><i style="background:var(--acento)"></i>periódica agendada</span><span><i style="background:var(--verde)"></i>dia com registro</span></div>';
    el.innerHTML = h;
    Array.prototype.forEach.call(el.querySelectorAll('[data-rc-dia]'), function (b) {
      b.addEventListener('click', function () {
        var d = b.getAttribute('data-rc-dia');
        RCAL.dia = d === hoje ? null : d; RCAL.ref = d;
        if (RCAL.ver === 'mes') RCAL.ver = 'semana';
        c.innerHTML = '';
        RCAL.interno = true;
        TELAS.turno(c);
        window.scrollTo(0, 0);
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-rc-nav]'), function (b) {
      b.addEventListener('click', function () {
        var n = Number(b.getAttribute('data-rc-nav'));
        if (RCAL.ver === 'mes') { var m = dDate(ref.slice(0, 7) + '-15'); m.setUTCMonth(m.getUTCMonth() + n); RCAL.ref = m.toISOString().slice(0, 10); }
        else RCAL.ref = somaDias(ref, 7 * n);
        desenhaCal(el, c);
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-rc-ver]'), function (b) {
      b.addEventListener('click', function () { RCAL.ver = b.getAttribute('data-rc-ver'); RCAL.ref = dia; desenhaCal(el, c); });
    });
    var meses = {};
    dias.forEach(function (d) { meses[d.slice(0, 7)] = 1; });
    Object.keys(meses).forEach(function (m) {
      rcMes(m).then(function (r) {
        if (!r) return;
        Object.keys(r.dias || {}).forEach(function (d) {
          var alvo = el.querySelector('[data-rc-pt="' + d + '"]'), x = r.dias[d];
          if (!alvo) return;
          alvo.innerHTML = (x.per && x.per.length ? '<i class="p"></i>' : '') + (d <= r.hoje && (x.feitos || x.envios) ? '<i class="v"></i>' : '');
          if (x.per && x.per.length) alvo.parentNode.title = x.per.join(' · ');
        });
      });
    });
  }

  TELAS.turno = function (c) {
    // Entrar na Rotina pelo menu volta para hoje; só o toque num dia do
    // calendário mantém o dia escolhido.
    if (!RCAL.interno) { RCAL.dia = null; RCAL.ref = null; RCAL.ver = 'semana'; }
    RCAL.interno = false;
    var hoje = rcHoje(), dia = RCAL.dia || hoje;
    topo(c, 'Rotina', dia === hoje ? 'Hoje · ' + hojeExtenso() : diaTxt(dia).replace(/^./, function (m) { return m.toUpperCase(); }));
    var cal = bloco(c, 'rc-cal');
    desenhaCal(cal, c);
    var b = bloco(c);
    var bl = bloco(c);
    var pede = dia === hoje ? dados.rotinas() : busca('rotinas:' + dia, function () { return api('/api/rotinas?dia=' + dia); });
    pede.then(function (r) {
      if (!r.ok) {
        if (r.status === 404) {
          var hz = r.d && r.d.horizonte;
          b.innerHTML = '<h2>Rotina</h2><p class="vazio">' + (dia === hoje ? 'A rotina de hoje ainda não foi publicada.'
            : dia > hoje ? 'Este dia ainda não foi planejado.' + (hz && hz.fim ? ' A rotina publicada vai até ' + esc(dataBr(hz.fim)) + '.' : '')
            : 'Sem registro neste dia.') + '</p>';
          bl.remove(); return;
        }
        falhou(b, 'Rotina', r); bl.remove(); return;
      }
      var d = r.d;
      if (!turnoSel) turnoSel = turnoPadrao(d);
      if (!faseSel) faseSel = BP.faseDoMomento(d.turnos_enviados, turnoSel).fase;
      var meus = meusIds(d, turnoSel);
      if (soMeus === null) soMeus = CTX.nivel === 'equipe' && !!(meus && meus.length);
      desenhaTurno(b, bl, d);
    });
  };

  function desenhaTurno(b, bl, d) {
    var meus = meusIds(d, turnoSel);
    var blocos = RC.blocosDaFase(faseSel);
    var prog = BP.progressoDoTurno(d, blocos, turnoSel);
    var rotProg = 'itens do time marcados neste turno';
    if (soMeus && meus && meus.length) {
      // Com o filtro, a barra conta o que a pessoa VÊ: a régua do time numa
      // lista só com os itens dela faria "0 de 9" com três itens na tela.
      var feitosT = BP.feitosNoTurno(d, turnoSel), mi = 0, mf = 0;
      BP.idsDaFase(d, blocos).forEach(function (id) {
        if (meus.indexOf(id) < 0) return;
        mi++; if (feitosT[id]) mf++;
      });
      prog = { feitos: mf, total: mi, pct: mi ? Math.round(mf / mi * 100) : 0 };
      rotProg = 'dos seus itens marcados';
    }
    var editavel = rcEditavel(d), futuro = rcDiaDe(d) > rcHoje();
    var h = editavel ? '' : '<p class="rc-aviso">' + (futuro
      ? 'Dia futuro: o que está agendado para ' + esc(diaTxt(rcDiaDe(d))) + '. Marcar fica para o dia.'
      : 'Histórico de ' + esc(diaTxt(rcDiaDe(d))) + ': o que foi marcado e os envios do turno.') + '</p>';
    if (d.passado) {
      var nTurno = 0, fT = BP.feitosNoTurno(d, turnoSel);
      Object.keys(fT).forEach(function () { nTurno++; });
      prog = null;
      rotProg = nTurno + (nTurno === 1 ? ' item marcado' : ' itens marcados') + ' no ' + TURNO_ROT[turnoSel].toLowerCase() + '.';
    }
    h += '<div class="controles">' +
      '<div class="seg" role="group" aria-label="Turno">' + ['Dia', 'Noite'].map(function (t) {
        return '<button type="button" data-turno="' + t + '" class="' + (t === turnoSel ? 'on' : '') + '" aria-pressed="' + (t === turnoSel) + '">' + TURNO_ROT[t] + '</button>';
      }).join('') + '</div>' +
      '<div class="seg" role="group" aria-label="Fase">' + [['abertura', 'Abertura'], ['fechamento', 'Fechamento']].map(function (f) {
        return '<button type="button" data-fase="' + f[0] + '" class="' + (f[0] === faseSel ? 'on' : '') + '" aria-pressed="' + (f[0] === faseSel) + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      (meus && meus.length ? '<label class="chk"><input type="checkbox" id="so-meus"' + (soMeus ? ' checked' : '') + '> Só os meus</label>' : '') +
      '</div>' + (futuro ? '' : !prog ? '<p class="vazio">' + rotProg + '</p>' :
      '<div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="' + prog.total + '" aria-valuenow="' + prog.feitos +
      '"><i style="width:' + prog.pct + '%"></i></div><p class="vazio">' + prog.feitos + ' de ' + prog.total + ' ' + rotProg + '</p>');
    if (pode('turno.envios') && !futuro) {
      var env = d.turnos_enviados || [];
      h += '<div class="envios" style="margin-top:10px">' + [['Dia', 'abertura'], ['Dia', 'fechamento'], ['Noite', 'abertura'], ['Noite', 'fechamento']].map(function (x) {
        var e = env.filter(function (y) { return BP._mesmoTurno(y.turno, x[0]) && y.fase === x[1]; })[0];
        return '<span class="pill ' + (e ? 'ok' : '') + '">' + TURNO_ROT[x[0]] + ' · ' + x[1] + (e ? ' · ' + esc(primeiroNome(e.pessoa)) : ' · não enviado') + '</span>';
      }).join('') + '</div>';
    }
    if (pode('turno.enviar') && editavel) {
      h += '<div class="acoes"><a class="btn sec" href="' + legado(faseSel === 'abertura' ? 'turno-abertura.html' : 'turno.html') +
        '">' + ic('camera', 18) + (faseSel === 'abertura' ? 'Enviar a abertura' : 'Enviar o fechamento') + ' com foto</a></div>';
    }
    b.innerHTML = h;
    Array.prototype.forEach.call(b.querySelectorAll('[data-turno]'), function (x) {
      x.addEventListener('click', function () {
        turnoSel = x.getAttribute('data-turno');
        faseSel = BP.faseDoMomento(d.turnos_enviados, turnoSel).fase;
        desenhaTurno(b, bl, d);
      });
    });
    Array.prototype.forEach.call(b.querySelectorAll('[data-fase]'), function (x) {
      x.addEventListener('click', function () { faseSel = x.getAttribute('data-fase'); desenhaTurno(b, bl, d); });
    });
    var sm = $('so-meus');
    if (sm) sm.addEventListener('change', function () { soMeus = sm.checked; desenhaTurno(b, bl, d); });
    desenhaLista(bl, d, blocos, meus);
  }

  function desenhaLista(bl, d, blocos, meus) {
    var feitos = BP.feitosNoTurno(d, turnoSel);
    var donos = pode('turno.divisao') ? donosPorItem(d, turnoSel) : {};
    var filtro = soMeus && meus ? meus : null;
    var meta = {};
    (d.blocos || []).forEach(function (x) { meta[x.chave] = x.rotulo; });
    var tarefasPorBloco = {};
    (d.tarefas || []).forEach(function (t) { (tarefasPorBloco[t.bloco || 'durante'] = tarefasPorBloco[t.bloco || 'durante'] || []).push(t); });
    var podeMarcar = pode('turno.marcar') && !CTX.como && rcEditavel(d);
    var h = '';
    // Diárias x periódicas (24/11/2026): item com frequência semanal,
    // quinzenal ou mensal (e o bloco "Periódicas") vai para a seção de baixo,
    // junto das tarefas pontuais; o resto é a rotina de todo dia.
    function periodico(id) { var it = d.itens[id]; return it.bloco === 'periodica' || !!RC.freqLegivel(it.freq); }
    function idsDe(bk) {
      return ((d.hoje && d.hoje.blocos && d.hoje.blocos[bk]) || []).filter(function (id) {
        return d.itens && d.itens[id] && (!filtro || filtro.indexOf(id) >= 0) && (!d.passado || feitos[id]);
      });
    }
    function linhaItem(id) {
      var it = d.itens[id];
      var tags = [];
      if (it.prio) tags.push('<span class="pill atencao">prioritário</span>');
      var fq = RC.freqLegivel(it.freq);
      if (fq) tags.push('<span>' + fq + '</span>');
      if (donos[id]) tags.push('<span>' + esc(donos[id].join(', ')) + '</span>');
      if (feitos[id] && feitos[id].pessoa) tags.push('<span>marcado por ' + esc(primeiroNome(feitos[id].pessoa)) + '</span>');
      return item(id, it.t, !!feitos[id], tags, podeMarcar);
    }
    var hd = '';
    blocos.forEach(function (bk) {
      if (bk === 'periodica') return;
      var ids = idsDe(bk).filter(function (id) { return !periodico(id); });
      if (!ids.length) return;
      hd += '<div class="grupo"><h3>' + esc(meta[bk] || bk) + '</h3>' + ids.map(linhaItem).join('') + '</div>';
    });
    var per = [];
    blocos.concat(blocos.indexOf('periodica') < 0 ? ['periodica'] : []).forEach(function (bk) {
      idsDe(bk).forEach(function (id) { if (periodico(id) && per.indexOf(id) < 0) per.push(id); });
    });
    var tarTodas = [];
    blocos.forEach(function (bk) {
      (tarefasPorBloco[bk] || []).forEach(function (t) {
        if (!filtro || !t.responsavel || t.responsavel.toLowerCase() === String(CTX.pessoa || '').toLowerCase()) tarTodas.push(t);
      });
    });
    h += '<h2 class="rc-sec">Tarefas diárias</h2>' + (hd || '<p class="vazio">' + (d.passado ? 'Nenhuma tarefa diária marcada neste turno.' : filtro ? 'Nada seu nesta fase. Desmarque "Só os meus" para ver o resto.' : 'Nada nesta fase.') + '</p>');
    h += '<h2 class="rc-sec">Tarefas periódicas <small>semanais, quinzenais, mensais e pontuais</small></h2>';
    if (per.length) h += '<div class="grupo">' + per.map(linhaItem).join('') + '</div>';
    if (tarTodas.length) {
      h += '<div class="grupo"><h3>Pontuais</h3>' + tarTodas.map(function (t) {
        var tags = ['<span class="pill">tarefa</span>'];
        if (t.prio) tags.push('<span class="pill atencao">prioritário</span>');
        if (t.prazo) tags.push('<span>até ' + dataBr(t.prazo) + '</span>');
        if (t.responsavel) tags.push('<span>para ' + esc(t.responsavel) + '</span>');
        return item(t.id, t.titulo, !!feitos[t.id], tags, podeMarcar);
      }).join('') + '</div>';
    }
    if (!per.length && !tarTodas.length) h += '<p class="vazio" data-rc-prox>Nenhuma tarefa periódica neste dia.</p>';
    bl.innerHTML = h;
    var px = bl.querySelector('[data-rc-prox]');
    if (px && !d.passado) {
      var dia0 = rcDiaDe(d), m0 = dia0.slice(0, 7), m1 = dDate(m0 + '-15'); m1.setUTCMonth(m1.getUTCMonth() + 1);
      Promise.all([rcMes(m0), rcMes(m1.toISOString().slice(0, 7))]).then(function (rs) {
        var achou = null;
        rs.forEach(function (r) {
          if (!r || achou) return;
          Object.keys(r.dias || {}).sort().forEach(function (k) { if (!achou && k > dia0 && r.dias[k].per && r.dias[k].per.length) achou = [k, r.dias[k].per]; });
        });
        if (achou && px.isConnected) px.textContent = 'Nenhuma tarefa periódica neste dia. A próxima: ' + diaTxt(achou[0]) + ' · ' + achou[1].join(', ') + '.';
      });
    }
    Array.prototype.forEach.call(bl.querySelectorAll('.ck'), function (x) {
      x.addEventListener('click', function () { marca(x, bl, d); });
    });
  }


  function item(id, titulo, feito, tags, podeMarcar) {
    return '<button type="button" class="ck' + (feito ? ' feito' : '') + '" data-id="' + esc(id) + '" data-feito="' + (feito ? 1 : 0) +
      '" aria-pressed="' + feito + '"' + (podeMarcar ? '' : ' aria-disabled="true"') + '><span class="box">' + ic('check-circle', 16) +
      '</span><span class="t"><span>' + esc(titulo) + '</span>' + (tags.length ? '<span class="tags">' + tags.join('') + '</span>' : '') + '</span></button>';
  }

  var pendente = null;
  function marca(x, bl, d) {
    if (CTX.como) { toast('Na prévia de outro nível, marcar fica desligado.'); return; }
    if (!pode('turno.marcar')) return;
    if (x.classList.contains('ocupado')) return;
    var senha = ls(LS.senha);
    if (!senha) { pedeSenha(x, bl, d, ''); return; }
    envia(x, bl, d, senha);
  }

  function envia(x, bl, d, senha) {
    var feito = x.getAttribute('data-feito') !== '1';
    x.classList.add('ocupado');
    api('/api/rotina/concluir', { metodo: 'POST', corpo: {
      senha_pessoa: senha, dia: RC.diaOperacional(), turno: turnoSel, item_id: x.getAttribute('data-id'), feito: feito,
    } }).then(function (r) {
      if (r.ok && r.d.ok) {
        lsPoe(LS.senha, senha);
        fechaSenha();
        toast(feito ? 'Marcado.' : 'Desmarcado.');
        // Recarrega do servidor: se alguém marcou no mesmo minuto, a tela
        // mostra a verdade dela também.
        dados.rotinas(true).then(function (n) {
          if (n.ok) { cache.rotinas = { em: Date.now(), p: Promise.resolve(n) }; desenhaTurno(bl.previousSibling, bl, n.d); }
          else x.classList.remove('ocupado');
        });
        return;
      }
      x.classList.remove('ocupado');
      if (r.status === 0) {
        filaPoe('/api/rotina/concluir', { senha_pessoa: senha, dia: RC.diaOperacional(), turno: turnoSel, item_id: x.getAttribute('data-id'), feito: feito },
          'um item da rotina');
        x.setAttribute('data-feito', feito ? '1' : '0');
        x.classList.toggle('feito', feito);
        fechaSenha();
        toast(feito ? 'Sem sinal: marquei aqui e envio quando voltar.' : 'Sem sinal: desmarquei aqui e envio quando voltar.');
        return;
      }
      if (r.status === 403 && /senha/i.test(r.d.erro || '')) {
        lsPoe(LS.senha, null);
        pedeSenha(x, bl, d, r.d.erro);
        return;
      }
      if (pendente) $('folha-erro').textContent = r.d.erro || 'Não consegui marcar agora.';
      toast(r.status === 0 ? 'Sem conexão: não marcou. Tente de novo com sinal.' : (r.d.erro || 'Não consegui marcar agora.'));
    });
  }

  function pedeSenha(x, bl, d, erro) {
    pendente = { x: x, bl: bl, d: d };
    $('folha-erro').textContent = erro || '';
    $('folha-senha').value = '';
    $('folha').classList.add('on');
    setTimeout(function () { $('folha-senha').focus(); }, 50);
  }
  function fechaSenha() { pendente = null; $('folha').classList.remove('on'); }
  $('folha-cancela').addEventListener('click', fechaSenha);
  $('folha').addEventListener('click', function (e) { if (e.target === $('folha')) fechaSenha(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pendente) fechaSenha(); });
  $('folha-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = $('folha-senha').value.trim();
    if (!s || !pendente) return;
    $('folha-erro').textContent = 'Conferindo...';
    envia(pendente.x, pendente.bl, pendente.d, s);
  });

  // --- Copos: a contagem contra o par e contra a anterior ---------------------
  // A conta de sumiço e quebra é a do mural do maître (reconcilia-vidraria.js),
  // nunca uma cópia. Aqui só se junta o que ela não cobre: o par do cadastro,
  // o que ficou sem contar e o que falta comprar. Dinheiro não entra nesta tela.
  function nomeK(s) { return RV ? RV._norm(s) : String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }

  function semanasUteis(hist) {
    return ((hist && hist.semanas) || []).map(function (s) {
      var d = '', tem = false;
      (s.copos || []).forEach(function (x) {
        if ((x.data || '') > d) d = x.data;
        if (typeof x.contagem === 'number' && x.contagem > 0) tem = true;
      });
      return { semana: s.semana, data: d, copos: s.copos || [], util: tem };
    }).filter(function (s) { return s.util; })
      .sort(function (a, b) { return a.data < b.data ? 1 : -1; });
  }

  function porNome(lista) {
    var m = {};
    lista.forEach(function (x) {
      var k = nomeK(x.nome);
      if (!k) return;
      if (m[k]) m[k].contagem += x.contagem || 0;
      else m[k] = { nome: x.nome, contagem: x.contagem || 0, lastro: x.lastro == null ? null : x.lastro, responsavel: x.responsavel || '' };
    });
    return m;
  }

  function controleCopos(hist, queb) {
    var uteis = semanasUteis(hist);
    if (!uteis.length) return null;
    var at = uteis[0], an = uteis[1] || null;
    var mA = porNome(at.copos), mB = an ? porNome(an.copos) : {};
    var rec = an && RV ? RV.reconciliaVidraria({ semanas: hist.semanas || [], meses: (queb && queb.meses) || [] }) : null;
    var recPor = {};
    if (rec && rec.ok) rec.itens.forEach(function (i) { recPor[nomeK(i.nome)] = i; });
    var linhas = [], vistos = {};
    function poe(nome, grupo, parCad) {
      var k = nomeK(nome);
      if (!k || vistos[k]) return;
      vistos[k] = 1;
      var a = mA[k], b = mB[k], r = recPor[k];
      // Par: o do cadastro manda; sem cadastro, o que veio carimbado na contagem.
      var par = parCad != null ? parCad : (a && a.lastro != null ? a.lastro : null);
      linhas.push({
        nome: (a && a.nome) || nome, grupo: grupo, par: par,
        atual: a ? a.contagem : null, anterior: b ? b.contagem : null,
        falta: a && par != null && par > a.contagem ? par - a.contagem : 0,
        reportado: r ? r.reportado : null, semExpl: r ? r.semExplicacao : null, incons: r ? !!r.inconsistente : false,
      });
    }
    COPOS.forEach(function (x) { poe(x.nome, x.grupo, x.lastro); });
    Object.keys(mA).forEach(function (k) { poe(mA[k].nome, 'outro', null); });
    Object.keys(mB).forEach(function (k) { poe(mB[k].nome, 'outro', null); });
    // Agrupa pela ordem dos grupos sem mexer na ordem da prateleira dentro de
    // cada um (é a ordem em que se conta).
    var ordemG = { copo: 0, equipamento: 1, outro: 2 };
    function og(g) { return Object.prototype.hasOwnProperty.call(ordemG, g) ? ordemG[g] : 2; }
    linhas = linhas.map(function (l, i) { return [l, i]; }).sort(function (x, y) {
      return (og(x[0].grupo) - og(y[0].grupo)) || x[1] - y[1];
    }).map(function (x) { return x[0]; });
    var resp = '';
    Object.keys(mA).some(function (k) { resp = mA[k].responsavel; return !!resp; });
    return { atual: at, anterior: an, rec: rec && rec.ok ? rec : null, linhas: linhas, responsavel: resp };
  }

  function totaisCopos(k) {
    var t = { abaixo: 0, itensAbaixo: 0, semPar: [], foraComPar: [], fora: [], sumiu: null, reportado: null, semExpl: null };
    k.linhas.forEach(function (l) {
      if (l.atual == null) { (l.par != null ? t.foraComPar : t.fora).push(l); return; }
      if (l.par == null) t.semPar.push(l);
      if (l.falta) { t.abaixo += l.falta; t.itensAbaixo++; }
    });
    if (k.rec) { t.sumiu = k.rec.totais.sumiu; t.reportado = k.rec.totais.reportado; t.semExpl = k.rec.totais.semExplicacao; }
    return t;
  }

  function kpi(valor, rotulo, cls) {
    return '<div class="kpi ' + (cls || '') + '"><b>' + (valor == null ? '—' : esc(valor)) + '</b><span>' + esc(rotulo) + '</span></div>';
  }

  // --- Controle (antes Inventário, 24/11/2026; renomeado em 26/11) -------------
  // Uma tela com partes: Copos (contagem, par, quebras), Insumos e produções
  // (contagens semanais), Equipamentos e Utensílios. Cada parte aparece para
  // quem tem a regra dela na PODE_APP. A parte vai no endereço:
  // #/inventario/<parte>.
  var INV_PARTES = [['copos', 'Copos', 'copos.ver'], ['insumos', 'Insumos e produções', 'contagem.ver'],
    ['equipamentos', 'Equipamentos', 'inventario.equipamentos'], ['utensilios', 'Utensílios', 'inventario.equipamentos']];
  var INV_DESENHA = {};
  function parteInventario() {
    var m = location.hash.match(/^#\/([a-z]+)(?:\/([a-z]+))?/) || [];
    if (m[1] === 'copos') return 'copos';
    if (m[1] === 'contagem') return 'insumos';
    return m[2] || '';
  }
  function telaInventario(c, forca) {
    var partes = INV_PARTES.filter(function (p) { return pode(p[2]); });
    var atual = forca || parteInventario();
    if (!partes.some(function (p) { return p[0] === atual; })) atual = partes.length ? partes[0][0] : '';
    topo(c, 'Controle', 'Copos, insumos, equipamentos e utensílios');
    if (partes.length > 1) {
      c.insertAdjacentHTML('beforeend', '<div class="chips inv-partes" role="tablist">' + partes.map(function (p) {
        var on = p[0] === atual;
        return '<button type="button" role="tab" aria-selected="' + on + '" data-inv="' + p[0] + '"' + (on ? ' class="on"' : '') + '>' + esc(p[1]) + '</button>';
      }).join('') + '</div>');
      Array.prototype.forEach.call(c.querySelectorAll('[data-inv]'), function (b) {
        b.addEventListener('click', function () {
          var alvo = '#/inventario/' + b.getAttribute('data-inv');
          // Trocar de parte não empilha histórico: o voltar sai do Controle.
          if (location.hash === alvo) return;
          history.replaceState(history.state, '', alvo);
          vai();
        });
      });
    }
    if (atual) INV_DESENHA[atual](c);
  }
  TELAS.inventario = function (c) { telaInventario(c); };
  // Worker anterior ao Inventário ainda manda Copos e Contagem no menu.
  TELAS.copos = function (c) { telaInventario(c, 'copos'); };
  TELAS.contagem = function (c) { telaInventario(c, 'insumos'); };

  var CAT_BUSCA = '', CAT_ABERTO = null, CAT_DADOS = null;
  TELAS.catalogo = function (c) {
    topo(c, 'Catálogo', 'Itens com preço e fornecedor');
    var b = bloco(c);
    function carrega(forca) {
      if (CAT_DADOS && !forca) return desenha();
      api('/api/custos').then(function (r) {

 e ácido, com o álcool presente sem queimar e a diluição certa. Limão muito ácido ou fruta pouco madura pedem atenção na prova.", "Prove com canudo descartável antes de servir quando usar fruta fresca. Se algo estiver fora, avise: a ficha pode precisar de ajuste."], "p": ["Doce demais: falta ácido. Ácido demais: falta doce.", "Prove com canudo, nunca com a colher do serviço.", "Ajuste de receita passa pela coordenação."], "n": null, "v": null, "vp": true}, {"id": "copo-guarnicao", "t": "Copo, guarnição e apresentação", "d": 3, "x": ["Cada drink tem o seu copo e a sua guarnição, e os dois estão na ficha. Copo gelado mantém o drink no ponto; copo quente rouba o frio logo no primeiro gole.", "Guarnição é aroma e acabamento: casca de cítrico torcida sobre o drink solta os óleos. Fruta murcha ou guarnição improvisada derruba a apresentação."], "p": ["Copo limpo, seco e, quando pedir, gelado.", "Pegue o copo pela base ou haste, nunca pela borda.", "Guarnição fresca, cortada no turno."], "n": null, "v": null, "vp": true}, {"id": "producoes", "t": "Produções: xaropes, sucos e pré-batches", "d": 3, "x": ["Xaropes, sucos espremidos, espumas e pré-batches são feitos antes do serviço para agilizar. A quantidade de cada dia vem no bom dia, calculada pela venda.", "Toda produção leva etiqueta com nome, data de preparo e validade. Passou da validade, vai fora, mesmo que pareça boa."], "p": ["Etiqueta em toda produção, sem exceção.", "Suco espremido não passa de um dia.", "Sobra anotada no fechamento ajusta a produção de amanhã."], "n": null, "v": null, "vp": true}]}, {"id": "vendas", "t": "Vendas e atendimento", "s": "Sugerir, encantar e resolver", "i": "pessoas", "c": "verde", "n": null, "a": [{"id": "sugestao-ativa", "t": "Sugestão ativa", "d": 3, "x": ["\"Vai beber alguma coisa?\" abre espaço para o não. Sugerir um ou dois drinks pelo nome, com uma frase curta sobre cada um, ajuda o cliente a decidir e aumenta a venda.", "Exemplo: \"Hoje o Gin Fitzgerald está saindo muito: é cítrico e refrescante. Se preferir algo mais doce, o Ladyberries vai bem.\""], "p": ["Sugira pelo nome, no máximo duas opções.", "Fale do sabor, não da receita.", "Sugira o que você conhece e gosta."], "n": null, "v": null, "vp": true}, {"id": "conhecer-carta", "t": "Conhecer a carta", "d": 4, "x": ["Quem conhece a carta vende melhor. Para cada drink, saiba dizer em três palavras a base, o sabor e a sensação: \"gin, cítrico, refrescante\".", "Saiba também quais drinks não têm álcool, quais são mais doces e quais levam ingredientes que costumam causar alergia, como ovo e castanha."], "p": ["Três palavras por drink: base, sabor, sensação.", "Tenha sempre uma opção sem álcool na ponta da língua.", "Dúvida sobre ingrediente? Consulte a ficha antes de responder."], "n": null, "v": null, "vp": true}, {"id": "momento-certo", "t": "O momento certo de oferecer", "d": 3, "x": ["Cada momento da mesa pede uma sugestão: aperitivo na chegada, drink ou vinho que combine com o prato, segunda rodada quando o copo estiver no fim e digestivo ou café no final.", "Oferecer a segunda rodada quando o copo está quase vazio funciona melhor do que esperar o cliente chamar."], "p": ["Copo com um quarto: ofereça a próxima.", "Na sobremesa, sugira um digestivo.", "Mesa em conversa séria: espere a pausa."], "n": null, "v": null, "vp": true}, {"id": "ler-mesa", "t": "Ler a mesa", "d": 3, "x": ["Observe antes de falar: comemoração pede algo especial, almoço de trabalho pede rapidez, casal pede discrição. A sugestão certa depende de quem está na mesa.", "Atenção também a quem já bebeu demais: oferecer água e algo para comer é cuidado com o cliente e com a casa."], "p": ["Comemoração: sugira algo para brindar.", "Pressa: sugira o que sai rápido.", "Excesso de álcool: água, comida e avise o maître."], "n": null, "v": null, "vp": true}, {"id": "reclamacao", "t": "Quando o cliente reclama", "d": 4, "x": ["Reclamação bem resolvida vira cliente fiel. Ouça até o fim sem interromper, peça desculpas pelo incô e, primeiro que sai.", "Abriu? Etiquete na hora.", "Na dúvida sobre a validade, descarte."], "n": null, "v": null, "vp": true}, {"id": "armazenamento", "t": "Armazenamento e temperatura", "d": 3, "x": ["Refrigerados ficam a no máximo 5 °C e congelados a -18 °C ou menos. Geladeira lotada ou porta aberta toda hora não segura a temperatura.", "Guarde tudo tampado e longe do chão. Cru embaixo, pronto em cima, para nada pingar no que vai direto para o copo."], "p": ["Geladeira até 5 °C; freezer a -18 °C.", "Tudo tampado e etiquetado.", "Nada direto no chão."], "n": null, "v": null, "vp": true}, {"id": "gelo-seguro", "t": "Gelo seguro", "d": 2, "x": ["Gelo é alimento. Só se usa gelo feito com água potável e se pega com a pá própria, que fica fora do gelo, nunca com copo ou com a mão.", "O gelo de consumo não serve para gelar garrafa ou lata: a parte de fora delas não é limpa. Copo quebrado perto do gelo obriga a descartar todo o gelo da cuba."], "p": ["Pá própria, nunca o copo.", "Gelo de consumo não gela garrafa.", "Vidro quebrou perto do gelo: descarte tudo."], "n": null, "v": null, "vp": true}, {"id": "alergenicos", "t": "Contaminação cruzada e alergênicos", "d": 3, "x": ["Contaminação cruzada é quando algo passa de um alimento para outro pela mão, pelo utensílio ou pela bancada. Para quem tem alergia, uma gota basta.", "Os alergênicos mais comuns no bar são leite, ovo, castanhas e amendoim, glúten e frutos do mar. Cliente com alergia: confira a ficha, use utensílio limpo e avise o maître."], "p": ["Cliente alérgico: confirme na ficha antes de servir.", "Utensílio limpo para cada preparo.", "Na dúvida, não sirva: pergunte."], "n": null, "v": null, "vp": true}]}], "glossario": [{"titulo": "Técnicas de preparo", "itens": [{"termo": "Shake / Batido", "def": "Agitar os ingredientes com gelo dentro do shaker para resfriar, diluir e misturar rápido — usado em drinks com suco, xarope, ovo ou laticínio."}, {"termo": "Dry shake", "def": "Bater o shaker sem gelo antes do shake normal, pra emulsionar clara de ovo ou espuma antes de resfriar."}, {"termo": "Stir / Montado", "def": "Mexer os ingredientes com uma colher de bar num copo/jarra com gelo — usado em drinks só com destilados/licores, sem turvar a bebida."}, {"termo": "Build / Direto no copo", "def": "Montar o drink direto no copo de serviço, sem shaker nem coqueteleira — o próprio gelo do copo faz a mistura."}, {"termo": "Blend", "def": "Bater no liquidificador com gelo — usado em drinks frozen."}, {"termo": "Muddle", "def": "Amassar frutas, ervas ou especiarias no fundo do copo/shaker pra liberar óleos e sabor antes de montar o drink."}, {"termo": "Double strain", "def": "Coar duas vezes (peneira do shaker + peneira fina/hawthorn) pra tirar lascas de gelo e polpa antes de servir."}, {"termo": "Float", "def": "Despejar um ingrediente por cima devagar, geralmente pelas costas de uma colher, pra ele ficar em camada por cima sem misturar."}, {"termo": "Rinse", "def": "Passar uma pequena quantidade de um licor forte (ex.: absinto) nas paredes do copo e descartar o excesso, só pro aroma."}, {"termo": "Gaseificado", "def": "Drink carbonatado — gás injetado (ex.: sistema Presh) na hora do preparo ou no pré-batch."}, {"termo": "Pré-batch", "def": "Ingredientes pré-misturados em lote antes do serviço, guardados prontos pra montar rápido no bar — ver Calculadora PB."}]}, {"titulo": "Copos", "itens": [{"termo": "Rocks / On the rocks", "def": "Copo baixo e largo, usado pra drinks servidos com gelo em cubo ou pedra (ex.: Old Fashioned, Negroni)."}, {"termo": "Long drink / Collins", "def": "Copo alto e estreito, usado pra drinks com mais volume de não-alcoólico (água com gás, suco) — mantém a bebida gelada por mais tempo."}, {"termo": "Coupé", "def": "Taça rasa e larga, usada pra drinks servidos sem gelo (batidos e coados)."}, {"termo": "Nick & Nora", "def": "Taça com bojo mais fechado que a coupé, mesma função — drinks batidos/servidos sem gelo, mais elegante pra reter aroma."}, {"termo": "Caneca de cobre / Mule", "def": "Caneca metálica usada tradicionalmente no Moscow Mule — mantém o drink gelado por mais tempo que o vidro."}, {"termo": "Decanter", "def": "Jarra de vidro usada pra servir porções maiores (sucos, drinks compartilhados) na mesa."}]}, {"titulo": "Gelo", "itens": [{"termo": "Cubo", "def": "Gelo comum, usado em build e long drinks."}, {"termo": "Pedra", "def": "Gelo grande e denso, derrete mais devagar — usado em drinks fortes servidos on the rocks."}, {"termo": "Crushed", "def": "Gelo triturado, usado em drinks frozen ou julep — resfria rápido mas dilui mais rápido também."}]}, {"titulo": "Outros termos do bar", "itens": [{"termo": "Guarnição", "def": "Elemento decorativo/aromático do drink (casca de fruta, folha, especiaria) — parte da apresentação e às vezes do aroma."}, {"termo": "Dose", "def": "Medida padrão de destilado usada na ficha técnica da casa, normalmente em ml."}, {"termo": "Curva ABC", "def": "Classificação dos produtos pela receita acumulada: A = 0–80%, B = 80–95%, C = 95–100% — ver Ranking de produtos."}, {"termo": "CMV", "def": "Custo da Mercadoria Vendida — quanto custa o insumo de um drink em relação ao preço de venda."}]}], "treinamentos": []};

  // aparece: protegido:performance nasce sem valor de dinheiro
  // (bento/performance_base.py).
  var PF = { grupo: 'coqueteis', per: null, dados: null, cat: 'todas', busca: '' };
  function pfNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function pfPega() {
    return PF.dados ? Promise.resolve({ ok: true, d: PF.dados }) : api('/api/protegido/performance').then(function (r) {
      if (!r.ok) return r;
      try { PF.dados = JSON.parse(r.d.conteudo); return { ok: true, d: PF.dados }; }
      catch (e) { return { ok: false, status: 500, d: { erro: 'Os números vieram num formato que eu não conheço.' } }; }
    });
  }
  // Categoria do coquetel = a seção da ficha técnica (Autorais, Clássicos,
  // Tonic & Spritz, Caipirinhas, Mocktails). O PDV só diz "Drinks e coquetéis",
  // então a casca casa o nome com as fichas que já carrega; o que não casa cai
  // numa regra pelo nome e, sem regra, em "Outros".
  var PF_CATS = null;
  function pfCat(nome) {
    var n = ' ' + norm(nome) + ' ';
    if (/^ caipi?/.test(n)) return 'caipirinhas';
    if (/ (soda italiana|mocktail|luci|lady ?berries) /.test(n)) return 'mocktails';
    if (!PF_CATS) {
      PF_CATS = [];
      (FICHAS.fichas || []).forEach(function (f) {
        if (f.s === 'producoes' || f.s === 'caipirinhas') return;
        var k = norm(String(f.n).replace(/\(.*?\)/g, ''));
        if (k.length >= 4) PF_CATS.push([' ' + k + ' ', f.s]);
      });
      PF_CATS.sort(function (a, z) { return z[0].length - a[0].length; });
    }
    for (var i = 0; i < PF_CATS.length; i++) if (n.indexOf(PF_CATS[i][0]) >= 0) return PF_CATS[i][1];
    // Grafias que o PDV e a ficha escrevem diferente ("Veltet" é a da ficha).
    if (/ velvet berries | veltet berries /.test(n)) return 'autorais';
    if (/ whiske?y sour | mark twain /.test(n)) return 'classicos';
    if (/ (spritz|tonica?|tonico|tonic|clericot|kir royal) /.test(n)) return 'tonic';
    return 'outros';
  }
  TELAS.performance = function (c) {
    topo(c, 'Ranking', 'Os coquetéis e sucos que mais saem');
    var b = bloco(c);
    pfPega().then(function (r) {
      if (!r.ok) { falhou(b, 'Ranking', r); return; }
      pfDesenha(b, r.d);
    });
  };
  function pfDesenha(b, d) {
    var g = PF.grupo, meses = d.meses || [], ult = (d.ultimo_mes_com_dado || {})[g];
    var doGrupo = (d.itens || []).filter(function (x) { return x.grupo === g; });
    // Categorias só dos coquetéis (suco é uma coisa só); só as que têm item.
    var nomesCat = {};
    (FICHAS.secoes || []).forEach(function (x) { nomesCat[x[0]] = x[1]; });
    nomesCat.outros = 'Outros';
    var cats = [];
    if (g === 'coqueteis') doGrupo.forEach(function (x) { var k = pfCat(x.nome); if (cats.indexOf(k) < 0) cats.push(k); });
    cats.sort(function (a, z) { var o = ['autorais', 'classicos', 'tonic', 'caipirinhas', 'mocktails', 'outros']; return o.indexOf(a) - o.indexOf(z); });
    if (cats.indexOf(PF.cat) < 0) PF.cat = 'todas';
    var bq = norm(PF.busca);
    var itens = doGrupo.filter(function (x) {
      return (PF.cat === 'todas' || pfCat(x.nome) === PF.cat) && (!bq || norm(x.nome).indexOf(bq) >= 0);
    });
    if (ult == null || ult < 0 || !doGrupo.length) { b.innerHTML = '<h2>Ranking</h2><p class="vazio">Sem vendas deste grupo na base.</p>'; return; }
    // Períodos: cada mês com dado, mais os últimos 3 e os últimos 12 meses.
    var opc = [['3m', 'Últimos 3 meses'], ['12m', 'Últimos 12 meses']];
    for (var i = ult; i >= 0; i--) opc.push(['m' + i, meses[i]]);
    if (!PF.per || !opc.some(function (o) { return o[0] === PF.per; })) PF.per = 'm' + ult;
    var janela = function (per) {
      if (per === '3m') return [Math.max(0, ult - 2), ult];
      if (per === '12m') return [Math.max(0, ult - 11), ult];
      var k = Number(per.slice(1)); return [k, k];
    };
    var jn = janela(PF.per), tam = jn[1] - jn[0] + 1;
    var ant = PF.per === '12m' || jn[0] - tam < 0 ? null : [jn[0] - tam, jn[0] - 1];
    var soma = function (x, j) { var t = 0; for (var k = j[0]; k <= j[1]; k++) t += x.q[k] || 0; return t; };
    var ultimaVenda = function (x) { for (var k = x.q.length - 1; k >= 0; k--) if (x.q[k]) return k; return -1; };
    var lista = [], semDado = [];
    itens.forEach(function (x) {
      var q = soma(x, jn), uv = ultimaVenda(x);
      if (q > 0) lista.push({ nome: x.nome, q: q, a: ant ? soma(x, ant) : null });
      else if (uv >= 0 && uv < jn[0] && uv < ult) semDado.push({ nome: x.nome, uv: uv });
    });
    lista.sort(function (a, z) { return z.q - a.q || a.nome.localeCompare(z.nome); });
    // Posição no período anterior, para mostrar quem subiu ou desceu.
    var posAnt = {};
    if (ant) {
      itens.map(function (x) { return { nome: x.nome, q: soma(x, ant) }; })
        .filter(function (x) { return x.q > 0; })
        .sort(function (a, z) { return z.q - a.q || a.nome.localeCompare(z.nome); })
        .forEach(function (x, k) { posAnt[x.nome] = k + 1; });
    }
    var mov = function (x, k) {
      if (!ant) return '';
      var pa = posAnt[x.nome];
      if (!pa) return '<span class="pf-mv up">novo</span>';
      var d = pa - (k + 1);
      return d > 0 ? '<span class="pf-mv up" title="subiu ' + d + '">▲' + d + '</span>'
        : d < 0 ? '<span class="pf-mv dn" title="desceu ' + (-d) + '">▼' + (-d) + '</span>'
        : '<span class="pf-mv eq" title="mesma posição">=</span>';
    };
    var parte = function (q) { var pc = tot ? q / tot * 100 : 0; return (pc >= 10 ? Math.round(pc) : Math.round(pc * 10) / 10).toString().replace('.', ',') + '%'; };
    var max = lista.length ? lista[0].q : 1, tot = lista.reduce(function (t, x) { return t + x.q; }, 0);
    var nomePer = opc.filter(function (o) { return o[0] === PF.per; })[0][1];
    var h = '<div class="chips inv-partes" role="tablist">' + [['coqueteis', 'Coquetéis'], ['sucos', 'Sucos']].map(function (p) {
      var on = p[0] === g;
      return '<button type="button" role="tab" aria-selected="' + on + '" data-pf-g="' + p[0] + '"' + (on ? ' class="on"' : '') + '>' + p[1] + '</button>';
    }).join('') + '</div>' +
      (cats.length > 1 ? '<div class="chips pf-cats" role="group" aria-label="Categoria">' + [['todas', 'Todas']].concat(cats.map(function (k) { return [k, nomesCat[k] || k]; })).map(function (x) {
        var on = x[0] === PF.cat;
        return '<button type="button" data-pf-cat="' + x[0] + '" aria-pressed="' + on + '"' + (on ? ' class="on"' : '') + '>' + esc(x[1]) + '</button>';
      }).join('') + '</div>' : '') +
      (PF.busca ? '<span class="pf-filtro">Busca: ' + esc(PF.busca) + '<button type="button" data-pf-limpa aria-label="Tirar a busca">×</button></span>' : '') +
      '<label class="pf-sel">Período <select data-pf-per>' + opc.map(function (o) {
        return '<option value="' + o[0] + '"' + (o[0] === PF.per ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select></label>' +
      '<p class="pf-tot"><b>' + pfNum(tot) + '</b>' + (g === 'sucos' ? 'sucos' : PF.cat !== 'todas' ? esc((nomesCat[PF.cat] || '').toLowerCase()) : 'coquetéis') + ' em ' + esc(nomePer.toLowerCase().indexOf('últimos') === 0 ? nomePer.toLowerCase() : nomePer) +
      (ant ? ' · comparado com ' + (tam === 1 ? esc(meses[ant[0]]) : 'os ' + tam + ' meses anteriores') : '') + '</p>';
    // Pódio dos 3 primeiros (2º, 1º, 3º, como no pódio) e a lista do 4º em diante.
    var pod = lista.slice(0, 3);
    if (pod.length === 3) {
      h += '<div class="pf-pod">' + [1, 0, 2].map(function (k) {
        var x = pod[k];
        return '<div class="pd p' + (k + 1) + '"><span class="md">' + (k + 1) + '</span><span class="nm">' + esc(x.nome) + '</span>' +
          '<span class="q">' + pfNum(x.q) + '</span><span class="sh">' + parte(x.q) + ' do total</span>' + mov(x, k) + '</div>';
      }).join('') + '</div>';
    }
    var resto = pod.length === 3 ? lista.slice(3) : lista, ini = pod.length === 3 ? 3 : 0;
    h += lista.length ? resto.map(function (x, i) {
      var k = i + ini;
      return '<div class="pf-it"><span class="pos">' + (k + 1) + 'º</span><span class="meio"><span class="nm">' + esc(x.nome) + '</span>' + mov(x, k) + '</span>' +
        '<span class="q">' + pfNum(x.q) + '<small>' + parte(x.q) + '</small></span><span class="br"><i style="width:' + Math.max(2, Math.round(x.q / max * 100)) + '%"></i></span></div>';
    }).join('') : '<p class="vazio">Nenhuma venda neste período.</p>';
    if (semDado.length) {
      // Sucos: a categoria "Sucos" só vem no relatório até fev/26 (o filtro
      // do PDV mudou em mar/26). Coquetel sem venda é coquetel que saiu.
      h += '<h3 class="ct-sec">Sem venda neste período</h3>' + (g === 'sucos'
        ? '<p class="vazio" style="margin-top:0">Os sucos da categoria Sucos só vêm no relatório até fev/26: o relatório do PDV mudou em mar/26. Sumir daqui não quer dizer que pararam de vender.</p>' : '') +
        semDado.map(function (x) {
          return '<div class="ct-it"><b>' + esc(x.nome) + '</b><p>última venda: ' + esc(meses[x.uv]) + '</p></div>';
        }).join('');
    }
    h += '<p class="vazio" style="margin-top:14px">Só quantidade, sem faturamento. De mar/26 em diante o relatório de vendas é outro: compare esses meses com os anteriores com cuidado.</p>';
    b.innerHTML = h;
    Array.prototype.forEach.call(b.querySelectorAll('[data-pf-g]'), function (x) {
      x.addEventListener('click', function () { PF.grupo = x.getAttribute('data-pf-g'); PF.per = null; PF.cat = 'todas'; pfDesenha(b, d); });
    });
    Array.prototype.forEach.call(b.querySelectorAll('[data-pf-cat]'), function (x) {
      x.addEventListener('click', function () { PF.cat = x.getAttribute('data-pf-cat'); pfDesenha(b, d); });
    });
    var bl = b.querySelector('[data-pf-limpa]');
    if (bl) bl.addEventListener('click', function () { PF.busca = ''; pfDesenha(b, d); });
    b.querySelector('[data-pf-per]').addEventListener('change', function (e) { PF.per = e.target.value; pfDesenha(b, d); });
  }

  // --- Busca do topo (24/11/2026) ---------------------------------------------
  // Um campo só, em toda tela. Procura no que a casca já tem (telas do menu,
  // fichas técnicas, aulas do Conteúdo) e nas vendas de coquetel e suco (só
  // para quem vê a Performance; busca o número na primeira vez que o campo
  // ganha foco). Tocar num resultado abre a tela já filtrada.
  var BG = { foco: -1 };
  function bgIndice() {
    var out = [];
    CTX.nav.forEach(function (t) {
      out.push({ g: 'Telas', t: t.rotulo, d: '', i: t.icone || 'list', ir: function () { bgVai('#/' + t.id); } });
    });
    if (pode('caixa.ver')) out.push({ g: 'Telas', t: 'Caixa de entrada', d: 'avisos e respostas', i: 'sino', ir: function () { bgVai('#/caixa'); } });
    if (pode('fichas.ver')) (FICHAS.fichas || []).forEach(function (f) {
      var ings = (f.i || []).map(function (x) { return x[1]; }).join(' ');
      out.push({ g: 'Fichas técnicas', t: String(f.n).replace(/\s*\(.*?\)\s*/g, ' ').trim(), d: (f.i || []).slice(0, 3).map(function (x) { return x[1]; }).join(', '),
        x: ings, i: 'cocktail', ir: function () { fichaSec = 'todas'; fichaBusca = String(f.n).replace(/\s*\(.*?\)\s*/g, ' ').trim(); bgVai('#/fichas'); } });
    });
    if (PF.dados && pode('performance.ver')) (PF.dados.itens || []).forEach(function (x) {
      var tot = x.q.reduce(function (a, v) { return a + (v || 0); }, 0);
      out.push({ g: 'Vendas', t: x.nome, d: (x.grupo === 'sucos' ? 'suco' : 'coquetel') + ' · ' + pfNum(tot) + ' vendidos no histórico', i: 'grafico',
        ir: function () { PF.grupo = x.grupo; PF.cat = 'todas'; PF.per = null; PF.busca = x.nome; bgVai('#/performance'); } });
    });
    if (pode('conteudo.ver')) ctModulos().forEach(function (m) {
      m.a.forEach(function (a) {
        out.push({ g: 'Conteúdo', t: a.t, d: m.t, i: 'estudo', ir: function () { bgVai('#/conteudo/a/' + m.id + '/' + a.id); } });
      });
    });
    return out;
  }
  function bgVai(h) {
    var inp = $('busca-g');
    if (inp) { inp.value = ''; inp.blur(); }
    bgFecha();
    if (location.hash === h) vai(); else location.hash = h;
    window.scrollTo(0, 0);
  }
  function bgFecha() {
    var r = $('busca-res'), inp = $('busca-g');
    if (r) { r.hidden = true; r.innerHTML = ''; }
    if (inp) inp.setAttribute('aria-expanded', 'false');
    BG.foco = -1; BG.lista = [];
  }
  function bgProcura(q) {
    var r = $('busca-res'), inp = $('busca-g');
    var t = norm(q);
    if (!t) { bgFecha(); return; }
    var pal = t.split(' ');
    var achados = bgIndice().map(function (x) {
      var nt = norm(x.t), nx = nt + ' ' + norm(x.d) + ' ' + norm(x.x || '');
      if (!pal.every(function (w) { return nx.indexOf(w) >= 0; })) return null;
      var pts = nt === t ? 0 : nt.indexOf(t) === 0 ? 1 : nt.indexOf(t) >= 0 ? 2 : 3;
      return { x: x, p: pts };
    }).filter(Boolean).sort(function (a, z) { return a.p - z.p || a.x.t.localeCompare(z.x.t); });
    var ordem = ['Telas', 'Fichas técnicas', 'Vendas', 'Conteúdo'], h = '', lista = [];
    ordem.forEach(function (g) {
      var dg = achados.filter(function (a) { return a.x.g === g; }).slice(0, g === 'Telas' ? 4 : 6);
      if (!dg.length) return;
      h += '<h4>' + esc(g) + '</h4>' + dg.map(function (a) {
        lista.push(a.x);
        return '<button type="button" role="option" data-bg="' + (lista.length - 1) + '">' + ic(a.x.i, 18) + '<span>' + esc(a.x.t) + (a.x.d ? '<small>' + esc(a.x.d) + '</small>' : '') + '</span></button>';
      }).join('');
    });
    BG.lista = lista; BG.foco = -1;
    r.innerHTML = h || '<p>Nada encontrado para “' + esc(q.trim()) + '”.</p>';
    r.hidden = false;
    inp.setAttribute('aria-expanded', 'true');
  }
  function bgMarca(n) {
    var as = document.querySelectorAll('#busca-res [data-bg]');
    if (!as.length) return;
    BG.foco = (n + as.length) % as.length;
    Array.prototype.forEach.call(as, function (a, k) { a.classList.toggle('foco', k === BG.foco); });
    as[BG.foco].scrollIntoView({ block: 'nearest' });
  }
  function ligaBusca() {
    var inp = $('busca-g'), r = $('busca-res');
    if (!inp) return;
    var espera = null;
    var pedindo = false;
    function vendas() {
      // As vendas chegam na primeira busca (foco ou digitação) e refazem a lista.
      if (PF.dados || pedindo || !pode('performance.ver')) return;
      pedindo = true;
      pfPega().then(function () { pedindo = false; if (inp.value.trim() && !r.hidden) bgProcura(inp.value); });
    }
    inp.addEventListener('focus', function () {
      vendas();
      if (inp.value.trim()) bgProcura(inp.value);
    });
    inp.addEventListener('input', function () { vendas(); clearTimeout(espera); espera = setTimeout(function () { bgProcura(inp.value); }, 120); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); bgMarca(BG.foco + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); bgMarca(BG.foco - 1); }
      else if (e.key === 'Escape') { inp.value = ''; bgFecha(); inp.blur(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        var x = BG.lista && BG.lista[BG.foco >= 0 ? BG.foco : 0];
        if (x) x.ir();
      }
    });
    r.addEventListener('mousedown', function (e) { e.preventDefault(); }); // não perde o foco antes do clique
    r.addEventListener('click', function (e) {
      var a = e.target.closest('[data-bg]');
      if (!a) return;
      e.preventDefault();
      var x = BG.lista[Number(a.getAttribute('data-bg'))];
      if (x) x.ir();
    });
    inp.addEventListener('blur', function () { setTimeout(bgFecha, 150); });
  }

  // --- Eventos (24/11/2026) ---------------------------------------------------
  // Agenda de eventos da casa: reserva grande, evento no hotel, data
  // comemorativa. Todos veem; maître, administração e marketing lançam.
  var EV = { editando: null, novo: null };
  function evForm(e, tipos) {
    var x = e || {};
    return '<form class="mk-f" data-ev-form' + (x.id ? ' data-id="' + x.id + '"' : '') + '>' +
      '<label>Data<input type="date" name="data" required value="' + esc(x.data || isoLocal(new Date())) + '"></label>' +
      '<label>Hora<input type="time" name="hora" value="' + esc(x.hora || '') + '"></label>' +
      '<label class="w">Evento<input name="titulo" required maxlength="140" placeholder="Ex.: Aniversário, 30 pessoas no salão" value="' + esc(x.titulo || '') + '"></label>' +
      '<label>Tipo<select name="tipo">' + tipos.map(function (t) { return '<option' + (t === (x.tipo || tipos[0]) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></label>' +
      '<label>Pessoas<input type="number" name="pessoas" min="0" max="5000" inputmode="numeric" value="' + (x.pessoas == null ? '' : x.pessoas) + '"></label>' +
      '<label class="w">O que o bar precisa saber<textarea name="obs" maxlength="1500" placeholder="Cardápio fechado, open bar, horário de montagem…">' + esc(x.obs || '') + '</textarea></label>' +
      '<div class="acoes"><button type="submit" class="btn">Salvar</button><button type="button" class="btn sec" data-ev-fecha>Fechar</button>' +
      (x.id ? '<button type="button" class="btn sec" data-ev-apaga>Apagar</button>' : '') + '</div></form>';
  }
  TELAS.eventos = function (c) {
    topo(c, 'Eventos', 'O que vem por aí na casa');
    evLista(c);
  };
  function evLista(c) {
    var b = bloco(c);
    api('/api/eventos').then(function (r) {
      if (!r.ok) { falhou(b, 'Eventos', r); return; }
      var d = r.d, ed = d.pode_editar && pode('eventos.editar') && !CTX.como;
      var h = '<div class="cc-cab"><h2>Agenda de eventos</h2>' + (ed && !EV.novo ? '<button type="button" class="btn" data-ev-novo>Novo evento</button>' : '') + '</div>';
      if (EV.novo && ed) h += evForm(EV.novo, d.tipos);
      var porDia = {};
      d.eventos.forEach(function (x) { (porDia[x.data] = porDia[x.data] || []).push(x); });
      var dias = Object.keys(porDia).sort();
      var futuros = dias.filter(function (x) { return x >= d.hoje; }), passados = dias.filter(function (x) { return x < d.hoje; }).reverse();
      var linha = function (x) {
        if (EV.editando === x.id && ed) return '<div class="mk-p"><div class="n">' + evForm(x, d.tipos) + '</div></div>';
        var info = [x.tipo];
        if (x.hora) info.push(x.hora.replace(':', 'h'));
        if (x.pessoas != null) info.push(x.pessoas + ' pessoas');
        return '<div class="mk-p"><div class="n"><b>' + esc(x.titulo) + '</b><small>' + esc(info.join(' · ')) + '</small>' +
          (x.obs ? '<p>' + esc(x.obs) + '</p>' : '') + '</div>' +
          (ed ? '<button type="button" class="ed" data-ev-ed="' + x.id + '">Editar</button>' : '') + '</div>';
      };
      var sec = function (lista) {
        return lista.map(function (dia) {
          return '<div class="mk-dia' + (dia === d.hoje ? ' hoje' : '') + '">' + (dia === d.hoje ? 'Hoje · ' : '') + esc(diaTxt(dia)) + '</div>' + porDia[dia].map(linha).join('');
        }).join('');
      };
      h += '<h3 class="ct-sec">Próximos</h3>' + (futuros.length ? sec(futuros) : '<p class="vazio">Nenhum evento marcado' + (ed ? '. Use "Novo evento" para pôr o próximo.' : '.') + '</p>');
      if (passados.length) h += '<h3 class="ct-sec">Últimos 30 dias</h3>' + sec(passados);
      b.innerHTML = h;
      var re = function () { evLista((b.remove(), c)); };
      var nv = b.querySelector('[data-ev-novo]');
      if (nv) nv.addEventListener('click', function () { EV.novo = {}; EV.editando = null; re(); });
      Array.prototype.forEach.call(b.querySelectorAll('[data-ev-ed]'), function (x) {
        x.addEventListener('click', function () { EV.editando = Number(x.getAttribute('data-ev-ed')); EV.novo = null; re(); });
      });
      var f = b.querySelector('[data-ev-form]');
      if (!f) return;
      f.querySelector('[data-ev-fecha]').addEventListener('click', function () { EV.editando = null; EV.novo = null; re(); });
      var ap = f.querySelector('[data-ev-apaga]');
      if (ap) ap.addEventListener('click', function () {
        if (!window.confirm('Apagar este evento?')) return;

  // --- Contar copos no app (24/11/2026, pedido do Rodrigo) --------------------
  // A mesma gravação da página contagem-copos.html (POST /api/contagem/copos,
  // agora com o token da sessão): item em branco é "não contei" e não vai; zero
  // digitado vai. O rascunho fica no aparelho até enviar (12 h). Reenviar na
  // mesma semana corrige, não duplica (o worker faz upsert pela semana).
  var CC_RASC = 'app_piloto_copos_rascunho';
  var CONTANDO_COPOS = false;
  function rascCopos() {
    try {
      var r = JSON.parse(ls(CC_RASC) || 'null');
      if (r && r.em && Date.now() - r.em < 12 * 3600e3) return r.v || {};
    } catch (e) {}
    return {};
  }
  function desenhaContarCopos(c) {
    var v = rascCopos();
    var grupos = {};
    COPOS.forEach(function (x) { (grupos[x.grupo] = grupos[x.grupo] || []).push(x); });
    var b = bloco(c);
    var h = '<div class="cc-cab"><h2>Contar copos</h2><button type="button" class="btn sec" data-cc="sair">Fechar</button></div>' +
      '<p class="vazio" style="margin-top:6px">Conte o que está no bar agora. Deixe em branco o que não contou; zero é zero.</p>';
    if (!CTX.pessoa) h += '<input class="cc-quem" id="cc-quem" placeholder="Quem contou" aria-label="Quem contou" value="' + esc(ls('bento_contagem_nome') || '') + '">';
    ['copo', 'equipamento', 'outro'].forEach(function (g) {
      if (!grupos[g]) return;
      h += '<div class="cc-g"><span>' + esc(GRUPO_ROT[g]) + '</span><span data-ccg="' + g + '"></span></div>' + grupos[g].map(function (x) {
        var val = v[x.nome] != null ? String(v[x.nome]) : '';
        return '<div class="cc-l" data-g="' + g + '"><div class="cc-n"><b>' + esc(x.nome) + '</b>' + (x.lastro != null ? '<small>par ' + esc(x.lastro) + '</small>' : '') +
          '</div><div class="cc-s"><button type="button" data-cc="menos" aria-label="Menos ' + esc(x.nome) + '">−</button>' +
          '<input type="number" inputmode="numeric" min="0" step="1" enterkeyhint="next" data-item="' + esc(x.nome) + '" value="' + esc(val) + '" placeholder="—" aria-label="' + esc(x.nome) + '">' +
          '<button type="button" data-cc="mais" aria-label="Mais ' + esc(x.nome) + '">+</button></div></div>';
      }).join('');
    });
    h += '<div class="cc-pe"><div class="pg" data-cc-pg></div><button type="button" class="btn" data-cc="enviar">Enviar</button></div>';
    b.innerHTML = h;
    var campos = Array.prototype.slice.call(b.querySelectorAll('input[data-item]'));
    function guarda() {
      var o = {};
      campos.forEach(function (i) { if (i.value !== '') o[i.getAttribute('data-item')] = Number(i.value); });
      lsPoe(CC_RASC, JSON.stringify({ em: Date.now(), v: o }));
      return o;
    }
    function atualiza() {
      var n = 0;
      campos.forEach(function (i) {
        var ok = i.value !== '' && Number(i.value) >= 0;
        i.closest('.cc-l').classList.toggle('ok', ok);
        if (ok) n++;
      });
      ['copo', 'equipamento', 'outro'].forEach(function (g) {
        var el = b.querySelector('[data-ccg="' + g + '"]');
        if (!el) return;
        var gs = campos.filter(function (i) { return i.closest('.cc-l').getAttribute('data-g') === g; });
        el.textContent = gs.filter(function (i) { return i.value !== ''; }).length + '/' + gs.length;
      });
      b.querySelector('[data-cc-pg]').innerHTML = '<b>' + n + ' de ' + campos.length + '</b> contados' + (n < campos.length ? ' · ' + (campos.length - n) + ' em branco' : '');
      b.querySelector('[data-cc="enviar"]').disabled = !n || !!CTX.como;
    }
    campos.forEach(function (i, k) {
      i.addEventListener('input', function () { guarda(); atualiza(); });
      i.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var prox = campos.slice(k + 1).filter(function (x) { return x.value === ''; })[0] || campos[k + 1];
        if (prox) prox.focus(); else i.blur();
      });
    });
    b.addEventListener('click', function (e) {
      var bt = e.target.closest && e.target.closest('[data-cc]');
      if (!bt) return;
      var a = bt.getAttribute('data-cc');
      if (a === 'menos' || a === 'mais') {
        var inp = bt.parentNode.querySelector('input');
        var n = inp.value === '' ? (a === 'mais' ? 1 : 0) : Number(inp.value) + (a === 'mais' ? 1 : -1);
        inp.value = String(Math.max(0, n));
        guarda(); atualiza();
      } else if (a === 'sair') {
        CONTANDO_COPOS = false; vai();
      } else if (a === 'enviar') {
        var o = guarda(), itens = [];
        COPOS.forEach(function (x) { if (o[x.nome] != null) itens.push({ item: x.nome, contagem: o[x.nome], lastro: x.lastro != null ? x.lastro : undefined }); });
        var quem = b.querySelector('#cc-quem');
        if (quem && !quem.value.trim()) { quem.focus(); toast('Escreva quem contou.'); return; }
        if (quem) lsPoe('bento_contagem_nome', quem.value.trim());
        var falta = campos.length - itens.length;
        if (falta && !window.confirm(falta + (falta === 1 ? ' item ficou' : ' itens ficaram') + ' em branco e não vão na contagem. Enviar assim?')) return;
        bt.disabled = true; bt.textContent = 'Enviando…';
        api('/api/contagem/copos', { metodo: 'POST', corpo: { data: isoLocal(new Date()), itens: itens, responsavel: quem ? quem.value.trim() : undefined } })
          .then(function (r) {
            if (r.status === 0) {
              filaPoe('/api/contagem/copos', { data: isoLocal(new Date()), itens: itens, responsavel: quem ? quem.value.trim() : undefined }, 'a contagem de copos');
              lsPoe(CC_RASC, null);
              CONTANDO_COPOS = false;
              toast('Sem sinal: a contagem ficou guardada e sai sozinha quando o sinal voltar.');
              vai();
              return;
            }
            if (!r.ok || !r.d || r.d.ok === false) {
              bt.disabled = false; bt.textContent = 'Enviar';
