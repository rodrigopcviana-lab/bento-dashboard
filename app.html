  // Histórico de quebras por mês (24/11/2026): totais de 30 dias e de 12
  // meses, barras de peças por mês (toque escolhe o mês) e, do mês escolhido,
  // os itens que mais quebraram, os motivos e cada registro. Sem dinheiro.
  var QB_MES = null;
  function desenhaHistQuebras(b, rq) {
    if (!rq || !rq.ok) { falhou(b, 'Histórico de quebras', rq); return; }
    var porMes = {};
    (rq.d.meses || []).forEach(function (m) {
      (m.entradas || []).forEach(function (e) {
        var k = (e.data || '').slice(0, 7);
        if (k) (porMes[k] = porMes[k] || []).push(e);
      });
    });
    var soma = function (l) { return l.reduce(function (s2, e) { return s2 + (Number(e.quantidade) || 0); }, 0); };
    // Os 12 meses até o atual, mesmo os sem quebra (barra vazia diz "zero").
    var hoje = new Date(), meses = [];
    for (var k = 11; k >= 0; k--) {
      var d0 = new Date(hoje.getFullYear(), hoje.getMonth() - k, 1);
      meses.push(d0.getFullYear() + '-' + ('0' + (d0.getMonth() + 1)).slice(-2));
    }
    if (!QB_MES || meses.indexOf(QB_MES) < 0) {
      QB_MES = meses[meses.length - 1];
      // Mês atual sem nada: abre no último mês com quebra.
      if (!porMes[QB_MES]) for (var x = meses.length - 1; x >= 0; x--) if (porMes[meses[x]]) { QB_MES = meses[x]; break; }
    }
    var tot = meses.map(function (m) { return soma(porMes[m] || []); });
    var max = Math.max.apply(null, tot.concat([1]));
    var lim = isoLocal(new Date(Date.now() - 30 * 864e5));
    var todas = [];
    Object.keys(porMes).forEach(function (m) { todas = todas.concat(porMes[m]); });
    var n30 = soma(todas.filter(function (e) { return (e.data || '') >= lim; }));
    var n12 = tot.reduce(function (a, v) { return a + v; }, 0);
    var nomeMes = function (m, curto) { var n = MESES[Number(m.slice(5)) - 1]; return curto ? n.slice(0, 3) : n.charAt(0).toUpperCase() + n.slice(1) + ' de ' + m.slice(0, 4); };

    var h = '<h2>Histórico de quebras</h2><div class="qb-tot"><div><b>' + n30 + '</b><small>peças nos últimos 30 dias</small></div>' +
      '<div><b>' + n12 + '</b><small>peças em 12 meses</small></div></div>';
    h += '<div class="qb-barras" role="group" aria-label="Peças quebradas por mês">' + meses.map(function (m, ix) {
      var v = tot[ix], alt = v ? Math.max(6, Math.round(v / max * 78)) : 3;
      return '<button type="button" data-qb-mes="' + m + '" class="' + (v ? 'tem ' : '') + (m === QB_MES ? 'on' : '') + '" aria-label="' + esc(nomeMes(m) + ': ' + v + (v === 1 ? ' peça' : ' peças')) + '" aria-pressed="' + (m === QB_MES) + '">' +
        '<span class="n">' + (v || '') + '</span><i style="height:' + alt + 'px"></i><span class="m">' + nomeMes(m, true) + '</span></button>';
    }).join('') + '</div>';

    var ix = meses.indexOf(QB_MES), doMes = (porMes[QB_MES] || []).slice().sort(function (a2, b2) { return (a2.data || '') < (b2.data || '') ? 1 : -1; });
    h += '<div class="qb-nav"><button type="button" data-qb-passo="-1" aria-label="Mês anterior"' + (ix <= 0 ? ' disabled' : '') + '>‹</button><b>' + esc(nomeMes(QB_MES)) +
      '</b><button type="button" data-qb-passo="1" aria-label="Próximo mês"' + (ix >= meses.length - 1 ? ' disabled' : '') + '>›</button></div>';
    if (!doMes.length) {
      h += '<p class="vazio">Nenhuma quebra registrada neste mês.</p>';
    } else {
      var nMes = soma(doMes);
      var itens = {}, motivos = {};
      doMes.forEach(function (e) {
        itens[e.nome] = (itens[e.nome] || 0) + (Number(e.quantidade) || 0);
        var mo = e.motivo || 'Sem motivo';
        motivos[mo] = (motivos[mo] || 0) + (Number(e.quantidade) || 0);
      });
      var ord = function (o) { return Object.keys(o).sort(function (a2, b2) { return o[b2] - o[a2]; }); };
      var ant = ix > 0 ? tot[ix - 1] : null;
      h += '<p class="qb-res"><b>' + nMes + (nMes === 1 ? ' peça' : ' peças') + '</b> em ' + doMes.length + (doMes.length === 1 ? ' registro' : ' registros') +
        (ant != null ? ' · ' + (ant === nMes ? 'igual ao mês anterior' : (nMes > ant ? '+' : '−') + Math.abs(nMes - ant) + ' que ' + nomeMes(meses[ix - 1], true)) : '') + '</p>';
      h += '<h3 class="ct-sec">O que mais quebrou</h3><div class="qb-top">' + ord(itens).slice(0, 6).map(function (n) {
        return '<span class="pill">' + esc(n) + ' · ' + itens[n] + '</span>';
      }).join('') + '</div>';
      h += '<h3 class="ct-sec">Motivos</h3><div class="qb-top">' + ord(motivos).map(function (n) {
        return '<span class="pill atencao">' + esc(n) + ' · ' + motivos[n] + '</span>';
      }).join('') + '</div>';
      h += '<h3 class="ct-sec">Registros</h3>';
      var dia = '';
      doMes.forEach(function (e) {
        if (e.data !== dia) { dia = e.data; h += '<div class="qb-dia">' + esc(e.data ? diaTxt(e.data) : 'Sem data') + '</div>'; }
        h += '<div class="linha"><div class="t">' + esc(e.nome) + '<small>' + esc(e.motivo || 'Sem motivo') + (e.responsavel ? ' · ' + esc(e.responsavel) : '') +
          (e.detalhe ? ' · ' + esc(e.detalhe) : '') + '</small></div><span class="v">' + esc(e.quantidade) + (Number(e.quantidade) === 1 ? ' peça' : ' peças') + '</span></div>';
      });
    }
    b.innerHTML = h;
    Array.prototype.forEach.call(b.querySelectorAll('[data-qb-mes]'), function (bt) {
      bt.addEventListener('click', function () { QB_MES = bt.getAttribute('data-qb-mes'); desenhaHistQuebras(b, rq); });

        if (n >= 0 && n < meses.length) { QB_MES = meses[n]; desenhaHistQuebras(b, rq); }
      });
    });
  }

  // --- Escala (24/11/2026) -----------------------------------------------------
  // Os próximos 7 dias pela versão OFICIAL de cada semana: GET
  // /api/escala?oficial=1, a mesma rota da página Minha escala do site. Quem é a
  // pessoa vem da sessão; sem pessoa (senha do nível), mostra a casa. Dia sem
  // linha na base cai no padrão da pessoa, e a tela diz isso.
  var ESC_DIA_NOME = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  var ESC_DIA_CURTO = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  function isoLocal(x) { return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); }
  function chaveNome(n) { return semAcento(n).trim(); }
  function linhasEscala(dt, dias, padrao) {
    var data = isoLocal(dt), nomeDia = ESC_DIA_NOME[dt.getDay()], por = {};
    dias.forEach(function (x) { if (x.data === data) por[chaveNome(x.pessoa)] = x; });
    padrao.forEach(function (pp) {
      if (!pp.ativo || por[chaveNome(pp.pessoa)]) return;
      var folga = pp.folgaFixa === nomeDia;
      por[chaveNome(pp.pessoa)] = { pessoa: pp.pessoa, turno: folga ? 'Folga' : pp.turnoBase,
        entrada: folga ? '' : pp.entradaBase, saida: folga ? '' : pp.saidaBase, doPadrao: true };
    });
    return Object.keys(por).map(function (k) { return por[k]; });
  }

    var hoje = new Date(); hoje.setHours(12, 0, 0, 0);
    var datas = [];
    for (var i = 0; i < 7; i++) { var d = new Date(hoje); d.setDate(hoje.getDate() + i); datas.push(d); }
    dados.escala(isoLocal(datas[0]), isoLocal(datas[6])).then(function (r) {
      if (!r.ok) { falhou(b, 'Minha escala', r); return; }

  // --- Caixa de entrada --------------------------------------------------------

  TELAS.caixa = function (c) {

  // --- Fichas técnicas -----------------------------------------------------------
  var BRL = null;
  try { BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }); } catch (e) {}
  function dinheiro(v, casas) {
    if (v == null || isNaN(v)) return '—';
    if (casas != null) { try { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: casas, maximumFractionDigits: casas }).format(v); } catch (e) {} }
    return BRL ? BRL.format(v) : String(v);
  }
  function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function qtdTxt(v) { return v == null ? '—' : String(Math.round(v * 100) / 100).replace('.', ','); }
  var fichaSec = 'todas', fichaBusca = '';

  // Detalhe de uma ficha: #/fichas/<chave>. Vindo da grade, "Fichas" volta no
  // histórico (mantém a busca, a seção e a rolagem); vindo de link direto
  // (chat, compartilhar), abre a grade.
  var fichaDaGrade = false, fichaRolagem = 0;
  function fichaRota() {
    var m = location.hash.match(/^#\/fichas\/(.+)$/);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }
  // "Gin & Tônica (Gin Tônica, Bento)" vira título + apelido em letra menor.
  function fichaNome(n) {
    var m = String(n || '').match(/^(.*?)\s*\((.+)\)\s*$/);
    return m && m[1] ? { t: m[1], alt: m[2] } : { t: String(n || ''), alt: '' };
  }
  // Metas "Rótulo: valor" (às vezes várias numa linha, com " | ").
  function fichaMetas(f) {
    var kv = {}, ordem = [], soltas = [];
    f.m.forEach(function (linha) {
      String(linha).split(' | ').forEach(function (p) {
        p = p.trim(); if (!p) return;
        var i = p.indexOf(': ');
        if (i <= 0) { soltas.push(p); return; }
        var r = p.slice(0, i), v = p.slice(i + 2).trim();
        if (kv[r] == null) { kv[r] = v; ordem.push(r); }
      });
    });
    // "Método/Copo" do Notion às vezes só repete a guarnição: aí some; se traz
    // instrução, vira observação.
    if (kv['Método/Copo'] != null) {
      var mc = kv['Método/Copo'];
      delete kv['Método/Copo']; ordem.splice(ordem.indexOf('Método/Copo'), 1);
      if (!(/Guarnição:/i.test(mc) && kv['Guarnição'])) soltas.push(mc);
    }
    return { kv: kv, ordem: ordem, soltas: soltas };
  }
  function fichaImagem(f, cls) {
    if (f.s === 'producoes') return '<div class="' + cls + ' prod" aria-hidden="true">' + ic('garrafa', cls === 'fd-hero' ? 40 : 34) + '</div>';
    var det = cls === 'fd-hero';
    var amp = det ? ' data-amplia role="button" tabindex="0" aria-label="Ampliar a foto"' : '';
    var lupa = det ? '<span class="fd-amp" aria-hidden="true">' + ic('lupa', 18) + '</span>' : '';
    if (f.f) return '<div class="' + cls + (det ? ' foto' : '') + '"' + amp + '><img src="fotos/' + esc(f.f) + '" alt="" loading="lazy" decoding="async">' + lupa + '</div>';
    if (f.fc) return '<div class="' + cls + ' copo"' + amp + '><img src="fotos/' + esc(f.fc) + '" alt="" loading="lazy" decoding="async"><span class="selo-copo">Foto do copo</span>' + lupa + '</div>';
    return '<div class="' + cls + '" aria-hidden="true">' + ic('cocktail', 34) + '</div>';
  }
  // Foto em tela cheia. Entra no histórico: o voltar do celular fecha a foto,
  // não a ficha. Fecha também com toque, com o X e com Esc.
  function ampliaFoto(src, titulo, copo) {
    if (document.querySelector('.lb')) return;
    var d = document.createElement('div');
    d.className = 'lb' + (copo ? ' copo' : '');
    d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'Foto: ' + titulo);
    d.innerHTML = '<div class="lb-t">' + esc(titulo) + '</div><button type="button" class="lb-x" aria-label="Fechar">&times;</button><img src="' + esc(src) + '" alt="' + esc(titulo) + '">';
    document.body.appendChild(d);
    document.body.style.overflow = 'hidden';
    var noHist = false;
    try { history.pushState({ lb: 1 }, ''); noHist = true; } catch (e) {}
    function some() {
      if (!d.parentNode) return;
      d.remove();
      document.body.style.overflow = '';
      window.removeEventListener('popstate', some);
      document.removeEventListener('keydown', esc1);
    }
    function fecha() { if (noHist && history.state && history.state.lb) history.back(); else some(); }
    function esc1(e) { if (e.key === 'Escape') fecha(); }
    window.addEventListener('popstate', some);
    document.addEventListener('keydown', esc1);
    d.addEventListener('click', fecha);
    d.querySelector('.lb-x').focus();
  }
  function fichaPreco(f) { return f.v != null ? dinheiro(f.v, f.v % 1 ? 2 : 0) : ''; }

  TELAS.fichas = function (c) {
    var lista = FICHAS.fichas || [];
    var k = fichaRota();

        return '<button type="button" data-sec="' + esc(s[0]) + '" class="' + (s[0] === fichaSec ? 'on' : '') + '" aria-pressed="' + (s[0] === fichaSec) + '">' + esc(s[1]) + '</button>';

      if (bt) bt.disabled = !vis.length;
    }
    if (bF.querySelector('[data-fc-exp]')) bF.querySelector('[data-fc-exp]').addEventListener('click', function () {
      var vis = fichasVisiveis(lista);

      (FICHAS.secoes || []).forEach(function (s) { nomeSec[s[0]] = s[1]; });
      imprimeFichas(vis, fichaSec === 'todas' ? 'Fichas técnicas' : 'Fichas técnicas · ' + (nomeSec[fichaSec] || fichaSec));
    });

    Array.prototype.forEach.call(bF.querySelectorAll('[data-sec]'), function (x) {

        });

    bL.addEventListener('click', function (e) {

  function fichasVisiveis(lista) {
    var q = semAcento(fichaBusca).trim();

      if (fichaSec !== 'todas' && f.s !== fichaSec) return false;

  // Linha curta do cartão: como se faz e onde se serve; produção mostra a validade.
  function fichaResumo(f) {
    if (f.sf) return '<span class="falta">Receita ainda não registrada</span>';
    var me = fichaMetas(f).kv, p = [];

  function desenhaFichas(bL, lista) {
    var nomeSec = {};

  function fichaDetalhe(c, f) {
    var nomeSec = {};
    (FICHAS.secoes || []).forEach(function (s) { nomeSec[s[0]] = s[1]; });
    var nm = fichaNome(f.n), me = fichaMetas(f), kv = me.kv, pr = fichaPreco(f);

    var resto = me.ordem.filter(function (r) { return !usados[r]; });

    }
    h += '<div data-fd-precif></div><div class="fd-acoes"><button type="button" class="fc-exp" data-fd-pdf>' + ic('baixar', 16) + 'PDF desta ficha</button></div>';

  // PDF das fichas (24/11/2026): monta uma folha limpa em #impressao e chama a

  function imprimeFichas(fichas, titulo) {
    var nomeSec = {};
    (FICHAS.secoes || []).forEach(function (s) { nomeSec[s[0]] = s[1]; });
    var h = '<div class="pi-cab"><b>' + esc(fichas.length === 1 ? 'Ficha técnica' : titulo) + '</b><span>Bento · ' +

      h += '<div class="pf"><div class="pf-t">' + (f.f || f.fc ? '<img src="fotos/' + esc(f.f || f.fc) + '" alt=""' + (f.f ? '' : ' class="copo"') + '>' : '') +

        (f.v != null ? '<span class="pf-v">' + esc(dinheiro(f.v, f.v % 1 ? 2 : 0)) + '</span>' : '') + '</div>';

      if (f.sm) h += '<p class="pf-a">Proporções ainda não registradas: confirme as medidas com a coordenação.</p>';
      if (f.i.length) h += '<table>' + f.i.map(function (x) { return '<tr><td class="d">' + esc(x[0]) + '</td><td>' + esc(x[1]) + '</td></tr>'; }).join('') + '</table>';
      if (f.m.length) h += '<div class="pf-m">' + f.m.map(function (m) { return '<p>' + esc(m) + '</p>'; }).join('') + '</div>';
      if (f.p.length) h += '<h4>Modo de preparo</h4><ol>' + f.p.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
      h += '</div>';
    });
    h += '<p class="pi-rod">Portal do Bar · Bento. Ficha conforme o cadastro do dia em que foi exportada.</p>';
    var el = document.getElementById('impressao');
    if (!el) { el = document.createElement('div'); el.id = 'impressao'; document.body.appendChild(el); }
    el.innerHTML = h;
    var tituloAntes = document.title;
    // O nome sugerido do arquivo PDF sai do título da página.
    document.title = (fichas.length === 1 ? 'Ficha técnica - ' : '') + titulo.replace(/ · /g, ' - ');
    document.body.classList.add('imprimindo');
    function limpa() {
      document.body.classList.remove('imprimindo');
      document.title = tituloAntes;
      window.removeEventListener('afterprint', limpa);
    }
    window.addEventListener('afterprint', limpa);
    // Espera as fotos carregarem (no máximo 2,5 s) para não saírem em branco.
    var espera = Array.prototype.map.call(el.querySelectorAll('img'), function (im) {
      return im.complete ? Promise.resolve() : new Promise(function (ok) { im.onload = im.onerror = ok; });
    });
    Promise.race([Promise.all(espera), new Promise(function (ok) { setTimeout(ok, 2500); })]).then(function () { window.print(); });
  }

  // Mesma conta e mesmas regras da precificação de *cocktails.html (JS_PRECIF):

  function tabelaPrecif(f) {
    var linhas = f.linhas.map(function (l) {
      var sub = [];
      if (l.garrafa != null && l.volume) sub.push(dinheiro(l.garrafa) + ' / ' + qtdTxt(l.volume) + ' ml');
      if (l.fonte === 'Média do mercado') sub.push('média do mercado');
      else if (l.fonte === 'Compra') sub.push('compra');
      return '<tr><td>' + esc(l.insumo) + (sub.length ? '<small>' + esc(sub.join(' · ')) + '</small>' : '') + '</td><td class="n">' + qtdTxt(l.qtd) + '</td>' +
        (l.custo == null ? '<td class="n sem" colspan="2">sem custo</td>'
          : '<td class="n">' + dinheiro(l.rs_ml, l.rs_ml < 1 ? 4 : 2) + '</td><td class="n">' + dinheiro(l.custo) + '</td>') + '</tr>';
    }).join('');
    var cmv = f.cmv != null ? String(f.cmv).replace('.', ',') + '%' : '';
    var notas = [];
    if (f.total == null) notas.push(f.faltam + (f.faltam === 1 ? ' ingrediente sem custo' : ' ingredientes sem custo') + ' no banco de insumos: sem total, porque custo parcial parece barato e engana o CMV.');
    if (f.total != null && f.cmv == null) notas.push('Sem preço de venda na ficha do Notion: sem CMV.');
    if (f.linhas.some(function (l) { return l.fonte === 'Média do mercado'; })) notas.push('Média do mercado é custo provisório, até Suprimentos lançar a nota de compra.');
    return '<details class="precif"><summary>Precificação ' + (f.total != null ? '<span class="tot">' + esc(dinheiro(f.total)) + (cmv ? ' · CMV ' + cmv : '') + '</span>'
      : '<span class="tot falta">custo incompleto</span>') + '</summary><div class="pc"><div class="tab-wrap"><table><thead><tr><th>Ingrediente</th><th class="n">ml</th><th class="n">por ml</th><th class="n">Custo</th></tr></thead><tbody>' +
      linhas + '</tbody>' + (f.total != null ? '<tfoot><tr><td colspan="3">Total' + (cmv ? ' · CMV ' + cmv : '') + '</td><td class="n">' + esc(dinheiro(f.total)) + '</td></tr></tfoot>' : '') +

  }

    d.addEventListener('click', function (ev) {

      });

  function tipoAparelho() {

            k.recentes.map(function (x) {

                '<small>' + esc(x.aparelho || 'aparelho') + (x.telas.length ? ' · ' + x.telas.map(tl).join(', ') : '') + '</small></span><span class="v">' + usoDuracao(x.segundos) + '</span></div>';

  // --- Chat (PLANO_CHAT_APP_BENTO.md, 24/11/2026) ---------------------------
  // Um chat por pessoa e por dia. No modo Chat (chave do topo) há a faixa da
  // semana, o calendário do mês e, para a administração, a lista de conversas.
  // Na aba "Chat do dia" das Funções, só o chat de hoje.
  // sala: null = lista de conversas; 'meu' = o próprio chat do dia; 'grupo' =
  // Equipe Bento; 'setor:<slug>' = pedidos daquele setor; 'conversas' = chats
  // de todos (admin). pessoa: chat de outra pessoa aberto pela administração.
  var CH = { dia: null, pessoa: null, vista: 'dia', mes: null, sala: null, timer: null };
  var DIAS_SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var DIAS_EXT = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function dDate(d) { return new Date(d + 'T12:00:00Z'); }
  function somaDias(d, n) { var x = dDate(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function semanaDe(d) { var dow = (dDate(d).getUTCDay() + 6) % 7, seg = somaDias(d, -dow), out = []; for (var i = 0; i < 7; i++) out.push(somaDias(seg, i)); return out; }
  function diaTxt(d) { var x = dDate(d); return DIAS_EXT[x.getUTCDay()] + ', ' + dataBr(d); }
  function hora(ms) { var x = new Date(ms); return ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

  // Pergunta de receita: a casca casa com uma ficha que ela já tem e manda só
  // o nome; o worker não guarda receita. Só casa quando a mensagem pede a
  // receita ou é praticamente só o nome: "acabou o gin do negroni" é problema
  // para a coordenação, não pedido de ficha.
  var PEDE_RECEITA = /\b(receita|ficha|como (faz|fazer|faco|prepara|preparar|monta|montar)|preparo|ingrediente|quantos? ml|dose)\b/;
  // "Acabou o negroni", "cadê o gin do negroni": é aviso, não pedido de ficha.
  var PARECE_AVISO = /\b(acab\w*|falt\w*|termin\w*|zerou|quebr\w*|cade|sumiu|estrag\w*|vencid\w*|nao tem|sem)\b/;
  var PALAVRA_VAZIA = { a: 1, o: 1, as: 1, os: 1, de: 1, da: 1, do: 1, das: 1, dos: 1, e: 1, um: 1, uma: 1, no: 1, na: 1, pro: 1, pra: 1 };
  // Apelido que sozinho não diz qual drink é ("Bento", "base", "mocktail").
  var APELIDO_GENERICO = { bento: 1, base: 1, mocktail: 1, drink: 1, classico: 1 };
  function palavras(s) { return norm(s).split(' ').filter(function (w) { return w && !PALAVRA_VAZIA[w]; }); }
  // Nomes pelos quais a ficha é chamada: o nome sem o parêntese e cada apelido
  // de dentro dele. "Gin & Tônica (Gin Tônica, Bento)" casa com "gin tônica";
  // antes o nome inteiro, com o parêntese, nunca casava com nada.
  function nomesFicha(f) {
    if (f._nomes) return f._nomes;
    var n = String(f.n || ''), m = /^(.*?)\s*\((.*)\)\s*$/.exec(n);
    var cand = [m ? m[1] : n];
    if (m) m[2].split(/[,;/]|\s[—–-]\s/).forEach(function (x) { cand.push(x); });
    f._nomes = cand.map(palavras).filter(function (ws) {
      return ws.length > 1 || (ws.length === 1 && ws[0].length >= 4 && !APELIDO_GENERICO[ws[0]]);
    });
    return f._nomes;
  }
  function casaFicha(texto) {
    var nt = norm(texto), t = palavras(texto);
    if (!t.length) return null;
    var ts = ' ' + t.join(' ') + ' ';
    var melhor = null, pontos = 0, usadas = 0, empate = false;
    (FICHAS.fichas || []).forEach(function (f) {
      var p = 0, u = 0;
      nomesFicha(f).forEach(function (ws) {
        // Nome inteiro vale mais que começo de nome; nome longo ("Suco/limão
        // taiti espremido") casa pelas duas primeiras palavras ("suco de limão").
        if (ts.indexOf(' ' + ws.join(' ') + ' ') >= 0) { if (ws.length * 10 + 5 > p) { p = ws.length * 10 + 5; u = ws.length; } }
        else if (ws.length >= 3 && ts.indexOf(' ' + ws.slice(0, 2).join(' ') + ' ') >= 0 && 20 > p) { p = 20; u = 2; }
      });
      if (!p) return;
      if (p > pontos) { pontos = p; melhor = f; usadas = u; empate = false; }
      else if (p === pontos && f !== melhor) empate = true;
    });
    // Duas fichas empatadas ("pré-batch" casa com três): melhor perguntar à
    // coordenação do que mostrar a ficha errada.
    if (!melhor || empate) return null;
    var aviso = PARECE_AVISO.test(nt) && !/\b(receita|ficha)\b/.test(nt);
    if (aviso) return null;
    return PEDE_RECEITA.test(nt) || t.length - usadas === 0 ? melhor : null;
  }
  function fichaPorNome(nome) {
    var k = norm(nome);
    return (FICHAS.fichas || []).filter(function (f) { return norm(f.n) === k; })[0] || null;
  }
  function fichaHtml(nome) {
    var f = fichaPorNome(nome);
    if (!f) return '<p>Ficha técnica: ' + esc(nome) + '</p>';
    var h = '<div class="ficha"><b>' + esc(f.n) + '</b>';
    if (f.sf || f.sm) h += '<p class="aviso-f">Proporções ainda não registradas: confirme com a coordenação.</p>';
    h += f.i.map(function (x) { return '<div class="ing"><span class="d">' + esc(x[0]) + '</span><span>' + esc(x[1]) + '</span></div>'; }).join('');
    if (f.m.length) h += '<div class="metas">' + f.m.map(function (m) { return '<p>' + esc(m) + '</p>'; }).join('') + '</div>';
    return h + '</div><a class="ir" href="#/fichas/' + encodeURIComponent(f.k) + '">Ver ficha completa ›</a>';
  }

  // "Como funciona a contagem?", "vídeo do turno", "onde vejo os copos?": o
  // "?" responde com o vídeo do assunto. Precisa pedir ajuda (como, onde,
  // vídeo...) E citar o assunto; sem isso é pergunta normal para a coordenação.
  var PEDE_AJUDA = /\b(como|onde|video|videos|tutorial|ensina|explica|aprender|ajuda|nao sei usar|nao entendi)\b/;
  function videosDoNivel() {
    return (VIDEOS || []).filter(function (v) { return v.n.indexOf(CTX.nivel) >= 0; });
  }
  function casaVideo(texto) {
    var t = ' ' + norm(texto) + ' ';
    if (!PEDE_AJUDA.test(t)) return null;
    var melhor = null, pontos = 0;
    videosDoNivel().forEach(function (v) {
      var p = 0;
      v.p.forEach(function (w) { if (t.indexOf(' ' + norm(w) + ' ') >= 0) p += norm(w).split(' ').length; });
      if (p > pontos) { pontos = p; melhor = v; }
    });
    return melhor;
  }
  function videoPorId(id) { return (VIDEOS || []).filter(function (v) { return v.id === id; })[0] || null; }
  function videoHtml(id) {
    var v = videoPorId(id);
    if (!v) return '<p>Vídeo de treinamento (não está mais disponível).</p>';
    return '<div class="vid"><b>' + esc(v.t) + '</b>' + (v.r ? '<small>' + esc(v.r) + '</small>' : '') +
      '<video controls playsinline preload="metadata" src="' + esc(v.a) + '#t=0.5"></video></div>';
  }

  var mesCache = {};
  function situacaoMes(pessoa, mes) {
    var k = (pessoa || '') + '|' + mes, c = mesCache[k];
    if (c && Date.now() - c.em < 60000) return c.p;
    var p = api('/api/chat/mes?mes=' + mes + (pessoa ? '&pessoa=' + encodeURIComponent(pessoa) : ''));
    var reg = { em: Date.now(), p: p };
    mesCache[k] = reg;
    p.then(function (r) { if (!r.ok && mesCache[k] === reg) delete mesCache[k]; });
    return p;
  }

  // Chat (24/11/2026, pedido do Rodrigo): uma aba do rodapé, com duas partes,
  // Chat do dia e Caixa de entrada. Sem conversa de pessoa para pessoa e sem
  // chat por setor: o "!" do chat do dia grava o pedido na Central de Demandas,
  // e a administração vê os pedidos por setor na Caixa dela.
  function telaChat(c) {
    if (CH.timer) { clearTimeout(CH.timer); CH.timer = null; }
    if (CH.vista === 'mes') return chatMes(c);
    if (CH.pessoa) return chatDia(c, true);
    if (CH.sala && CH.sala.indexOf('setor:') === 0) return chatSetor(c, CH.sala.slice(6));
    chatAbas(c);
  }
  function voltaChat() {
    // O "‹" faz o mesmo que o voltar do celular quando há para onde voltar.
    if (history.state && history.state.app && history.state.n > 0) { history.back(); return; }
    if (CH.pessoa) CH.pessoa = null; else CH.sala = null;
    CH.dia = null; CH.vista = 'dia';
    vai();

  TELAS.chat = function (c) { telaChat(c); };

  function chatAbas(c) {
    var aba = /^#\/caixa/.test(location.hash) && pode('caixa.ver') ? 'caixa' : 'dia';
    var abas = [['dia', 'Chat do dia', '#/chat']];

      var on = a[0] === aba;
      return '<button type="button" role="tab" aria-selected="' + on + '" data-chaba="' + a[2] + '"' + (on ? ' class="on"' : '') + '>' + esc(a[1]) +
        (a[0] === 'caixa' ? '<span class="cont" data-cont hidden></span>' : '') + '</button>';
    }).join('') + '</div></div>' : '';
    c.innerHTML = h + '<div data-chsub></div>';
    Array.prototype.forEach.call(c.querySelectorAll('[data-chaba]'), function (b) {
      b.addEventListener('click', function () {

        try { history.replaceState(history.state, '', b.getAttribute('data-chaba')); } catch (e) { location.hash = b.getAttribute('data-chaba'); return; }
        vai();
      });
    });
    var sub = c.querySelector('[data-chsub]');
    if (aba === 'caixa') return chatCaixa(sub);
    return chatDia(sub, true);

  // Caixa de entrada dentro do Chat. Administração: perguntas esperando
  // resposta e os pedidos (Central de Demandas) por setor, para encaminhar.
  // Todos: os próprios pedidos, os avisos e tarefas que a administração manda.
  function chatCaixa(c) {

      '<div class="cx-sec"><span>Avisos e tarefas</span></div><div class="cx-av"><div class="blk" id="cx-av"><div class="esq" style="height:52px"></div></div></div>';
    var adm = pode('chat.conversas') && !CTX.como;
    var pc = adm ? api('/api/chat/conversas') : Promise.resolve(null);
    var ps = pode('chat.setores') ? api('/api/chat/setores').then(function (r) {
      if (r.ok && r.d.pode_ver_todos && !CTX.como) return api('/api/chat/setores?todos=1');
      return r;
    }) : Promise.resolve(null);
    Promise.all([pc, ps]).then(function (rr) {
      var box = c.querySelector('#cx-topo');
      if (!box) return;
      var cv = rr[0], s = rr[1], h = '';
      if (cv) {
        if (!cv.ok) h += '<div class="cx-sec">Perguntas para você</div><p class="cx-nota">' + esc((cv.d && cv.d.erro) || 'Não consegui carregar.') + '</p>';
        else if ((cv.d.aguardando || []).length) {
          var d0 = cv.d;
          h += '<div class="cx-sec"><span>Perguntas para você responder</span><small>' + d0.aguardando.length + '</small></div><div class="ch-grupo">' +
            d0.aguardando.map(function (m) {

              return '<button type="button" class="ch-conv" data-nome="' + esc(nome) + '" data-p="' + esc(m.dia === d0.hoje ? '' : m.dia) + '" data-pid="' + esc(m.id) + '">' +
                '<span class="ch-av">?</span><span class="t"><span class="l1"><b>' + esc(nome) + '</b><small>' + esc(dataBr(m.dia)) + ' ' + hora(m.criado_em) +
                '</small></span><span class="ult">' + esc(m.texto) + '</span></span></button>';
            }).join('') + '</div>';
        }
      }
      if (s) {
        if (!s.ok) {
          h += '<div class="cx-sec">Pedidos</div><p class="cx-nota">' + esc((s.d && s.d.erro) || 'Não consegui carregar os pedidos.') + '</p>';
        } else {

          CH.podeTodos = !!d.pode_ver_todos && !CTX.como;

            var linhas = (d.setores || []).map(function (st, i) {

              return { st: st, i: i, dms: dms, abertas: dms.filter(aberta).length, semResp: dms.filter(esperando).length };
            }).filter(function (x) { return x.abertas; });
            linhas.sort(function (a, b) { return (b.semResp - a.semResp) || (b.abertas - a.abertas) || (a.i - b.i); });
            var tot = linhas.reduce(function (a, x) { return a + x.abertas; }, 0);
            h += '<div class="cx-sec"><span>Pedidos por setor</span><small>' + (tot ? plural(tot, 'aberto', 'abertos') : 'nenhum aberto') + '</small></div>';
            if (!linhas.length) h += '<p class="cx-nota">Nenhum pedido aberto. O que a equipe avisar pelo “!” do chat aparece aqui, separado por setor.</p>';
            else h += '<div class="ch-grupo">' + linhas.map(function (x) {

                sub: u ? primeiroNome(u.solicitante || '') + ': ' + u.descricao : '', quando: u ? quandoIso(u.recebido_em) : '',
                pill: x.semResp ? plural(x.semResp, 'sem resposta', 'sem resposta') : plural(x.abertas, 'aberto', 'abertos'),
                pillTom: x.semResp ? 'sr' : '' });

              }).join('') + '</div>';

            pergunta: Number(b.getAttribute('data-pid')) || null });

        });

    var bA = c.querySelector('#cx-av');
    dados.avisos().then(function (r) {
      if (!r.ok) { falhou(bA, 'Avisos', r); return; }
      desenhaCaixa(c, bA, r.d.itens || []);

  function topoChat(titulo, sub, op) {

  function chatDia(c, completo) {

  // Fonte da resposta automática (27/11/2026): só o que a IA disse ter usado,

  // --- FALA: leitura em voz alta com a voz do aparelho (26/11/2026) ---------
  // Mesmo bloco no Bento, no Grupo IZ e no Medellín. Sem servidor e sem
  // custo. Três coisas deixam a voz do celular menos robótica:
  // 1) escolhe a MELHOR voz em português instalada, não a primeira da lista;
  // 2) limpa o texto antes (emoji, markdown, link, símbolo de real, "ml", "12h30",

      if (/google/i.test(n)) p += 35;
      if (/francisca|thalita|antonio|luciana|felipe|camila|vitoria|ricardo/i.test(n)) p += 10;
      if (/compact|espeak|desktop|eloquence|novelty|bad news|bells|whisper|zarvox|trinoids|organ/i.test(n)) p -= 40;

    function unidade(n, um, varios) { return n + ' ' + (String(n).replace(/\D/g, '') === '1' ? um : varios); }

        .replace(/[\uD83C-\uDBFF][\uDC00-\uDFFF]/g, ' ')
        .replace(/[☀-➿⬀-⯿️‍⃣]/g, ' ')
        .replace(/[*_`#~|>]+/g, ' ')
        .replace(/\s*\n+\s*/g, '. ')
        .replace(/\s[•·▪◦-]\s/g, ', ')
        .replace(/[→⇒➜]/g, ', ')
        .replace(/\s[–—]\s/g, ', ')
        .replace(/R\$\s?(\d[\d.]*)(?:,(\d{1,2}))?/g, function (_, r, c) {

        .replace(/\b(\d{1,2})h(\d{2})\b/gi, function (_, h, mi) { return unidade(parseInt(h, 10), 'hora', 'horas') + ' e ' + parseInt(mi, 10); })

        .replace(/\b(\d+)\s?h\b/gi, function (_, n) { return unidade(n, 'hora', 'horas'); })
        .replace(/\b(\d+)\s?min\b/gi, function (_, n) { return unidade(n, 'minuto', 'minutos'); })
        .replace(/\b(\d+(?:,\d+)?)\s?ml\b/gi, '$1 mililitros')
        .replace(/\b(\d+(?:,\d+)?)\s?kg\b/gi, function (_, n) { return unidade(n, 'quilo', 'quilos'); })

        .replace(/\b(\d+(?:,\d+)?)\s?(?:l|lt|lts)\b/gi, function (_, n) { return unidade(n, 'litro', 'litros'); })

        .replace(/\bn[º°]\s?/gi, 'número ')
        .replace(/\bobs\b\.?/gi, 'observação')
        .replace(/\bqtd[es]?\b\.?/gi, 'quantidade')
        .replace(/\bvc\b/gi, 'você').replace(/\bvcs\b/gi, 'vocês')
        .replace(/\bpq\b/gi, 'porque').replace(/\btbm?\b/gi, 'também')
        .replace(/\s+/g, ' ')

        .replace(/([.!?;:])(?:\s*[.,])+/g, '$1')

    function frases(t) {

          });
          return;
        }
        if (cur && (cur + ' ' + p).length > 220) { out.push(cur); cur = p; }
        else if (cur && cur.length < 40) cur += ' ' + p; // junta frase curtinha na próxima: menos trancos

  document.addEventListener('click', function (e) {

          .then(function (res) { VOZ.servidor = res.status === 400; }) // 400 = tem chave (texto vazio); 501 = sem chave

  // conferir e enviar. Não envia sozinho: um "acabou o gelo" mal ouvido

    var env = f.querySelector('button[type="submit"]');
    if (!env) return;
    var bt = document.createElement('button');
    bt.type = 'button'; bt.className = 'mic';
    bt.setAttribute('aria-label', 'Falar em vez de digitar');
    bt.innerHTML = ic('mic', 20);
    f.insertBefore(bt, env);
    var rec = null, pedacos = [], fim = null, stream = null, ph = ta.placeholder, t0 = 0, relogio = null;
    function solta() {
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null; clearTimeout(fim); clearInterval(relogio);
      bt.classList.remove('grava'); bt.innerHTML = ic('mic', 20); bt.setAttribute('aria-label', 'Falar em vez de digitar');
      ta.placeholder = ph;
    }
    function transcreve(blob) {
      bt.disabled = true; ta.placeholder = 'Transcrevendo o áudio…';
      var tipo = (blob.type || 'audio/webm').split(';')[0];
      fetch(W + '/api/chat/audio', { method: 'POST', headers: { 'Content-Type': tipo, 'X-Token': S.token }, body: blob })
        .then(function (res) { return res.json().catch(function () { return {}; }).then(function (d) { return { ok: res.ok, d: d }; }); })
        .catch(function () { return { ok: false, d: { erro: 'Sem conexão agora.' } }; })
        .then(function (r) {
          bt.disabled = false; ta.placeholder = ph;
          if (!r.ok) { toast((r.d && r.d.erro) || 'Não consegui transcrever.'); return; }
          var t = String((r.d && r.d.texto) || '').trim();
          if (!t) { toast('Não entendi o áudio. Fale de novo, mais perto do celular.'); return; }
          ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + t;
          ta.dispatchEvent(new Event('input'));
          ta.focus();
          toast('Confira o texto e toque em enviar.');
        });
    }
    bt.addEventListener('click', function () {
      if (rec && rec.state === 'recording') { rec.stop(); return; }
      paraVoz();
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        stream = s; pedacos = [];
        var tipo = tipoAudio();
        try { rec = tipo ? new MediaRecorder(s, { mimeType: tipo, audioBitsPerSecond: 32000 }) : new MediaRecorder(s); }
        catch (e) { rec = new MediaRecorder(s); }
        rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) pedacos.push(ev.data); };
        rec.onstop = function () {
          var dur = Date.now() - t0;
          solta();
          if (dur < 700 || !pedacos.length) { toast('Segure a fala um pouco mais.'); return; }
          transcreve(new Blob(pedacos, { type: rec.mimeType || tipo || 'audio/webm' }));
        };
        rec.start();
        t0 = Date.now();
        bt.classList.add('grava'); bt.innerHTML = ic('parar', 20); bt.setAttribute('aria-label', 'Parar e transcrever');
        var tick = function () { var s2 = Math.floor((Date.now() - t0) / 1000); ta.placeholder = 'Gravando… ' + s2 + 's · toque no quadrado para parar'; };
        tick(); relogio = setInterval(tick, 500);
        fim = setTimeout(function () { if (rec && rec.state === 'recording') rec.stop(); }, MIC_MAX_MS);
      }).catch(function () {
        solta();
        toast('O microfone está bloqueado. Libere nas permissões do navegador.');
      });
    });
  }

  // --- Os dois botões do chat do dia (mockup_caixa_entrada_chat_v3.html) ----
  // "?" pergunta: receita responde com a ficha, o resto vai à coordenação
  // (POST /api/chat, como sempre). "!" avisa ou pede: o worker sugere o setor,
  // a pessoa confirma com um toque, escolhe a urgência, vê a dica de resolver

  function ligaComp(c, completo) {

        document.addEventListener('click', function fora(e) {

            window.scrollTo(0, document.body.scrollHeight);

          return;
        }

  // --- Foto do bar (24/11/2026) -------------------------------------------------
  // Começo ou fim? (o pedido do chat já diz) -> câmera -> reduz para 1600px ->
  // /api/anexo -> /api/chat/foto, que grava como envio do turno. Quem não está
  // na escala de hoje escolhe almoço ou jantar.
  function reduzFoto(arq) {
    return new Promise(function (ok) {
      var url = URL.createObjectURL(arq), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (b) { ok(b || arq); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); ok(arq); };
      img.src = url;
    });
  }
  function fotoTurno(c, completo, fase, turno) {
    var lista = c.querySelector('#ch-msgs');
    function add(html) { lista.insertAdjacentHTML('beforeend', html); window.scrollTo(0, document.body.scrollHeight); return lista.lastElementChild; }
    function escolhe(perg, ops, cb) {
      add('<div class="bb site">' + esc(perg) + '</div>');
      var el = add('<div class="ch-bot fluxo">' + ops.map(function (o) { return '<button type="button" data-v="' + o[0] + '">' + esc(o[1]) + '</button>'; }).join('') + '</div>');
      Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {
          Array.prototype.forEach.call(el.querySelectorAll('button'), function (x) { x.disabled = true; });
          b.classList.add('esc'); cb(b.getAttribute('data-v'));
        });
      });
    }
    function camera() {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
      inp.style.display = 'none'; document.body.appendChild(inp);
      inp.addEventListener('change', function () {
        var arq = inp.files && inp.files[0];
        inp.remove();
        if (!arq) return;
        var st = add('<div class="bb site"><span class="pensa">Enviando a foto…</span></div>');
        var idemp = 'chatfoto-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        reduzFoto(arq).then(function (blob) {
          return fetch(W + '/api/anexo', { method: 'POST', headers: { 'X-Token': S.token, 'Content-Type': 'image/jpeg', 'X-Nome': 'bar.jpg' }, body: blob })
            .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); });
        }).then(function (up) {
          if (!up.ok || !up.d.id) throw new Error((up.d && up.d.erro) || 'Não consegui subir a foto.');
          return envia(up.d.id, idemp, st);
        }).catch(function (e) {
          st.innerHTML = esc(e && e.message === 'Failed to fetch' ? 'Sem conexão agora. A foto não foi enviada.' : (e && e.message) || 'Não consegui enviar a foto.');
        });
      });
      inp.click();
    }
    function envia(anexo, idemp, st) {
      return api('/api/chat/foto', { metodo: 'POST', corpo: { anexo: anexo, fase: fase, turno: turno || undefined, _idemp: idemp } }).then(function (r) {
        if (r.ok) { chatDia(c, completo); return; }
        if (r.d && r.d.erro_codigo === 'sem_turno') {
          st.innerHTML = 'Você não está na escala de hoje.';
          escolhe('A foto é de qual turno?', [['Dia', 'Almoço'], ['Noite', 'Jantar']], function (v) { turno = v; envia(anexo, idemp, st); });
          return;
        }
        st.innerHTML = esc(r.status === 0 ? 'Sem conexão agora. A foto não foi enviada.' : (r.d && r.d.erro) || 'Não consegui enviar a foto.');
      });
    }
    if (fase) return camera();
    var hr = new Date().getHours();
    var sugere = (hr >= 12 && hr < 15) || (hr >= 17 && hr < 20) ? 'abertura' : 'fechamento';
    var ops = [['abertura', 'Começo do turno'], ['fechamento', 'Fim do turno']];
    if (sugere === 'fechamento') ops.reverse();
    escolhe('Foto de como está o bar. É do começo ou do fim do turno?', ops, function (v) { fase = v; camera(); });
  }

  // --- Teclado no celular (24/11/2026) -----------------------------------------
  // No iPhone o teclado cobre o campo e a barra de baixo fica entre os dois.
  // Com o foco num campo do chat a barra some e o campo rola para ficar logo
  // acima do teclado; volta quando o foco sai.
  var digT = 0;
  function campoVisivel() {

  document.addEventListener('focusin', function (e) {

    clearTimeout(digT);
    document.body.classList.add('digitando');
    setTimeout(campoVisivel, 350);
  });
  document.addEventListener('focusout', function () {
    clearTimeout(digT);
    // Espera o toque no "enviar" terminar antes de devolver a barra.
    digT = setTimeout(function () {
      var a = document.activeElement;
      if (!(a && a.closest && a.closest('.ch-in') && /^(TEXTAREA|INPUT)$/.test(a.tagName))) document.body.classList.remove('digitando');
    }, 250);

  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () {

  function avisoFluxo(c, completo, texto, volta, box) {
    var lista = c.querySelector('#ch-msgs');
    var A = { setor: null, cat: null, urg: null, setores: [], urgs: {}, dicas: null, cancelado: false };
    // Enquanto o aviso não sai, o lugar dos dois botões vira "Cancelar": antes
    // não havia como desistir no meio sem sair da tela.
    box.innerHTML = '<div class="ch-cancela"><button type="button" class="btn sec">Cancelar aviso</button></div>';
    box.querySelector('button').addEventListener('click', function () {
      A.cancelado = true;
      Array.prototype.forEach.call(lista.querySelectorAll('.fluxo button'), function (x) { x.disabled = true; });
      Array.prototype.forEach.call(lista.querySelectorAll('.pensa'), function (x) { x.parentNode.remove(); });
      site('Cancelado. Nada foi enviado.');
      volta();
    });
    var fim = lista.querySelector('.ch-fim:last-child');
    if (fim) fim.remove();
    function add(html) {
      lista.insertAdjacentHTML('beforeend', html);
      window.scrollTo(0, document.body.scrollHeight);
      return lista.lastElementChild;
    }
    function site(html) { return add('<div class="bb site">' + html + '</div>'); }
    function chips(ops, cb) {
      var el = add('<div class="ch-bot fluxo">' + ops.map(function (o) {
        return '<button type="button" data-v="' + esc(o[0]) + '">' + esc(o[1]) + '</button>';
      }).join('') + '</div>');
      Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {
          if (A.cancelado) return;
          Array.prototype.forEach.call(el.querySelectorAll('button'), function (x) { x.disabled = true; });
          b.classList.add('esc');
          cb(b.getAttribute('data-v'));
        });
      });
    }
    function setorDe(slug) { return A.setores.filter(function (s) { return s.slug === slug; })[0] || null; }
    function catDe(st, slug) { return st ? st.categorias.filter(function (x) { return x.slug === slug; })[0] || null : null; }
    function erro(el, r, padrao) {
      el.innerHTML = esc(r.status === 0 ? 'Sem conexão agora. Nada foi enviado.' : (r.d && r.d.erro) || padrao);
      volta();
    }

    add('<div class="bb eu"><span class="mt a">! Aviso</span><br>' + esc(texto) + '</div>');
    var pensa = site('<span class="pensa">Vendo para qual setor vai…</span>');
    api('/api/chat/aviso/sugerir', { metodo: 'POST', corpo: { texto: texto } }).then(function (r) {
      if (A.cancelado) return;
      if (!r.ok) return erro(pensa, r, 'Não consegui agora. Nada foi enviado.');
      var d = r.d;
      A.setores = d.setores || []; A.urgs = d.urgencias || {};
      if (d.conduta) {
        pensa.innerHTML = 'Isso parece ser sobre um colega. Assunto assim não vai para um setor: só o RH e a coordenação devem ler. ' +
          'Use o Registro Rápido, na categoria <b>Equipe / conduta</b>. Nada foi enviado.' +
          '<a class="ir" href="' + esc(legado('registro.html')) + '">Abrir o Registro Rápido ›</a>';
        return volta();
      }
      var st = setorDe(d.setor), ct = catDe(st, d.categoria);
      if (!st || !ct) { pensa.innerHTML = 'Para qual setor é?'; return escolheSetor(); }
      pensa.innerHTML = 'Entendi como <b>' + esc(st.label) + ' · ' + esc(ct.label) + '</b>. Está certo?';
      chips([['s', 'Sim'], ['o', 'Outro setor']], function (v) {
        if (v === 's') { A.setor = st.slug; A.cat = ct.slug; return urgencia(); }
        site('Para qual setor é?');
        escolheSetor();
      });
    });

    function escolheSetor() {
      var ops = A.setores.map(function (s) { return [s.slug, s.label]; });
      if (pode('chat.avisar_erro')) ops.push(['__erro_app', 'Erro no app ou ficha']);
      chips(ops, function (v) {
        if (v === '__erro_app') return enviaErroApp();
        var st = setorDe(v);
        A.setor = v;
        if (st.categorias.length === 1) { A.cat = st.categorias[0].slug; return urgencia(); }
        site('Qual destes?');
        chips(st.categorias.map(function (x) { return [x.slug, x.label]; }), function (v2) { A.cat = v2; urgencia(); });
      });
    }
    function urgencia() {
      // A dica vem enquanto a pessoa escolhe a urgência.
      A.dicas = api('/api/chat/aviso/dicas', { metodo: 'POST', corpo: { texto: texto, setor: A.setor, categoria: A.cat } });
      site('É para quando?');
      chips(Object.keys(A.urgs).map(function (k) { return [k, A.urgs[k]]; }), function (v) {
        A.urg = v;
        // Urgente não espera dica: vai direto para o setor.
        if (v === 'urgente') return envia();
        dicas();
      });
    }
    function dicas() {
      var esp = site('<span class="pensa">Só um instante…</span>');
      A.dicas.then(function (r) {
        if (A.cancelado) return;
        var p = r.ok ? (r.d.passos || []) : [];
        if (!p.length) { esp.remove(); return envia(); }
        esp.innerHTML = 'Antes de enviar, vale tentar:<ol>' + p.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
        chips([['r', 'Resolvi, não precisa'], ['e', 'Enviar mesmo assim']], function (v) {
          if (v === 'e') return envia();
          site('Boa! Nada foi enviado.');
          volta();
        });
      });
    }
    // Erro no app ou na ficha (27/11/2026, clone do IZ): não vai para setor
    // nenhum. Cai na fila de avisos que o Rodrigo revisa antes de corrigir.
    function enviaErroApp() {
      box.innerHTML = '';
      var el = site('<span class="pensa">Enviando…</span>');
      api('/api/app/correcao', { metodo: 'POST', corpo: { tela: 'chat', texto: texto } }).then(function (r) {
        if (!r.ok) return erro(el, r, 'Não consegui enviar. Nada foi gravado.');
        el.innerHTML = 'Obrigado! O aviso de erro foi para a revisão da coordenação. Nada muda antes de ela conferir.';
        volta();
      });
    }
    function envia() {
      box.innerHTML = ''; // enviando: não dá mais para cancelar
      var el = site('<span class="pensa">Enviando…</span>');
      api('/api/chat/setor', { metodo: 'POST', corpo: { setor: A.setor, categoria: A.cat, urgencia: A.urg, texto: texto, origem: 'meu_chat' } })
        .then(function (r) {
          if (r.status === 0) {
            filaPoe('/api/chat/setor', { setor: A.setor, categoria: A.cat, urgencia: A.urg, texto: texto, origem: 'meu_chat' }, 'o seu pedido');
            el.innerHTML = 'Sem sinal agora. O pedido ficou guardado no celular e vai sozinho quando o sinal voltar.';
            return;
          }
          if (!r.ok) return erro(el, r, 'Não consegui enviar. Nada foi gravado.');
          chatDia(c, completo);
        });
    }
  }

  function pintaSemana(pessoa, dia) {

  function chatMes(c) {
    var pessoa = CH.pessoa;
    var mes = CH.mes || (CH.dia || '').slice(0, 7);
    c.innerHTML = '<div class="ch">' + topoChat('Seus dias', pessoa || (CTX.pessoa || 'Portal Bento'), { volta: false, inicial: pessoa || 'B' }) +
      '<div class="ch-mes"><div class="esq"></div></div></div>';
    situacaoMes(pessoa, mes).then(function (r) {
      var box = c.querySelector('.ch-mes');
      if (!r.ok || r.d.sem_pessoa) { box.innerHTML = '<p class="vazio">' + esc((r.d && r.d.erro) || 'Não consegui abrir o calendário.') + '</p>'; return; }
      var dias = r.d.dias || {}, hoje = r.d.hoje;
      var p = mes.split('-'), y = Number(p[0]), mm = Number(p[1]);
      var ant = mm === 1 ? (y - 1) + '-12' : y + '-' + ('0' + (mm - 1)).slice(-2);
      var prox = mm === 12 ? (y + 1) + '-01' : y + '-' + ('0' + (mm + 1)).slice(-2);
      var h = '<div class="tt"><button type="button" data-mes="' + ant + '" aria-label="Mês anterior">‹</button><b>' +
        MESES[mm - 1].charAt(0).toUpperCase() + MESES[mm - 1].slice(1) + ' ' + y + '</b>' +
        '<button type="button" data-mes="' + prox + '" aria-label="Próximo mês"' + (prox > hoje.slice(0, 7) ? ' disabled style="opacity:.3"' : '') + '>›</button></div>';
      h += '<div class="ch-grade">' + ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map(function (x) { return '<span class="cab">' + x + '</span>'; }).join('');
      var lista = Object.keys(dias).sort();
      var vaz = lista.length ? (dDate(lista[0]).getUTCDay() + 6) % 7 : 0;
      for (var i = 0; i < vaz; i++) h += '<span class="cel vz"></span>';
      var cont = { v: 0, a: 0, c: 0 };
      lista.forEach(function (x) {
        var st = dias[x], n = dDate(x).getUTCDate();
        if (cont[st] != null) cont[st]++;
        if (st === 'futuro') { h += '<span class="cel fut">' + n + '</span>'; return; }
        h += '<button type="button" data-ir-dia="' + x + '" class="' + (x === hoje ? 'hj' : '') + '">' + n + '<i class="pt ' + st + '"></i></button>';
      });
      h += '</div><div class="ch-leg"><span><i class="pt v"></i>abriu e fechou</span><span><i class="pt a"></i>ficou algo</span>' +
        '<span><i class="pt c"></i>nada enviado</span><span><i class="pt f"></i>folga</span><span><i class="pt n"></i>sem dado</span></div>';
      var tot = cont.v + cont.a + cont.c;
      if (tot) h += '<div class="blk" style="margin-top:14px"><p>' + cont.v + ' de ' + tot + ' turnos com abertura e fechamento neste mês.</p></div>';
      h += '<div class="acoes"><button type="button" class="btn sec" data-ch="hoje">Voltar para hoje</button></div>';
      box.innerHTML = h;
      Array.prototype.forEach.call(box.querySelectorAll('[data-mes]'), function (b) {
        b.addEventListener('click', function () { if (b.disabled) return; CH.mes = b.getAttribute('data-mes'); chatMes(c); });
      });
      Array.prototype.forEach.call(box.querySelectorAll('[data-ir-dia]'), function (b) {
        b.addEventListener('click', function () { irChat({ dia: b.getAttribute('data-ir-dia'), vista: 'dia' }); });
      });
      box.querySelector('[data-ch="hoje"]').addEventListener('click', function () { irChat({ dia: null, vista: 'dia' }); });
    });
  }

  function chatConversas(c, soHoje) {
    c.innerHTML = '<div class="ch">' + topoChat('Conversas · Bento', 'Só administração', { sino: soHoje, volta: !soHoje }) +
      '<div id="ch-conv"><div class="esq" style="margin:16px"></div></div></div>';
    var bv = c.querySelector('[data-ch="volta"]');
    if (bv) bv.addEventListener('click', voltaChat);
    api('/api/chat/conversas').then(function (r) {
      var box = c.querySelector('#ch-conv');
      if (!r.ok) { box.innerHTML = '<p class="vazio" style="padding:16px">' + esc((r.d && r.d.erro) || 'Não consegui carregar.') + '</p>'; return; }
      var d = r.d, h = '';
      if (CTX.pessoa && !soHoje) {
        h += '<button type="button" class="ch-conv" data-meu><span class="ch-av">' + esc(primeiroNome(CTX.pessoa).charAt(0)) +
          '</span><span class="t"><span class="l1"><b>Meu chat</b></span><span class="ult">' + esc(CTX.pessoa) + '</span></span></button>';
      }
      if ((d.aguardando || []).length) {
        h += '<div class="ch-sec">Para você responder · ' + d.aguardando.length + '</div>' + d.aguardando.map(function (m) {
          return '<button type="button" class="ch-conv" data-p="' + esc(m.dia === d.hoje ? '' : m.dia) + '" data-pid="' + esc(m.id) + '" data-nome="' + esc(nomeDaChave(d, m)) + '"><span class="ch-av">?</span>' +
            '<span class="t"><span class="l1"><b>' + esc(nomeDaChave(d, m)) + '</b><small>' + esc(dataBr(m.dia)) + ' ' + hora(m.criado_em) + '</small></span><span class="ult">' + esc(m.texto) + '</span></span></button>';
        }).join('');
      }
      if (!soHoje) {
        h += '<div class="ch-sec">Semana · toque num ponto para abrir o chat</div><div class="tab-wrap"><table class="ch-mat"><thead><tr><th>quem</th>' +
          d.semana.map(function (x) { var n = dDate(x); return '<th class="' + (x === d.hoje ? 'hj' : '') + '">' + DIAS_SEM[n.getUTCDay()] + '<br>' + n.getUTCDate() + '</th>'; }).join('') +
          '</tr></thead><tbody>' + d.pessoas.map(function (p) {
            return '<tr><td>' + esc(primeiroNome(p.nome)) + '</td>' + d.semana.map(function (x) {
              var st = p.semana[x];
              return '<td class="' + (x === d.hoje ? 'hj' : '') + '">' + (st === 'futuro' ? '<i class="pt n" style="opacity:.15"></i>'
                : '<button type="button" data-nome="' + esc(p.nome) + '" data-p="' + x + '" aria-label="' + esc(p.nome + ', ' + diaTxt(x)) + '"><i class="pt ' + st + '"></i></button>') + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      }
      h += '<div class="ch-sec">Conversas</div>' + (d.pessoas.length ? d.pessoas.map(function (p) {
        var u = p.ultima;
        var ult = u ? (u.autor === 'eu' ? '' : u.autor === 'humano' ? 'Você: ' : 'Portal: ') + u.texto : 'Ainda sem mensagens';
        return '<button type="button" class="ch-conv" data-nome="' + esc(p.nome) + '" data-p=""><span class="ch-av">' + esc(p.nome.charAt(0)) + '</span>' +
          '<span class="t"><span class="l1"><b>' + esc(p.nome) + '</b><small>' + (u ? esc(u.dia === d.hoje ? hora(u.criado_em) : dataBr(u.dia)) : '') + '</small></span>' +
          '<span class="ult">' + esc(ult) + '</span></span>' + (p.aguardando ? '<span class="cont">' + p.aguardando + '</span>' : '') + '</button>';
      }).join('') : '<p class="vazio" style="padding:0 14px">Ninguém ainda.</p>');
      box.innerHTML = h;
      Array.prototype.forEach.call(box.querySelectorAll('[data-nome]'), function (b) {
        b.addEventListener('click', function () {
          lsPoe(LS.modo, 'chat');
          irChat({ pessoa: b.getAttribute('data-nome'), dia: b.getAttribute('data-p') || null, vista: 'dia', sala: 'conversas',
            pergunta: Number(b.getAttribute('data-pid')) || null });
        });
      });
      var bm = box.querySelector('[data-meu]');
      if (bm) bm.addEventListener('click', function () { lsPoe(LS.modo, 'chat'); irChat({ pessoa: null, dia: null, vista: 'dia', sala: 'meu' }); });
    });
  }
  // Produção e tarefas do bom dia: vêm prontas da rotina publicada (o worker
  // não inventa tarefa). A produção já traz quantidade e validade no texto.
  function listaProducao(l) {
    if (!l || !l.length) return '';
    return '<div class="ch-bl"><b>Produção do dia</b><ul>' + l.map(function (p) {
      return '<li>' + esc(p.t) + (p.d ? '<small>' + esc(p.d) + '</small>' : '') + '</li>';
    }).join('') + '</ul></div>';
  }
  function listaTarefas(l, sobras, total) {
    if ((!l || !l.length) && !sobras) return '';
    var n = total || (l ? l.length : 0), resto = n - (l ? l.length : 0);
    var h = '<details class="ch-bl"><summary>Suas tarefas no checklist' + (n ? ' (' + n + ')' : '') + '</summary><ul>' +
      (l || []).map(function (t) { return '<li>' + (t.prio ? '<b>' + esc(t.t) + '</b>' : esc(t.t)) + '</li>'; }).join('') + '</ul>' +
      (resto > 0 ? '<p class="mini">E mais ' + resto + ' no checklist da Rotina.</p>' : '');
    if (sobras) h += '<p class="mini">No fechamento, anote quanto sobrou de ' + sobras + (sobras === 1 ? ' produção.' : ' produções.') + '</p>';
    return h + '</details>';
  }

  // Uma linha da lista de conversas. o: {sala, icone, tom ('forte'|'verde'|''),
  // titulo, sub, quando, pill, pillTom ('sr' = sem resposta)}.
  function itemLista(o) {
    return '<button type="button" class="ch-conv" data-sala="' + esc(o.sala) + '"><span class="ch-av ico ' + (o.tom || '') + '">' +
      ic(o.icone, 20) + '</span>' +
      '<span class="t"><span class="l1"><b>' + esc(o.titulo) + '</b><small>' + esc(o.quando || '') + '</small></span>' +
      '<span class="l2"><span class="ult">' + esc(o.sub) + '</span>' +
      (o.pill ? '<span class="ch-pill ' + (o.pillTom || '') + '">' + esc(o.pill) + '</span>' : '') + '</span></span></button>';
  }
  var ICONE_SETOR = { manutencao: 'ferramenta', compras_insumos: 'garrafa', rh_pessoas: 'pessoas', gerencia_casa: 'cracha',
    operacao_bar: 'cocktail', coordenacao: 'clipboard' };
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
  function quandoIso(iso) {
    if (!iso) return '';
    var t = Date.parse(iso);
    if (isNaN(t)) return dataBr(iso);
    return diaLocal(t) === diaLocal(Date.now()) ? hora(t) : dataBr(diaLocal(t));
  }
  function diaLocal(ms) {
    var x = new Date(ms);
    return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2);
  }
  function aberta(dm) { return dm.status !== 'Resolvido'; }
  function esperando(dm) { return aberta(dm) && !dm.resposta && !dm.status_resposta; }

  /** Vídeos de treinamento como uma conversa: um vídeo por bolha. */
  function chatVideos(c) {
    var vs = videosDoNivel();
    var h = '<div class="ch">' + topoChat('Vídeos de como usar', 'Portal Bento', { volta: true, inicial: '▶' }) +
      '<div class="ch-msgs" id="ch-msgs"><div class="bb site">Vídeos curtos sobre o app. Também dá para perguntar no "?" do seu chat, ' +
      'por exemplo: <b>como funciona a contagem?</b></div>';
    if (!vs.length) h += '<p class="ch-fim">Os vídeos ainda estão sendo gravados.</p>';
    vs.forEach(function (v) { h += '<div class="bb site">' + videoHtml(v.id) + '</div>'; });
    c.innerHTML = h + '</div></div>';
    c.querySelector('[data-ch="volta"]').addEventListener('click', voltaChat);
  }

  /** Raiz do modo Chat: as conversas, no jeito da lista do WhatsApp. */
  /** Campo de envio comum: Enter envia no computador, o campo cresce, e
   * depois de enviar recarrega a conversa. */
  function ligaEnvio(c, envia, depois) {
    var f = c.querySelector('#ch-form'), ta = c.querySelector('#ch-txt');
    if (!f || !ta) return;
    ligaMic(f, ta);
    ta.addEventListener('input', function () { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; });
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width:900px)').matches) { e.preventDefault(); f.requestSubmit(); }
    });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var texto = ta.value.trim();
      if (!texto) return;
      ta.disabled = true;
      envia(texto).then(function (r) {
        if (!r.ok) { ta.disabled = false; toast((r.d && r.d.erro) || 'Não consegui enviar.'); return; }
        ta.value = '';
        depois(r);
      });
    });
  }

  /** Chat de um setor: os pedidos (demandas) em forma de conversa. A pessoa
   * vê os dela; a coordenação e o chefe de bar veem a fila e respondem. */
  function chatSetor(c, slug) {
    var todos = !!CH.podeTodos && CH.fila !== 'meus';
    c.innerHTML = '<div class="ch"><div class="esq" style="margin:16px"></div></div>';
    api('/api/chat/setores' + (todos ? '?todos=1' : '')).then(function (r) {
      if (CH.sala !== 'setor:' + slug) return;
      var d = r.ok ? r.d : null;
      var st = d && (d.setores || []).filter(function (x) { return x.slug === slug; })[0];
      if (!d || !st) {
        c.innerHTML = '<div class="ch">' + topoChat('Pedidos', 'Setor', { volta: true }) + '<p class="vazio" style="padding:16px">' +
          esc(!r.ok ? (r.status === 0 ? 'Sem conexão agora.' : (r.d && r.d.erro) || 'Não consegui abrir.') : 'Setor não encontrado.') + '</p></div>';
        c.querySelector('[data-ch="volta"]').addEventListener('click', voltaChat);
        return;
      }
      var dms = (d.demandas || []).filter(function (x) { return x.setor === slug; }).slice().reverse();
      var abertas = dms.filter(aberta).length;
      var h = '<div class="ch">' + topoChat(st.label, (d.todos ? 'Fila de todos' : 'Seus pedidos') + (abertas ? ' · ' + abertas + (abertas === 1 ? ' aberto' : ' abertos') : ''), { volta: true, inicial: st.label });
      if (d.pode_ver_todos && CTX.pessoa) {
        h += '<div class="ch-alt"><button type="button" data-fila="todos" class="' + (d.todos ? 'on' : '') + '">Fila de todos</button>' +
          '<button type="button" data-fila="meus" class="' + (d.todos ? '' : 'on') + '">Meus pedidos</button></div>';
      }
      h += '<div class="ch-msgs" id="ch-msgs"><div class="bb site">' + (d.todos
        ? 'Pedidos de todos para <b>' + esc(st.label) + '</b>. Toque em “Responder” num pedido; a resposta volta no chat de quem pediu e na Central de Demandas.'
        : 'Seus pedidos para <b>' + esc(st.label) + '</b>. A resposta da coordenação aparece aqui e no seu chat.') + '</div>';
      if (!dms.length) h += '<p class="ch-fim">' + (d.sem_pessoa ? 'Entre com a sua senha individual para fazer pedidos.' : 'Nenhum pedido ainda.') + '</p>';
      var alvo = CH.alvo || (dms.filter(esperando).slice(-1)[0] || {}).chave || null;
      dms.forEach(function (dm) {
        var meu = !d.todos || (CTX.pessoa && norm(dm.solicitante) === norm(CTX.pessoa));
        var quando = '<span class="h">' + esc(quandoIso(dm.recebido_em)) + '</span>';
        var selo = '<span class="selo ' + (dm.status === 'Resolvido' ? 'ok' : dm.status === 'Novo' ? 'atencao' : '') + '">' + esc(dm.status) + '</span>';
        var corpo = '<span class="tag">' + esc(dm.categoria) + (dm.urgencia ? ' · ' + esc(dm.urgencia) : '') + '</span><br>' + esc(dm.descricao) + '<br>' + selo + quando;
        h += meu && !d.todos ? '<div class="bb eu">' + corpo + '</div>'
          : '<div class="bb humano' + (dm.chave === alvo && d.todos ? ' alvo' : '') + '"><div class="quem">' + esc(meu ? 'Você' : dm.solicitante || 'Sem nome') + '</div>' + corpo + '</div>';
        if (dm.resposta || dm.status_resposta) {
          var rq = (dm.respondido_por ? dm.respondido_por.split(' ')[0] + ' · ' : '') + 'coordenação';
          var rcorpo = (dm.status_resposta ? '<span class="tag">' + esc(dm.status_resposta) + '</span>' + (dm.resposta ? '<br>' : '') : '') + esc(dm.resposta) +
            '<span class="h">' + esc(quandoIso(dm.respondido_em)) + '</span>';
          h += d.todos ? '<div class="bb eu"><div class="quem">' + esc(rq) + '</div>' + rcorpo + '</div>'
            : '<div class="bb humano"><div class="quem">' + esc(rq) + '</div>' + rcorpo + botaoOuvir() + '</div>';
        }
        if (d.todos && aberta(dm) && !CTX.como) {
          h += '<div class="ch-bot">' + ['Visto', 'Em andamento', 'Resolvido'].filter(function (x) { return x !== dm.status; }).map(function (x) {
            return '<button type="button" data-status="' + esc(x) + '" data-chave="' + esc(dm.chave) + '">' + esc(x) + '</button>';
          }).join('') + '<button type="button" data-responder="' + esc(dm.chave) + '">Responder</button></div>';
        }
      });
      h += '</div>';
      var alvoDm = dms.filter(function (x) { return x.chave === alvo; })[0];
      if (CTX.como) {
        h += '<p class="ch-fim" style="padding-bottom:14px">Prévia de outro nível: pedir e responder ficam desligados.</p>';
      } else if (d.todos) {
        if (alvoDm) {
          h += '<form class="ch-in coord" id="ch-form"><textarea id="ch-txt" rows="1" placeholder="Responder ' + esc(primeiroNome(alvoDm.solicitante || '')) + ': ' +
            esc(alvoDm.descricao.slice(0, 36)) + '" aria-label="Resposta ao pedido"></textarea><button type="submit" aria-label="Enviar">➤</button></form>';
        }
      } else if (!d.sem_pessoa) {
        h += '<p class="ch-fim" style="padding-bottom:14px">Para um pedido novo, use o “!” no Chat do dia.</p>';
      } else if (false) {
        var cats = st.categorias, urg = d.urgencias || {};
        CH.cat = CH.cat && cats.some(function (x) { return x.slug === CH.cat; }) ? CH.cat : cats[0].slug;
        CH.urg = CH.urg || 'hoje';
        h += '<div class="ch-opc">' + (cats.length > 1 ? cats.map(function (x) {
          return '<button type="button" data-cat="' + esc(x.slug) + '" class="' + (x.slug === CH.cat ? 'on' : '') + '">' + esc(x.label) + '</button>';
        }).join('') : '') + '<span class="sep"></span>' + Object.keys(urg).map(function (k) {
          return '<button type="button" data-urg="' + esc(k) + '" class="u ' + (k === CH.urg ? 'on' : '') + '">' + esc(urg[k]) + '</button>';
        }).join('') + '</div>';
        h += '<form class="ch-in" id="ch-form"><textarea id="ch-txt" rows="1" placeholder="Escreva o pedido para ' + esc(st.label) + '…" aria-label="Pedido"></textarea>' +
          '<button type="submit" aria-label="Enviar">➤</button></form>';
      }
      h += '</div>';
      c.innerHTML = h;
      c.querySelector('[data-ch="volta"]').addEventListener('click', function () { CH.alvo = null; voltaChat(); });
      Array.prototype.forEach.call(c.querySelectorAll('[data-fila]'), function (b) {
        b.addEventListener('click', function () { CH.fila = b.getAttribute('data-fila'); CH.alvo = null; chatSetor(c, slug); });
      });
      Array.prototype.forEach.call(c.querySelectorAll('[data-cat]'), function (b) {
        b.addEventListener('click', function () {
          CH.cat = b.getAttribute('data-cat');
          Array.prototype.forEach.call(c.querySelectorAll('[data-cat]'), function (x) { x.classList.toggle('on', x === b); });
        });
      });
      Array.prototype.forEach.call(c.querySelectorAll('[data-urg]'), function (b) {
        b.addEventListener('click', function () {
          CH.urg = b.getAttribute('data-urg');
          Array.prototype.forEach.call(c.querySelectorAll('[data-urg]'), function (x) { x.classList.toggle('on', x === b); });
        });
      });
      Array.prototype.forEach.call(c.querySelectorAll('[data-responder]'), function (b) {
        b.addEventListener('click', function () { CH.alvo = b.getAttribute('data-responder'); chatSetor(c, slug); });
      });
      Array.prototype.forEach.call(c.querySelectorAll('[data-status]'), function (b) {
        b.addEventListener('click', function () {
          Array.prototype.forEach.call(b.parentNode.querySelectorAll('button'), function (x) { x.disabled = true; });
          api('/api/chat/setor/responder', { metodo: 'POST', corpo: { pedido: b.getAttribute('data-chave'), status: b.getAttribute('data-status') } })
            .then(function (r2) { if (!r2.ok) toast((r2.d && r2.d.erro) || 'Não consegui gravar.'); chatSetor(c, slug); });
        });
      });
      ligaEnvio(c, function (texto) {
        if (d.todos) return api('/api/chat/setor/responder', { metodo: 'POST', corpo: { pedido: alvo, texto: texto } });
        return api('/api/chat/setor', { metodo: 'POST', corpo: { setor: slug, categoria: CH.cat, urgencia: CH.urg, texto: texto } });
      }, function () {
        if (d.todos) CH.alvo = null; else toast('Pedido enviado para ' + st.label + '.');
        chatSetor(c, slug);
      });
      window.scrollTo(0, document.body.scrollHeight);
    });
  }

  function nomeDaChave(d, m) {
    var k = norm(m.nome || '');
    var p = (d.pessoas || []).filter(function (x) { return norm(x.nome) === k; })[0];
    return p ? p.nome : (m.nome || '');
  }

  abre();
})();
</script>
