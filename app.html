}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.kpi{background:var(--sup2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--tx2)}
.kpi.ruim b{color:var(--coral)}
.kpi.atencao b{color:var(--acento)}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.menos{color:var(--coral-tx)}
.mais{color:var(--verde-tx)}
.fora{margin-top:12px;font-size:14px;color:var(--tx2)}

.topo{display:flex;align-items:flex-start;gap:12px}
.topo>div:first-child{flex:1;min-width:0}

.fc .t{flex:1;min-width:0}
.fc .t b{display:block;font-weight:600}

.fc>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);margin:0 4px 4px 0;flex-shrink:0;transition:transform .15s}

.prep{margin-top:10px}

.aviso-f{font-size:13.5px;color:var(--acento-tx);background:var(--acento-bg);border-radius:10px;padding:8px 10px;margin:4px 0 8px}

@media (min-width:900px){.sino-m{display:none}}
@media (prefers-reduced-motion:reduce){.esq{animation:none}.barra i{transition:none}}

    var v = lidos();
    lista.forEach(function (x) { v[idAv(x)] = 1; });
    lsPoe(vKey(), JSON.stringify(v));
    contaNaoLidos();
  }
  function naoLidos(itens) { var v = lidos(); return itens.filter(function (x) { return !v[idAv(x)]; }); }
  function poeConta(n) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-cont]'), function (e) {
      e.textContent = n > 99 ? '99+' : String(n);
      e.hidden = !n;
    });
  }
  function contaNaoLidos() {
    if (!pode('caixa.ver')) return;
    dados.avisos().then(function (r) { if (r.ok) poeConta(naoLidos(r.d.itens || []).length); });
  }

  var CTX = null;
  function pode(k) { return !!CTX && CTX.pode.indexOf(k) >= 0; }
  function legado(pag) { return PREF[CTX.nivel_real] + pag; }

  function estado(titulo, texto, rotulo, href) {
    $('barra-nav').hidden = true;
    $('lado').innerHTML = '';
    document.querySelector('main').innerHTML = '<div class="estado"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) +
      '</p>' + (rotulo ? '<p><a class="btn" href="' + esc(href) + '">' + esc(rotulo) + '</a></p>' : '') + '</div>';
  }

  function abre() {
    var como = S.nivel === 'admin' ? (ls(LS.como) || '') : '';
    api('/api/app' + (como ? '?como=' + encodeURIComponent(como) : '')).then(function (r) {
      if (r.status === 401) {
        estado('Sua sessão venceu', 'Entre de novo com a sua senha. Depois disso você volta direto para cá.',
          'Entrar', 'index.html?trocar=1&volta=app#acesso');
        return;
      }
      if (r.status === 403 && r.d.erro_codigo === 'fora_do_piloto') {
        estado('O app novo ainda não é para o seu acesso',
          'Por enquanto o piloto é só para Equipe de Bar, Maîtres e Administração. O site de sempre continua igual.',
          'Voltar ao site', 'index.html');
        return;
      }
      if (!r.ok || !r.d.pode) {
        estado('Não consegui abrir o app', r.status === 0 ? 'Sem conexão agora. Confira o sinal e tente de novo.'
          : 'O servidor não respondeu como devia. Tente de novo em instantes.', 'Tentar de novo', 'app.html');
        return;
      }
      CTX = r.d;
      montaMoldura();
      vai();
    });
  }

  function montaMoldura() {
    var f = '<span><b>App novo · piloto</b> · roda ao lado do site atual</span>';
    if (CTX.tabela) {
      f += '<span class="como" role="group" aria-label="Ver como"><span>Ver como</span>' +
        [['equipe', 'Equipe'], ['maitres', 'Maîtres'], ['admin', 'Você']].map(function (x) {
          return '<button type="button" data-como="' + x[0] + '" class="' + (CTX.nivel === x[0] ? 'on' : '') +
            '" aria-pressed="' + (CTX.nivel === x[0]) + '">' + x[1] + '</button>';
        }).join('') + '</span>';
    }
    f += '<a class="site" href="' + HOME[CTX.nivel_real] + '">Site atual</a>';
    $('faixa').innerHTML = f;
    Array.prototype.forEach.call(document.querySelectorAll('[data-como]'), function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-como');
        lsPoe(LS.como, v === 'admin' ? null : v);
        $('conteudo').innerHTML = '<div class="esq"></div><div class="esq"></div>';
        abre();
      });
    });
    var quem = CTX.pessoa ? esc(CTX.pessoa) + ' · ' + NOME[CTX.nivel_real] : NOME[CTX.nivel_real];
    $('lado').innerHTML = '<div class="marca">Bento</div><div class="quem">' + quem + '</div>' +
      CTX.nav.map(function (n) {
        return '<button type="button" data-tela="' + n.id + '">' + ic(n.icone) + '<span>' + esc(n.rotulo) + '</span>' +
          (n.id === 'caixa' ? '<span class="cont" data-cont hidden></span>' : '') + '</button>';
      }).join('');
    // No celular a Caixa de entrada é o sino do topo de cada tela, não um
    // botão a mais na barra (com sete, nenhum rótulo caberia).
    var bn = $('barra-nav');
    bn.innerHTML = CTX.nav.filter(function (n) { return n.id !== 'caixa'; }).map(function (n) {
      return '<button type="button" data-tela="' + n.id + '">' + ic(n.icone, 22) + '<span>' + esc(n.curto || n.rotulo) + '</span></button>';
    }).join('');
    bn.hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll('[data-tela]'), function (b) {
      b.addEventListener('click', function () { location.hash = '#/' + b.getAttribute('data-tela'); });
    });
  }

  function telaAtual() {
    var id = (location.hash.match(/^#\/([a-z]+)/) || [])[1] || 'hoje';
    return CTX.nav.some(function (n) { return n.id === id; }) ? id : 'hoje';
  }

  var TELAS = {};
  function vai() {
    if (!CTX) return;
    var id = telaAtual();
    Array.prototype.forEach.call(document.querySelectorAll('[data-tela]'), function (b) {
      var on = b.getAttribute('data-tela') === id;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    var c = $('conteudo');
    c.innerHTML = '';
    if (CTX.como) {
      c.insertAdjacentHTML('beforeend', '<div class="nota"><b>Vendo como ' + esc(NOME[CTX.nivel]) +
        '.</b> Os blocos são os deste nível e os dados são os reais. Marcar item fica desligado nesta prévia.</div>');
    }
    TELAS[id](c);
    contaNaoLidos();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', vai);

  function topo(c, titulo, sub) {
    var sino = pode('caixa.ver') && telaAtual() !== 'caixa'
      ? '<a class="sino-m" href="#/caixa" aria-label="Caixa de entrada">' + ic('sino', 22) +
        '<span class="cont" data-cont hidden></span></a>' : '';
    c.insertAdjacentHTML('beforeend', '<div class="topo"><div><h1>' + esc(titulo) + '</h1>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>' + sino + '</div>');
  }
  // Cada bloco nasce como esqueleto na ordem certa e se preenche sozinho: um
  // pedido lento não empurra os outros nem muda a ordem da tela.
  function bloco(c, cls) {
    var b = document.createElement('div');
    b.className = 'blk' + (cls ? ' ' + cls : '');
    b.innerHTML = '<div class="esq" style="height:52px"></div>';
    c.appendChild(b);
    return b;
  }
  function falhou(b, titulo, r) {
    var msg = r && r.status === 0 ? 'Sem conexão agora.' : (r && r.d && r.d.erro) ? r.d.erro : 'Não consegui carregar.';
    b.innerHTML = '<h2>' + esc(titulo) + '</h2><p class="vazio">' + esc(msg) + '</p>';
  }

  // --- Rotina do dia: as contas são as do mural (bartender-painel.js) ------
  function turnoAgora() { return BP.turnoDoMomento(new Date()); }
  // Almoço inteiro registrado: o que vem agora é a abertura do jantar, mesmo
  // antes das 15h. Uma tela que segue mostrando um turno fechado ensina a
  // ignorar o card.
  function turnoPadrao(d) {
    var t = turnoAgora();
    if (t === 'Dia' && BP.faseDoMomento(d.turnos_enviados, 'Dia').concluido) return 'Noite';
    return t;
  }
  function donosPorItem(d, turno) {
    var out = {};
    var div = (d.hoje && d.hoje.divisao && d.hoje.divisao[turno]) || {};
    Object.keys(div).forEach(function (p) {
      (div[p] || []).forEach(function (id) { (out[id] = out[id] || []).push(p); });
    });
    return out;
  }
  function meusIds(d, turno) {
    if (!CTX.pessoa) return null;
    var div = (d.hoje && d.hoje.divisao && d.hoje.divisao[turno]) || {};
    var meu = null;
    Object.keys(div).forEach(function (p) {
      if (p.toLowerCase() === CTX.pessoa.toLowerCase()) meu = div[p] || [];
    });
    return meu;
  }

  TELAS.hoje = function (c) {
    topo(c, 'Hoje', hojeExtenso() + ' · ' + TURNO_ROT[turnoAgora()]);
    var nome = CTX.pessoa ? primeiroNome(CTX.pessoa) : NOME[CTX.nivel];
    c.insertAdjacentHTML('beforeend', '<div class="blk saud"><h3>' + esc(saudacao()) + ', ' + esc(nome) +
      '</h3><p>' + (CTX.nivel === 'equipe' ? 'O que importa no turno agora, numa tela só.'
        : CTX.nivel === 'maitres' ? 'O turno, a ronda e a contagem da semana, numa tela só.'
          : 'O bar inteiro agora: turno, ronda, contagem e acessos.') + '</p></div>');

    if (pode('hoje.agora')) {
      var bA = bloco(c, 'agora destaque');
      dados.rotinas().then(function (r) {
        if (!r.ok) {
          if (r.status === 404) { bA.innerHTML = '<h2>Agora no bar</h2><p class="vazio">A rotina de hoje ainda não foi publicada.</p>'; return; }
          falhou(bA, 'Agora no bar', r); return;
        }
        var d = r.d, turno = turnoPadrao(d);
        var st = BP.faseDoMomento(d.turnos_enviados, turno);
        if (st.concluido) {
          bA.className = 'blk agora';
          bA.innerHTML = '<h2>Turno de hoje</h2><div class="tt">' + TURNO_ROT[turno] + ' registrado</div>' +
            '<p class="vazio">Abertura e fechamento enviados.</p>';
          return;
        }
        var blocos = RC.blocosDaFase(st.fase);
        var prog = BP.progressoDoTurno(d, blocos, turno);
        var texto = BP.textoDoQueFalta(BP.resumoDoQueFalta(d, blocos, turno));
        var antes = turno !== turnoAgora() ? '<p class="vazio">Almoço já registrado: abertura e fechamento enviados.</p>' : '';
        bA.innerHTML = '<h2>Agora no bar</h2>' + antes + '<div class="tt">' + (st.fase === 'abertura' ? 'Abertura' : 'Fechamento') +
          ' do ' + TURNO_ROT[turno].toLowerCase() + '</div><p>' + esc(texto.charAt(0).toUpperCase() + texto.slice(1)) + '</p>' +
          (prog.total ? '<div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="' + prog.total +
            '" aria-valuenow="' + prog.feitos + '"><i style="width:' + prog.pct + '%"></i></div><p class="vazio">' +
            prog.feitos + ' de ' + prog.total + ' itens marcados</p>' : '') +
          '<div class="acoes"><a class="btn" href="#/turno">Abrir o checklist</a></div>';
      });
    }

    if (pode('hoje.avisos')) {
      var bV = bloco(c);
      dados.avisos().then(function (r) {
        if (!r.ok) { falhou(bV, 'Avisos', r); return; }
        var itens = (r.d.itens || []).slice(0, 4);
        var nNovos = naoLidos(r.d.itens || []).length;
        bV.innerHTML = '<h2>Avisos</h2>' + (itens.length ? itens.map(function (a) {
          var desc = String(a.descricao || '');
          if (desc.length > 120) desc = desc.slice(0, 117) + '...';
          return '<div class="linha"><div class="t">' + esc(a.titulo) + (desc ? '<small>' + esc(desc) + '</small>' : '') +
            '</div><span class="v">' + esc(dataBr(a.quando)) + '</span></div>';
        }).join('') : '<p class="vazio">Nada novo por aqui.</p>') +
          (pode('caixa.ver') && itens.length ? '<a class="linha vai" href="#/caixa"><div class="t">Abrir a caixa de entrada</div><span class="v">' +
            (nNovos ? '<span class="pill atencao">' + nNovos + ' sem ler</span>' : 'tudo lido') + '</span></a>' : '');
      });
    }

    if (pode('hoje.escala')) {
      var bE = bloco(c);
      dados.rotinas().then(function (r) {
        if (!r.ok) { falhou(bE, 'Quem trabalha hoje', r); return; }
        var esc0 = (r.d.hoje && r.d.hoje.escala) || {};
        var linhas = ['Dia', 'Noite'].map(function (t) {
          var nomes = esc0[t] || [];
          return '<div class="linha"><div class="t">' + TURNO_ROT[t] + '</div><span class="v">' +
            (nomes.length ? esc(nomes.join(', ')) : 'sem escala') + '</span></div>';
        }).join('');
        bE.innerHTML = '<h2>Quem trabalha hoje</h2>' + linhas +
          (BP.escalaConfirmada(r.d) ? '' : '<p class="vazio" style="margin-top:6px">Pela escala padrão: a escala publicada não cobre hoje.</p>');
      });
    }

    if (pode('hoje.contagem')) {
      var bC = bloco(c);
      dados.semanas().then(function (r) {
        if (!r.ok) { falhou(bC, 'Contagem da semana', r); return; }
        var st = situacaoSemana(r.d.contagens || [], 'insumos');
        bC.innerHTML = '<h2>Contagem da semana</h2><a class="linha" href="#/contagem"><div class="t">Insumos<small>' +
          esc(st.detalhe) + '</small></div><span class="v"><span class="pill ' + st.cls + '">' + esc(st.rotulo) + '</span></span></a>';
      });
    }

    if (pode('hoje.copos')) {
      var bK = bloco(c);
      Promise.all([dados.semanas(), pode('copos.controle') ? dados.historico() : Promise.resolve(null)]).then(function (rs) {
        var r = rs[0], rh = rs[1];
        if (!r.ok) { falhou(bK, 'Copos e taças', r); return; }
        var st = situacaoSemana(r.d.contagens || [], 'copos');
        var extra = '';
        var k = rh && rh.ok ? controleCopos(rh.d, null) : null;
        if (k) {
          var t = totaisCopos(k);
          var partes = [];
          if (t.itensAbaixo) partes.push(t.itensAbaixo + (t.itensAbaixo === 1 ? ' item abaixo do par' : ' itens abaixo do par'));
          var nFora = t.foraComPar.length + t.fora.length;
          if (nFora) partes.push(nFora + (nFora === 1 ? ' item sem contar' : ' itens sem contar'));
          if (partes.length) extra = '<small>' + esc(partes.join(' · ')) + '</small>';
        }
        bK.innerHTML = '<h2>Copos e taças</h2><a class="linha" href="#/copos"><div class="t">Contagem de copos<small>' +
          esc(st.detalhe) + '</small>' + extra + '</div><span class="v"><span class="pill ' + st.cls + '">' + esc(st.rotulo) + '</span></span></a>';
      });
    }

    if (pode('hoje.ronda')) {
      var bR = bloco(c);
      dados.ronda().then(function (r) {
        if (!r.ok) {
          if (r.d && r.d.erro_codigo === 'sem_rotinas') { bR.innerHTML = '<h2>Ronda do maître</h2><p class="vazio">Sem rotina publicada para hoje.</p>'; return; }
          falhou(bR, 'Ronda do maître', r); return;
        }
        var total = (r.d.itens || []).length;
        var feitos = {};
        (r.d.feitos || []).forEach(function (f) { feitos[f.item_id] = true; });
        var n = (r.d.itens || []).filter(function (i) { return feitos[i.id || i.item_id]; }).length;
        var cls = n >= total ? 'ok' : 'atencao';
        bR.innerHTML = '<h2>Ronda do maître</h2><a class="linha" href="' + legado('ronda.html') +
          '"><div class="t">Conferência sorteada de hoje<small>Três itens da rotina, com foto</small></div><span class="v"><span class="pill ' +
          cls + '">' + n + ' de ' + total + '</span></span></a>';
      });
    }

    if (pode('hoje.acessos')) {
      var bP = bloco(c);
      dados.pendentes().then(function (r) {
        var itens = (r.ok && r.d.itens) || [];
        if (!itens.length) { bP.remove(); return; }
        bP.innerHTML = '<h2>Acessos</h2><a class="linha" href="acessos.html"><div class="t">' + itens.length +
          (itens.length === 1 ? ' pedido de acesso esperando' : ' pedidos de acesso esperando') +
          '</div><span class="v">decidir</span></a>';
      });
    }
  };

  // Semana da contagem: a de início mais recente que já começou. Sem página
  // da semana não é "atrasada": a página nasce pelo robô de sexta.
  function situacaoSemana(lista, tipo) {
    var hoje = RC.hoje();
    var doTipo = lista.filter(function (x) { return x.tipo === tipo && x.inicio && x.inicio <= hoje; })
      .sort(function (a, b) { return a.inicio < b.inicio ? 1 : -1; });
    var s = doTipo[0];
    if (!s) return { rotulo: 'sem semana aberta', cls: '', detalhe: 'Nenhuma semana nos últimos dois meses', semana: null };
    var dias = Math.round((new Date(hoje) - new Date(s.inicio)) / 86400000);
    var atual = dias < 7;
    if (s.itens) {
      return { rotulo: atual ? 'feita' : 'última feita', cls: atual ? 'ok' : 'atencao', semana: s,
        detalhe: rotSemana(s.semana) + ' · ' + s.itens + ' itens' + (s.responsavel ? ' · ' + quemContou(s.responsavel) : '') +
          (s.data ? ' · ' + dataBr(s.data) : '') };
    }
    return { rotulo: atual ? 'falta contar' : 'atrasada', cls: atual ? 'atencao' : 'ruim', semana: s,
      detalhe: rotSemana(s.semana) + ' aberta em ' + dataBr(s.inicio) };
  }

  // --- Turno: o checklist do dia, marcável -----------------------------------
  var turnoSel = null, faseSel = null, soMeus = null;

  TELAS.turno = function (c) {
    topo(c, 'Turno', 'Rotina de hoje · ' + hojeExtenso());
    var b = bloco(c);
    var bl = bloco(c);
    dados.rotinas().then(function (r) {
      if (!r.ok) {
        if (r.status === 404) { b.innerHTML = '<h2>Rotina</h2><p class="vazio">A rotina de hoje ainda não foi publicada.</p>'; bl.remove(); return; }
        falhou(b, 'Rotina', r); bl.remove(); return;
      }
      var d = r.d;
      if (!turnoSel) turnoSel = turnoPadrao(d);
      if (!faseSel) faseSel = BP.faseDoMomento(d.turnos_enviados, turnoSel).fase;
      var meus = meusIds(d, turnoSel);
      if (soMeus === null) soMeus = CTX.nivel === 'equipe' && !!(meus && meus.length);
      desenhaTurno(b, bl, d);
    });
  };

  function desenhaTurno(b, bl, d) {
    var meus = meusIds(d, turnoSel);
    var blocos = RC.blocosDaFase(faseSel);
    var prog = BP.progressoDoTurno(d, blocos, turnoSel);
    var rotProg = 'itens do time marcados neste turno';
    if (soMeus && meus && meus.length) {
      // Com o filtro, a barra conta o que a pessoa VÊ: a régua do time numa
      // lista só com os itens dela faria "0 de 9" com três itens na tela.
      var feitosT = BP.feitosNoTurno(d, turnoSel), mi = 0, mf = 0;
      BP.idsDaFase(d, blocos).forEach(function (id) {
        if (meus.indexOf(id) < 0) return;
        mi++; if (feitosT[id]) mf++;
      });
      prog = { feitos: mf, total: mi, pct: mi ? Math.round(mf / mi * 100) : 0 };
      rotProg = 'dos seus itens marcados';
    }
    var h = '<div class="controles">' +
      '<div class="seg" role="group" aria-label="Turno">' + ['Dia', 'Noite'].map(function (t) {
        return '<button type="button" data-turno="' + t + '" class="' + (t === turnoSel ? 'on' : '') + '" aria-pressed="' + (t === turnoSel) + '">' + TURNO_ROT[t] + '</button>';
      }).join('') + '</div>' +
      '<div class="seg" role="group" aria-label="Fase">' + [['abertura', 'Abertura'], ['fechamento', 'Fechamento']].map(function (f) {
        return '<button type="button" data-fase="' + f[0] + '" class="' + (f[0] === faseSel ? 'on' : '') + '" aria-pressed="' + (f[0] === faseSel) + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      (meus && meus.length ? '<label class="chk"><input type="checkbox" id="so-meus"' + (soMeus ? ' checked' : '') + '> Só os meus</label>' : '') +
      '</div>' +
      '<div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="' + prog.total + '" aria-valuenow="' + prog.feitos +
      '"><i style="width:' + prog.pct + '%"></i></div><p class="vazio">' + prog.feitos + ' de ' + prog.total + ' ' + rotProg + '</p>';
    if (pode('turno.envios')) {
      var env = d.turnos_enviados || [];
      h += '<div class="envios" style="margin-top:10px">' + [['Dia', 'abertura'], ['Dia', 'fechamento'], ['Noite', 'abertura'], ['Noite', 'fechamento']].map(function (x) {
        var e = env.filter(function (y) { return BP._mesmoTurno(y.turno, x[0]) && y.fase === x[1]; })[0];
        return '<span class="pill ' + (e ? 'ok' : '') + '">' + TURNO_ROT[x[0]] + ' · ' + x[1] + (e ? ' · ' + esc(primeiroNome(e.pessoa)) : ' · não enviado') + '</span>';
      }).join('') + '</div>';
    }
    if (pode('turno.enviar')) {
      h += '<div class="acoes"><a class="btn sec" href="' + legado(faseSel === 'abertura' ? 'turno-abertura.html' : 'turno.html') +
        '">' + ic('camera', 18) + (faseSel === 'abertura' ? 'Enviar a abertura' : 'Enviar o fechamento') + ' com foto</a></div>';
    }
    b.innerHTML = h;
    Array.prototype.forEach.call(b.querySelectorAll('[data-turno]'), function (x) {
      x.addEventListener('click', function () {
        turnoSel = x.getAttribute('data-turno');
        faseSel = BP.faseDoMomento(d.turnos_enviados, turnoSel).fase;
        desenhaTurno(b, bl, d);
      });
    });
    Array.prototype.forEach.call(b.querySelectorAll('[data-fase]'), function (x) {
      x.addEventListener('click', function () { faseSel = x.getAttribute('data-fase'); desenhaTurno(b, bl, d); });
    });
    var sm = $('so-meus');
    if (sm) sm.addEventListener('change', function () { soMeus = sm.checked; desenhaTurno(b, bl, d); });
    desenhaLista(bl, d, blocos, meus);
  }

  function desenhaLista(bl, d, blocos, meus) {
    var feitos = BP.feitosNoTurno(d, turnoSel);
    var donos = pode('turno.divisao') ? donosPorItem(d, turnoSel) : {};
    var filtro = soMeus && meus ? meus : null;
    var meta = {};
    (d.blocos || []).forEach(function (x) { meta[x.chave] = x.rotulo; });
    var tarefasPorBloco = {};
    (d.tarefas || []).forEach(function (t) { (tarefasPorBloco[t.bloco || 'durante'] = tarefasPorBloco[t.bloco || 'durante'] || []).push(t); });
    var podeMarcar = pode('turno.marcar') && !CTX.como;
    var h = '';
    blocos.forEach(function (bk) {
      var ids = ((d.hoje && d.hoje.blocos && d.hoje.blocos[bk]) || []).filter(function (id) {
        return d.itens && d.itens[id] && (!filtro || filtro.indexOf(id) >= 0);
      });
      // Tarefa sem responsável é do time e aparece sempre; com responsável, o
      // filtro "Só os meus" esconde a dos outros.
      var tar = (tarefasPorBloco[bk] || []).filter(function (t) {
        return !filtro || !t.responsavel || t.responsavel.toLowerCase() === String(CTX.pessoa || '').toLowerCase();
      });
      if (!ids.length && !tar.length) return;
      h += '<div class="grupo"><h3>' + esc(meta[bk] || bk) + '</h3>';
      ids.forEach(function (id) {
        var it = d.itens[id];
        var tags = [];
        if (it.prio) tags.push('<span class="pill atencao">prioritário</span>');
        var fq = RC.freqLegivel(it.freq);
        if (fq) tags.push('<span>' + fq + '</span>');
        if (donos[id]) tags.push('<span>' + esc(donos[id].join(', ')) + '</span>');
        if (feitos[id] && feitos[id].pessoa) tags.push('<span>marcado por ' + esc(primeiroNome(feitos[id].pessoa)) + '</span>');
        h += item(id, it.t, !!feitos[id], tags, podeMarcar);
      });
      tar.forEach(function (t) {
        var tags = ['<span class="pill">tarefa</span>'];
        if (t.prio) tags.push('<span class="pill atencao">prioritário</span>');
        if (t.prazo) tags.push('<span>até ' + dataBr(t.prazo) + '</span>');
        if (t.responsavel) tags.push('<span>para ' + esc(t.responsavel) + '</span>');
        h += item(t.id, t.titulo, !!feitos[t.id], tags, podeMarcar);
      });
      h += '</div>';
    });
    bl.innerHTML = h || '<p class="vazio">' + (filtro ? 'Nada seu nesta fase. Desmarque "Só os meus" para ver o resto.' : 'Nada nesta fase hoje.') + '</p>';
    Array.prototype.forEach.call(bl.querySelectorAll('.ck'), function (x) {
      x.addEventListener('click', function () { marca(x, bl, d); });
    });
  }

  function item(id, titulo, feito, tags, podeMarcar) {
    return '<button type="button" class="ck' + (feito ? ' feito' : '') + '" data-id="' + esc(id) + '" data-feito="' + (feito ? 1 : 0) +
      '" aria-pressed="' + feito + '"' + (podeMarcar ? '' : ' aria-disabled="true"') + '><span class="box">' + ic('check-circle', 16) +
      '</span><span class="t"><span>' + esc(titulo) + '</span>' + (tags.length ? '<span class="tags">' + tags.join('') + '</span>' : '') + '</span></button>';
  }

  var pendente = null;
  function marca(x, bl, d) {
    if (CTX.como) { toast('Na prévia de outro nível, marcar fica desligado.'); return; }
    if (!pode('turno.marcar')) return;
    if (x.classList.contains('ocupado')) return;
    var senha = ls(LS.senha);
    if (!senha) { pedeSenha(x, bl, d, ''); return; }
    envia(x, bl, d, senha);
  }

  function envia(x, bl, d, senha) {
    var feito = x.getAttribute('data-feito') !== '1';
    x.classList.add('ocupado');
    api('/api/rotina/concluir', { metodo: 'POST', corpo: {
      senha_pessoa: senha, dia: RC.diaOperacional(), turno: turnoSel, item_id: x.getAttribute('data-id'), feito: feito,
    } }).then(function (r) {
      if (r.ok && r.d.ok) {
        lsPoe(LS.senha, senha);
        fechaSenha();
        toast(feito ? 'Marcado.' : 'Desmarcado.');
        // Recarrega do servidor: se alguém marcou no mesmo minuto, a tela
        // mostra a verdade dela também.
        dados.rotinas(true).then(function (n) {
          if (n.ok) { cache.rotinas = { em: Date.now(), p: Promise.resolve(n) }; desenhaTurno(bl.previousSibling, bl, n.d); }
          else x.classList.remove('ocupado');
        });
        return;
      }
      x.classList.remove('ocupado');
      if (r.status === 403 && /senha/i.test(r.d.erro || '')) {
        lsPoe(LS.senha, null);
        pedeSenha(x, bl, d, r.d.erro);
        return;
      }
      if (pendente) $('folha-erro').textContent = r.d.erro || 'Não consegui marcar agora.';
      toast(r.status === 0 ? 'Sem conexão: não marcou. Tente de novo com sinal.' : (r.d.erro || 'Não consegui marcar agora.'));
    });
  }

  function pedeSenha(x, bl, d, erro) {
    pendente = { x: x, bl: bl, d: d };
    $('folha-erro').textContent = erro || '';
    $('folha-senha').value = '';
    $('folha').classList.add('on');
    setTimeout(function () { $('folha-senha').focus(); }, 50);
  }
  function fechaSenha() { pendente = null; $('folha').classList.remove('on'); }
  $('folha-cancela').addEventListener('click', fechaSenha);
  $('folha').addEventListener('click', function (e) { if (e.target === $('folha')) fechaSenha(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pendente) fechaSenha(); });
  $('folha-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = $('folha-senha').value.trim();
    if (!s || !pendente) return;
    $('folha-erro').textContent = 'Conferindo...';
    envia(pendente.x, pendente.bl, pendente.d, s);
  });

  // --- Copos: a contagem contra o par e contra a anterior ---------------------
  // A conta de sumiço e quebra é a do mural do maître (reconcilia-vidraria.js),
  // nunca uma cópia. Aqui só se junta o que ela não cobre: o par do cadastro,
  // o que ficou sem contar e o que falta comprar. Dinheiro não entra nesta tela.
  function nomeK(s) { return RV ? RV._norm(s) : String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }

  function semanasUteis(hist) {
    return ((hist && hist.semanas) || []).map(function (s) {
      var d = '', tem = false;
      (s.copos || []).forEach(function (x) {
        if ((x.data || '') > d) d = x.data;
        if (typeof x.contagem === 'number' && x.contagem > 0) tem = true;
      });
      return { semana: s.semana, data: d, copos: s.copos || [], util: tem };
    }).filter(function (s) { return s.util; })
      .sort(function (a, b) { return a.data < b.data ? 1 : -1; });
  }

  function porNome(lista) {
    var m = {};
    lista.forEach(function (x) {
      var k = nomeK(x.nome);
      if (!k) return;
      if (m[k]) m[k].contagem += x.contagem || 0;
      else m[k] = { nome: x.nome, contagem: x.contagem || 0, lastro: x.lastro == null ? null : x.lastro, responsavel: x.responsavel || '' };
    });
    return m;
  }

  function controleCopos(hist, queb) {
    var uteis = semanasUteis(hist);
    if (!uteis.length) return null;
    var at = uteis[0], an = uteis[1] || null;
    var mA = porNome(at.copos), mB = an ? porNome(an.copos) : {};
    var rec = an && RV ? RV.reconciliaVidraria({ semanas: hist.semanas || [], meses: (queb && queb.meses) || [] }) : null;
    var recPor = {};
    if (rec && rec.ok) rec.itens.forEach(function (i) { recPor[nomeK(i.nome)] = i; });
    var linhas = [], vistos = {};
    function poe(nome, grupo, parCad) {
      var k = nomeK(nome);
      if (!k || vistos[k]) return;
      vistos[k] = 1;
      var a = mA[k], b = mB[k], r = recPor[k];
      // Par: o do cadastro manda; sem cadastro, o que veio carimbado na contagem.
      var par = parCad != null ? parCad : (a && a.lastro != null ? a.lastro : null);
      linhas.push({
        nome: (a && a.nome) || nome, grupo: grupo, par: par,
        atual: a ? a.contagem : null, anterior: b ? b.contagem : null,
        falta: a && par != null && par > a.contagem ? par - a.contagem : 0,
        reportado: r ? r.reportado : null, semExpl: r ? r.semExplicacao : null, incons: r ? !!r.inconsistente : false,
      });
    }
    COPOS.forEach(function (x) { poe(x.nome, x.grupo, x.lastro); });
    Object.keys(mA).forEach(function (k) { poe(mA[k].nome, 'outro', null); });
    Object.keys(mB).forEach(function (k) { poe(mB[k].nome, 'outro', null); });
    // Agrupa pela ordem dos grupos sem mexer na ordem da prateleira dentro de
    // cada um (é a ordem em que se conta).
    var ordemG = { copo: 0, equipamento: 1, outro: 2 };
    function og(g) { return Object.prototype.hasOwnProperty.call(ordemG, g) ? ordemG[g] : 2; }
    linhas = linhas.map(function (l, i) { return [l, i]; }).sort(function (x, y) {
      return (og(x[0].grupo) - og(y[0].grupo)) || x[1] - y[1];
    }).map(function (x) { return x[0]; });
    var resp = '';
    Object.keys(mA).some(function (k) { resp = mA[k].responsavel; return !!resp; });
    return { atual: at, anterior: an, rec: rec && rec.ok ? rec : null, linhas: linhas, responsavel: resp };
  }

  function totaisCopos(k) {
    var t = { abaixo: 0, itensAbaixo: 0, semPar: [], foraComPar: [], fora: [], sumiu: null, reportado: null, semExpl: null };
    k.linhas.forEach(function (l) {
      if (l.atual == null) { (l.par != null ? t.foraComPar : t.fora).push(l); return; }
      if (l.par == null) t.semPar.push(l);
      if (l.falta) { t.abaixo += l.falta; t.itensAbaixo++; }
    });
    if (k.rec) { t.sumiu = k.rec.totais.sumiu; t.reportado = k.rec.totais.reportado; t.semExpl = k.rec.totais.semExplicacao; }
    return t;
  }

  function kpi(valor, rotulo, cls) {
    return '<div class="kpi ' + (cls || '') + '"><b>' + (valor == null ? '—' : esc(valor)) + '</b><span>' + esc(rotulo) + '</span></div>';
  }

  TELAS.copos = function (c) {
    var controle = pode('copos.controle');
    topo(c, 'Copos e taças', controle ? 'Contagem, par e quebras' : 'Contar e registrar quebra');
    var b1 = bloco(c);
    dados.semanas().then(function (r) {
      if (!r.ok) { falhou(b1, 'Contagem da semana', r); return; }
      var st = situacaoSemana(r.d.contagens || [], 'copos');
      b1.innerHTML = '<h2>Contagem da semana</h2><div class="linha"><div class="t">Copos e vidraria<small>' + esc(st.detalhe) +
        '</small></div><span class="v"><span class="pill ' + st.cls + '">' + esc(st.rotulo) + '</span></span></div>' +
        '<div class="acoes">' + (pode('copos.contar') ? '<a class="btn" href="' + legado('contagem-copos.html') + '">Contar copos</a>' : '') +
        (pode('copos.quebra') ? '<a class="btn sec" href="' + legado('quebras.html') + '">' + ic('taca-trincada', 18) + 'Registrar quebra</a>' : '') + '</div>' +
        '<p class="vazio" style="margin-top:10px">Quebrou? Registre na hora. Quebra registrada explica a diferença; a que ninguém registra aparece como sumiço na contagem seguinte.</p>';
    });

    if (!controle) {
      var grupos = {};
      COPOS.forEach(function (x) { (grupos[x.grupo] = grupos[x.grupo] || []).push(x); });
      var h = '<div class="blk"><h2>O que se conta</h2>';
      ['copo', 'equipamento', 'outro'].forEach(function (g) {
        if (!grupos[g]) return;
        h += '<div class="grupo"><h3>' + esc(GRUPO_ROT[g]) + '</h3>' + grupos[g].map(function (x) {
          return '<div class="linha"><div class="t">' + esc(x.nome) + '</div><span class="v">' + (x.lastro != null ? 'par ' + esc(x.lastro) : '') + '</span></div>';
        }).join('') + '</div>';
      });
      c.insertAdjacentHTML('beforeend', h + '</div>');
      return;
    }

    var bR = bloco(c, 'destaque'), bP = bloco(c), bT = bloco(c);
    var bQ = pode('copos.quebras') ? bloco(c) : null;
    Promise.all([dados.historico(), bQ ? dados.quebras() : Promise.resolve(null)]).then(function (rs) {
      var rh = rs[0], rq = rs[1];
      if (!rh.ok) { falhou(bR, 'Controle de copos', rh); bP.remove(); bT.remove(); if (bQ) bQ.remove(); return; }
      var queb = rq && rq.ok ? rq.d : null;
      var k = controleCopos(rh.d, queb);
      if (!k) {
        bR.innerHTML = '<h2>Controle de copos</h2><p class="vazio">Nenhuma contagem de copos com número nos últimos seis meses.</p>';
        bP.remove(); bT.remove(); if (bQ) bQ.remove(); return;
      }
      desenhaResumoCopos(bR, k);
      desenhaReporCopos(bP, k);
      desenhaTabelaCopos(bT, k);
      if (bQ) desenhaQuebrasCopos(bQ, k, rq);
    });
  };

  function desenhaResumoCopos(b, k) {
    var t = totaisCopos(k);
    var desde = k.anterior ? dataBr(k.anterior.data) : '';
    var h = '<h2>Última contagem</h2><div class="agora"><div class="tt">' + dataBr(k.atual.data) +
      (k.responsavel ? ' · ' + esc(quemContou(k.responsavel)) : '') + '</div></div>' +
      '<p class="vazio">' + (k.anterior ? 'Comparada com a contagem de ' + desde + ' (' + esc(rotSemana(k.anterior.semana)) + ').'
        : 'É a primeira contagem com número: a comparação começa na próxima.') + '</p>' +
      '<div class="kpis">' +
      kpi(t.abaixo, 'peças abaixo do par em ' + t.itensAbaixo + (t.itensAbaixo === 1 ? ' item' : ' itens'), t.abaixo ? 'atencao' : '') +
      kpi(t.foraComPar.length + t.fora.length, 'itens sem contar nesta contagem', t.foraComPar.length ? 'ruim' : '') +
      kpi(t.sumiu, k.anterior ? 'peças a menos desde ' + desde : 'peças a menos', t.sumiu ? 'ruim' : '') +
      kpi(t.reportado, 'quebras registradas no período', '') + '</div>';
    if (t.semExpl) {
      h += '<p style="margin-top:8px"><b>' + t.semExpl + (t.semExpl === 1 ? ' peça sumiu' : ' peças sumiram') +
        ' sem quebra registrada</b> entre ' + desde + ' e ' + dataBr(k.atual.data) + '.</p>';
    }
    if (t.foraComPar.length || t.fora.length) {
      h += '<div class="fora">Ficaram fora desta contagem: ' + t.foraComPar.concat(t.fora).map(function (l) {
        return '<span class="pill ' + (l.par != null ? 'ruim' : '') + '">' + esc(l.nome) + (l.par != null ? ' · par ' + l.par : '') + '</span>';
      }).join('') + '</div>';
    }
    b.innerHTML = h;
  }

  function desenhaReporCopos(b, k) {
    var t = totaisCopos(k);
    var abaixo = k.linhas.filter(function (l) { return l.falta > 0; }).sort(function (x, y) { return y.falta - x.falta; });
    var h = '<h2>Para repor até o par</h2>';
    h += abaixo.length ? abaixo.map(function (l) {
      var cls = l.atual * 2 < l.par ? 'ruim' : 'atencao';
      return '<div class="linha"><div class="t">' + esc(l.nome) + '<small>tem ' + l.atual + ' de ' + l.par + '</small></div>' +
        '<span class="v"><span class="pill ' + cls + '">faltam ' + l.falta + '</span></span></div>';
    }).join('') : '<p class="vazio">Tudo o que foi contado está no par ou acima.</p>';
    if (t.semPar.length) {
      h += '<p class="vazio" style="margin-top:10px">Sem par definido, então sem conta de reposição: ' +
        esc(t.semPar.map(function (l) { return l.nome + ' (' + l.atual + ')'; }).join(', ')) + '. O par se define no Catálogo de Copos.</p>';
    }
    h += '<p class="vazio" style="margin-top:6px">Par é a quantidade de referência do cadastro de copos. Item que ficou sem contar não entra nesta lista.</p>';
    b.innerHTML = h;
  }

  function dif(l) {
    if (l.atual == null || l.anterior == null) return '';
    var d = l.atual - l.anterior;
    if (!d) return '0';
    return '<span class="' + (d < 0 ? 'menos' : 'mais') + '">' + (d < 0 ? '−' + (-d) : '+' + d) + '</span>';
  }

  function desenhaTabelaCopos(b, k) {
    var dA = dataBr(k.atual.data), dB = k.anterior ? dataBr(k.anterior.data) : '';
    var h = '<h2>Item a item</h2><div class="tab-wrap"><table><thead><tr><th>Item</th><th class="n">Par</th>' +
      (k.anterior ? '<th class="n">' + dB + '</th>' : '') + '<th class="n">' + dA + '</th>' +
      (k.anterior ? '<th class="n">Dif.</th><th class="n">Quebras</th>' : '') + '</tr></thead><tbody>';
    var ultimo = '';
    k.linhas.forEach(function (l) {
      if (l.grupo !== ultimo) {
        ultimo = l.grupo;
        h += '<tr class="sec"><td colspan="' + (k.anterior ? 6 : 3) + '">' + esc(GRUPO_ROT[l.grupo] || l.grupo) + '</td></tr>';
      }
      // Quebra maior que o sumiço só é suspeita quando o número não subiu: se
      // subiu, entrou copo (compra) e a quebra cabe na diferença.
      var nota = l.atual == null ? '<small>não contado em ' + dA + '</small>'
        : l.incons && l.atual <= l.anterior ? '<small>mais quebra registrada que sumiço: conferir a contagem</small>' : '';
      h += '<tr><td>' + esc(l.nome) + nota + '</td><td class="n">' + (l.par == null ? '—' : l.par) + '</td>' +
        (k.anterior ? '<td class="n">' + (l.anterior == null ? '—' : l.anterior) + '</td>' : '') +
        '<td class="n">' + (l.atual == null ? '—' : '<b>' + l.atual + '</b>') + '</td>' +
        (k.anterior ? '<td class="n">' + dif(l) + '</td><td class="n">' + (l.reportado ? l.reportado : '') + '</td>' : '') + '</tr>';
    });
    h += '</tbody></table></div>';
    if (k.anterior) h += '<p class="vazio" style="margin-top:8px">Dif. compara as duas contagens; Quebras são as registradas entre ' + dB + ' e ' + dA + '. Número a mais quer dizer compra, peça achada ou contagem anterior incompleta.</p>';
    b.innerHTML = h;
  }

  function desenhaQuebrasCopos(b, k, rq) {
    if (!rq || !rq.ok) { falhou(b, 'Quebras registradas', rq); return; }
    var todas = [];
    (rq.d.meses || []).forEach(function (m) { (m.entradas || []).forEach(function (e) { todas.push(e); }); });
    todas.sort(function (x, y) { return (x.data || '') < (y.data || '') ? 1 : -1; });
    var depois = todas.filter(function (e) { return (e.data || '') > k.atual.data; });
    var nDepois = depois.reduce(function (s, e) { return s + (e.quantidade || 0); }, 0);
    var h = '<h2>Quebras registradas</h2><div class="linha"><div class="t">Desde a última contagem (' + dataBr(k.atual.data) + ')</div><span class="v">' +
      (nDepois ? '<span class="pill atencao">' + nDepois + (nDepois === 1 ? ' peça' : ' peças') + '</span>' : 'nenhuma') + '</span></div>';
    h += todas.length ? todas.slice(0, 6).map(function (e) {
      return '<div class="linha"><div class="t">' + esc(e.nome) + '<small>' + esc(e.motivo || '') + (e.responsavel ? ' · ' + esc(e.responsavel) : '') +
        '</small></div><span class="v">' + esc(e.quantidade) + ' · ' + dataBr(e.data) + '</span></div>';
    }).join('') : '<p class="vazio">Nenhuma quebra registrada nos últimos seis meses.</p>';
    h += '<div class="acoes"><a class="btn sec" href="' + legado('quebras-historico.html') + '">' + ic('chart', 18) + 'Histórico de quebras</a></div>';
    b.innerHTML = h;
  }

  // --- Contagem ---------------------------------------------------------------
  TELAS.contagem = function (c) {
    topo(c, 'Contagem', 'Contagens semanais do bar');
    var b = bloco(c);
    var bh = bloco(c);
    dados.semanas().then(function (r) {
      if (!r.ok) { falhou(b, 'Esta semana', r); bh.remove(); return; }
      var lista = r.d.contagens || [];
      b.innerHTML = '<h2>Esta semana</h2>' + TIPOS.map(function (t) {
        var st = situacaoSemana(lista, t[0]);
        return '<div class="linha"><div class="t">' + t[1] + '<small>' + esc(st.detalhe) + '</small></div><span class="v"><span class="pill ' +
          st.cls + '">' + esc(st.rotulo) + '</span></span></div>';
      }).join('') + (pode('contagem.contar') ? '<div class="acoes"><a class="btn" href="' + legado('contagem-insumos.html') +
        '">Contar insumos</a><a class="btn sec" href="' + legado('contagem-copos.html') + '">Contar copos</a></div>' +
        '<p class="vazio" style="margin-top:10px">Nesta fase do piloto, o formulário de contagem continua na página atual.</p>' : '');
      var recentes = lista.filter(function (x) { return x.tipo === 'insumos'; }).slice(0, 6);
      bh.innerHTML = '<h2>Últimas contagens de insumos</h2>' + (recentes.length ? '<div class="tab-wrap"><table><thead><tr><th>Semana</th><th>Contada em</th><th>Quem</th><th class="c">Itens</th></tr></thead><tbody>' +
        recentes.map(function (x) {
          return '<tr><td>' + esc(rotSemana(x.semana)) + (x.inicio ? '<small>' + dataBr(x.inicio) + '</small>' : '') + '</td><td>' + (x.data ? dataBr(x.data) : '<span class="pill atencao">falta</span>') +
            '</td><td>' + esc(x.responsavel || '') + '</td><td class="c">' + (x.itens == null ? '' : esc(x.itens)) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="vazio">Nenhuma contagem nos últimos dois meses.</p>') +
        (pode('contagem.historico') ? '<div class="acoes"><a class="btn sec" href="' + legado('contagem-historico.html') + '">' + ic('chart', 18) + 'Histórico completo</a></div>' : '');
    });
  };

  // --- Caixa de entrada --------------------------------------------------------
  // A lista é a do sino do site (GET /api/notificacoes): a rota decide o que
  // cada nível recebe. Aqui só se marca o que foi lido e se abre a página certa.
  var TIPO_AV = {
    aviso: { rot: 'Aviso', ic: 'sino' },
    demanda: { rot: 'Demanda nova', ic: 'inbox' },
    resposta: { rot: 'Resposta', ic: 'check-circle' },
  };
  function linkAviso(x) {
    if (x.tipo === 'aviso') return legado('avisos.html');
    if (x.tipo === 'resposta') return legado('minhas-demandas.html');
    // A central de demandas só está publicada para a administração.
    if (x.tipo === 'demanda' && CTX.nivel_real === 'admin') return 'admin-demandas.html';
    return '';
  }
  function quandoTxt(q) {
    if (!q) return '';
    // Data pura ("2026-11-20") vira meia-noite UTC no new Date, que em Goiânia
    // é o dia anterior: monta no fuso local.
    var soDia = /^\d{4}-\d{2}-\d{2}$/.test(String(q));
    var p = String(q).slice(0, 10).split('-');
    var d = soDia ? new Date(+p[0], +p[1] - 1, +p[2]) : new Date(q);
    if (isNaN(d)) return dataBr(q);
    try { return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + (soDia ? '' : ' · ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })); }
    catch (e) { return dataBr(q); }
  }

  TELAS.caixa = function (c) {
    topo(c, 'Caixa de entrada', 'Avisos do bar e respostas para você');
    var b = bloco(c);
    dados.avisos().then(function (r) {
      if (!r.ok) { falhou(b, 'Caixa de entrada', r); return; }
      desenhaCaixa(c, b, r.d.itens || []);
    });
  };

  function desenhaCaixa(c, b, itens) {
    var v = lidos();
    var novos = naoLidos(itens);
    var sub = c.querySelector('.topo .sub');
    if (sub) sub.textContent = itens.length ? (novos.length ? novos.length + ' sem ler' : 'Tudo lido') : 'Avisos do bar e respostas para você';
    if (!itens.length) { b.innerHTML = '<p class="vazio">Nada por aqui ainda. Aviso da administração e resposta às suas demandas aparecem aqui.</p>'; return; }
    var h = novos.length ? '<div class="acoes" style="margin:0 0 6px"><button type="button" class="btn sec" id="cx-todas">' + ic('check-circle', 18) + 'Marcar todas como lidas</button></div>' : '';
    h += itens.map(function (x, i) {
      var t = TIPO_AV[x.tipo] || { rot: x.tipo, ic: 'sino' };
      var novo = !v[idAv(x)];
      var href = linkAviso(x);
      var tag = href ? 'a' : 'button';
      return '<' + tag + ' class="av' + (novo ? ' novo' : '') + '" data-i="' + i + '"' + (href ? ' href="' + esc(href) + '"' : ' type="button"') + '>' +
        '<span class="ponto" aria-hidden="true"></span><span class="ico">' + ic(t.ic, 18) + '</span><span class="t"><b>' + esc(x.titulo) + '</b>' +
        (x.descricao ? '<p>' + esc(x.descricao) + '</p>' : '') + '<small>' + esc(t.rot) + (x.quando ? ' · ' + esc(quandoTxt(x.quando)) : '') +
        (novo ? ' · <span class="pill atencao">sem ler</span>' : '') + '</small></span></' + tag + '>';
    }).join('');
    b.innerHTML = h;
    var todas = $('cx-todas');
    if (todas) todas.addEventListener('click', function () { marcaLidos(itens); desenhaCaixa(c, b, itens); toast('Tudo marcado como lido.'); });
    Array.prototype.forEach.call(b.querySelectorAll('.av'), function (el) {
      el.addEventListener('click', function () {
        var x = itens[Number(el.getAttribute('data-i'))];
        marcaLidos([x]);
        // Sem página para abrir (demanda para o maître): só marca e redesenha.
        if (el.tagName === 'BUTTON') desenhaCaixa(c, b, itens);
      });
    });
  }

  // --- Fichas técnicas -----------------------------------------------------------
  var BRL = null;
  try { BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }); } catch (e) {}
  function dinheiro(v, casas) {
    if (v == null || isNaN(v)) return '—';
    if (casas != null) { try { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: casas, maximumFractionDigits: casas }).format(v); } catch (e) {} }
    return BRL ? BRL.format(v) : String(v);
  }
  function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function qtdTxt(v) { return v == null ? '—' : String(Math.round(v * 100) / 100).replace('.', ','); }
  var fichaSec = 'todas', fichaBusca = '';

  TELAS.fichas = function (c) {
    var lista = FICHAS.fichas || [];
    topo(c, 'Fichas técnicas', lista.length + ' fichas · receita, copo e preparo');
    var bF = bloco(c);
    bF.innerHTML = '<label class="busca">' + ic('lupa', 18) + '<input type="search" id="fc-busca" placeholder="Buscar drink ou ingrediente" autocomplete="off" aria-label="Buscar ficha"></label>' +
      '<div class="chips" role="group" aria-label="Seção">' + [['todas', 'Todas']].concat(FICHAS.secoes || []).map(function (s) {
        return '<button type="button" data-sec="' + esc(s[0]) + '" class="' + (s[0] === fichaSec ? 'on' : '') + '" aria-pressed="' + (s[0] === fichaSec) + '">' + esc(s[1]) + '</button>';
      }).join('') + '</div>';
    var bL = bloco(c);
    var precif = pode('fichas.precificacao') ? {} : null;
    function desenha() { desenhaFichas(bL, lista, precif); }
    var inp = $('fc-busca');
    inp.value = fichaBusca;
    inp.addEventListener('input', function () { fichaBusca = inp.value; desenha(); });
    Array.prototype.forEach.call(bF.querySelectorAll('[data-sec]'), function (x) {
      x.addEventListener('click', function () {
        fichaSec = x.getAttribute('data-sec');
        Array.prototype.forEach.call(bF.querySelectorAll('[data-sec]'), function (y) {
          var on = y === x; y.classList.toggle('on', on); y.setAttribute('aria-pressed', on);
        });
        desenha();
      });
    });
    desenha();
    if (precif) {
      dados.custos().then(function (r) {
        if (!r.ok) return; // sem precificação: a ficha continua igual
        (r.d.fichas || []).forEach(function (f) { precif[semAcento(f.nome).replace(/[^a-z0-9]+/g, ' ').trim()] = f; });
        desenha();
      });
    }
  };

  function desenhaFichas(bL, lista, precif) {
    var q = semAcento(fichaBusca).trim();
    var abertos = {};
    Array.prototype.forEach.call(bL.querySelectorAll('.fc[open]'), function (d) { abertos[d.getAttribute('data-k')] = 1; });
    var nomeSec = {};
    (FICHAS.secoes || []).forEach(function (s) { nomeSec[s[0]] = s[1]; });
    var vis = lista.filter(function (f) {
      if (fichaSec !== 'todas' && f.s !== fichaSec) return false;
      if (!q) return true;
      return semAcento(f.n + ' ' + f.i.map(function (x) { return x[1]; }).join(' ')).indexOf(q) >= 0;
    });
    if (!vis.length) { bL.innerHTML = '<p class="vazio">Nenhuma ficha com "' + esc(fichaBusca) + '".</p>'; return; }
    var h = '', ult = '';
    vis.forEach(function (f) {
      if (fichaSec === 'todas' && f.s !== ult) { ult = f.s; h += '<h2' + (h ? ' style="margin-top:16px"' : '') + '>' + esc(nomeSec[f.s] || f.s) + '</h2>'; }
      var resumo = f.sf ? 'Receita ainda não registrada' : f.i.slice(0, 4).map(function (x) { return x[1]; }).join(' · ') + (f.i.length > 4 ? ' …' : '');
      var foto = f.f ? '<img class="foto" src="fotos/' + esc(f.f) + '" alt="" loading="lazy" decoding="async" width="52" height="52">'
        : '<span class="foto">' + ic('cocktail', 22) + '</span>';
      var corpo = '';
      if (f.sf) corpo += '<p class="aviso-f">' + (f.sf === 'producao' ? 'Receita ainda não registrada: confirme as proporções com a coordenação.'
        : 'Sem ficha cadastrada no Notion ainda: confirme o preparo com a coordenação.') + '</p>';
      if (f.sm) corpo += '<p class="aviso-f">Proporções ainda não registradas no Notion: confirme as medidas com a coordenação.</p>';
      corpo += f.i.map(function (x) { return '<div class="ing"><span class="d">' + esc(x[0]) + '</span><span>' + esc(x[1]) + '</span></div>'; }).join('');
      if (f.m.length) corpo += '<div class="metas">' + f.m.map(function (m) { return '<p>' + esc(m) + '</p>'; }).join('') + '</div>';
      if (f.p.length) corpo += '<div class="prep"><h4>Modo de preparo</h4><ol>' + f.p.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></div>';
      if (precif && precif[f.k]) corpo += tabelaPrecif(precif[f.k]);
      h += '<details class="fc" data-k="' + esc(f.k) + '"' + (abertos[f.k] ? ' open' : '') + '><summary>' + foto + '<span class="t"><b>' + esc(f.n) + '</b><small>' + esc(resumo) + '</small></span>' +
        (f.v != null ? '<span class="pill">' + esc(dinheiro(f.v, f.v % 1 ? 2 : 0)) + '</span>' : '') + '</summary><div class="corpo">' + corpo + '</div></details>';
    });
    bL.innerHTML = h;
  }

  // Mesma conta e mesmas regras da precificação de *cocktails.html (JS_PRECIF):
  // ingrediente sem custo = sem total, porque custo parcial engana o CMV.
  function tabelaPrecif(f) {
    var linhas = f.linhas.map(function (l) {
      var sub = [];
      if (l.garrafa != null && l.volume) sub.push(dinheiro(l.garrafa) + ' / ' + qtdTxt(l.volume) + ' ml');
      if (l.fonte === 'Média do mercado') sub.push('média do mercado');
      else if (l.fonte === 'Compra') sub.push('compra');
      return '<tr><td>' + esc(l.insumo) + (sub.length ? '<small>' + esc(sub.join(' · ')) + '</small>' : '') + '</td><td class="n">' + qtdTxt(l.qtd) + '</td>' +
        (l.custo == null ? '<td class="n sem" colspan="2">sem custo</td>'
          : '<td class="n">' + dinheiro(l.rs_ml, l.rs_ml < 1 ? 4 : 2) + '</td><td class="n">' + dinheiro(l.custo) + '</td>') + '</tr>';
    }).join('');
    var cmv = f.cmv != null ? String(f.cmv).replace('.', ',') + '%' : '';
    var notas = [];
    if (f.total == null) notas.push(f.faltam + (f.faltam === 1 ? ' ingrediente sem custo' : ' ingredientes sem custo') + ' no banco de insumos: sem total, porque custo parcial parece barato e engana o CMV.');
    if (f.total != null && f.cmv == null) notas.push('Sem preço de venda na ficha do Notion: sem CMV.');
    if (f.linhas.some(function (l) { return l.fonte === 'Média do mercado'; })) notas.push('Média do mercado é custo provisório, até Suprimentos lançar a nota de compra.');
    return '<details class="precif"><summary>Precificação ' + (f.total != null ? '<span class="tot">' + esc(dinheiro(f.total)) + (cmv ? ' · CMV ' + cmv : '') + '</span>'
      : '<span class="tot falta">custo incompleto</span>') + '</summary><div class="pc"><div class="tab-wrap"><table><thead><tr><th>Ingrediente</th><th class="n">ml</th><th class="n">por ml</th><th class="n">Custo</th></tr></thead><tbody>' +
      linhas + '</tbody>' + (f.total != null ? '<tfoot><tr><td colspan="3">Total' + (cmv ? ' · CMV ' + cmv : '') + '</td><td class="n">' + esc(dinheiro(f.total)) + '</td></tr></tfoot>' : '') +
      '</table></div>' + (notas.length ? '<p class="vazio" style="margin-top:8px">' + esc(notas.join(' ')) + '</p>' : '') + '</div></details>';
  }

  // --- Acessos: a tabela que substitui as cópias por nível --------------------
  TELAS.acessos = function (c) {
    topo(c, 'Acessos', 'Quem vê o quê no app novo');
    var t = CTX.tabela || [];
    var niveis = CTX.niveis || ['equipe', 'maitres', 'admin'];
    var nomeTela = {};
    (CTX.nav || []).forEach(function (n) { nomeTela[n.id] = n.rotulo; });
    var h = '<div class="blk"><h2>Permissões por nível</h2><div class="tab-wrap"><table><thead><tr><th>Tela ou bloco</th>' +
      niveis.map(function (n) { return '<th class="c">' + esc(NOME[n] || n) + '</th>'; }).join('') + '</tr></thead><tbody>';
    var ultima = '';
    t.forEach(function (l) {
      if (l.tela !== ultima) { ultima = l.tela; h += '<tr class="sec"><td colspan="' + (niveis.length + 1) + '">' + esc(nomeTela[l.tela] || l.tela) + '</td></tr>'; }
      h += '<tr><td>' + esc(l.rotulo) + '<small>' + esc(l.chave) + '</small></td>' + niveis.map(function (n) {
        var sim = l.niveis.indexOf(n) >= 0;
        return '<td class="c"><span class="pill ' + (sim ? 'ok' : '') + '">' + (sim ? 'sim' : 'não') + '</span></td>';
      }).join('') + '</tr>';
    });
    h += '</tbody></table></div></div>';
    h += '<div class="nota"><b>Uma linha por regra.</b> Menu, tela e Worker leem esta mesma tabela (PODE_APP). ' +
      'Hoje o Bento tem uma cópia de cada página por nível; aqui é uma tela só, e o nível decide o bloco. ' +
      'Cada dado continua conferido pela própria rota: a tabela escolhe o que pedir, nunca abre o que a rota fecha. ' +
      'Mudar uma regra é trocar uma linha no Worker; editar pela tela fica para a próxima fase.</div>';
    c.insertAdjacentHTML('beforeend', h);
  };

  abre();
})();
</script>
</body>
</html>
