.tab-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}

}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.menos{color:var(--coral-tx)}
.mais{color:var(--verde-tx)}

.cont{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-size:11.5px;font-weight:700;line-height:1}

/* Chave Chat | Funções e o chat (PLANO_CHAT_APP_BENTO.md, 24/11/2026) */
.faixa .modo{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;gap:2px}
.faixa .modo button{padding:8px 16px;border-radius:999px;font-size:14px;color:var(--faixa-tx);opacity:.75}
.faixa .modo button.on{background:var(--faixa-tx);color:var(--faixa);opacity:1;font-weight:600}
.faixa .piloto{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--faixa-linha);border-radius:999px;opacity:.85}
body.modo-chat .lado,body.modo-chat .barra-nav{display:none!important}
body.modo-chat main{padding:0 0 24px}
body.modo-chat #conteudo{max-width:720px;margin:0 auto;gap:0}
.ch{display:flex;flex-direction:column;min-height:calc(100vh - 42px);background:var(--bg)}
.ch-abas{display:flex;justify-content:center;padding:10px 16px;background:var(--sup);border-bottom:1px solid var(--linha)}
.ch-abas .seg{width:100%;max-width:360px}
.ch-abas .seg button{flex:1}
.ch-topo{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linha);background:var(--sup);position:sticky;top:0;z-index:3}
.ch-topo .volta{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:22px;line-height:1}
.ch-av{width:38px;height:38px;border-radius:50%;background:var(--acento-bg);color:var(--acento-tx);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.ch-topo .t{flex:1;min-width:0;text-align:left}
.ch-topo .t b{display:block;font-size:16px}
.ch-topo .t small{display:block;color:var(--tx3);font-size:12.5px}
.ch-topo button.t b::after{content:"";display:inline-block;width:6px;height:6px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);margin:0 0 3px 8px}
.ch-sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px 10px 9px;background:var(--sup);border-bottom:1px solid var(--linha)}
.ch-sem button{border-radius:10px;padding:4px 0 6px;text-align:center}
.ch-sem .ds{font-size:10.5px;color:var(--tx3);text-transform:uppercase}
.ch-sem .n{font-size:15px;font-weight:600;margin:1px 0 3px}
.ch-sem button.on{background:var(--acento-bg);outline:1px solid var(--acento)}
.ch-sem button.on .n{color:var(--acento-tx)}
.ch-sem button[disabled]{cursor:default}
.ch-sem button[disabled] .n{color:var(--tx3);opacity:.6}
.pt{display:block;width:7px;height:7px;border-radius:50%;margin:0 auto}
.pt.v{background:var(--verde)}.pt.a,.pt.hoje{background:var(--acento)}.pt.c{background:var(--coral)}
.pt.f{border:1.5px solid var(--tx3)}.pt.n{background:var(--tx3);opacity:.35}
.ch-msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:12px 12px 8px}
.ch-pino{padding:8px 11px;border-radius:10px;background:var(--acento-bg);border:1px dashed var(--acento);font-size:13.5px;color:var(--acento-tx)}
.bb{max-width:86%;padding:8px 11px 5px;border-radius:12px;font-size:15px;line-height:1.42;overflow-wrap:anywhere}
.bb.site{align-self:flex-start;background:var(--sup);border:1px solid var(--linha);border-top-left-radius:4px}
.bb.eu{align-self:flex-end;background:var(--acento-bg);border-top-right-radius:4px}
.bb.humano{align-self:flex-start;background:var(--sup);border:1px solid var(--linha);border-left:4px solid var(--verde);border-top-left-radius:4px}
.bb .quem{font-size:12.5px;font-weight:600;color:var(--verde-tx);margin-bottom:2px}
.bb .h{display:block;text-align:right;font-size:11px;color:var(--tx3);margin-top:2px}
.bb ul{margin:4px 0;padding-left:18px}
.bb a.ir,.bb button.ir{display:block;width:100%;text-align:left;margin-top:6px;padding:8px 11px;border-radius:9px;background:var(--acento-bg);color:var(--acento-tx);text-decoration:none;font-size:14px;font-weight:600}
.bb .ficha{margin-top:4px;border:1px solid var(--linha);border-radius:9px;padding:8px 10px;background:var(--bg)}
.bb .ficha b{font-family:var(--serif);font-weight:500;font-size:17px;display:block;margin-bottom:4px}
.bb .ficha .ing{font-size:14px;padding:4px 0}
.bb .ficha .metas{font-size:13px;margin-top:6px}
.selo{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:5px}
.ch-bot{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:92%}
.ch-bot button{border:1px solid var(--acento);color:var(--acento-tx);border-radius:999px;padding:8px 14px;font-size:14px}
.ch-bot button.esc{background:var(--acento-bg);font-weight:600}
.ch-bot button[disabled]:not(.esc){opacity:.35;cursor:default}
.ch-fim{align-self:center;text-align:center;font-size:12.5px;color:var(--tx3);margin:8px 0 2px;max-width:320px}
.ch-in{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--sup);border-top:1px solid var(--linha)}
.ch-in textarea{flex:1;resize:none;min-height:42px;max-height:120px;padding:10px 14px;border-radius:21px;border:1px solid var(--linha);background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
.ch-in button{width:42px;height:42px;border-radius:50%;background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
:root[data-tema="escuro"] .ch-in button{color:#2b2620}
.ch-in.coord textarea{border-color:var(--verde)}
.ch-in.coord button{background:var(--verde)}
.ch-bl{margin-top:6px;padding-top:6px;border-top:1px solid var(--linha);font-size:14px}
.ch-bl b{font-size:13px}
.ch-bl summary{padding:8px 0;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--acento-tx)}
.ch-bl li small{display:block;color:var(--tx3);font-size:12.5px}
.ch-bl .mini{font-size:12.5px;color:var(--tx2);margin:2px 0 0}
.ch-dsep{align-self:center;margin:6px 0 2px}
.ch-dsep span{display:inline-block;font-size:11.5px;color:var(--tx2);background:var(--sup2);border-radius:8px;padding:3px 10px}
.ch-mais{align-self:center;font-size:13px;color:var(--acento-tx);padding:6px 12px;border-radius:999px;border:1px solid var(--linha)}
.ch-alt{display:flex;gap:6px;padding:8px 12px;background:var(--sup);border-bottom:1px solid var(--linha)}
.ch-alt button{flex:1;padding:7px 0;border-radius:9px;font-size:13.5px;border:1px solid var(--linha)}
.ch-alt button.on{background:var(--acento-bg);border-color:var(--acento);color:var(--acento-tx);font-weight:600}
.ch-opc{position:sticky;bottom:58px;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 0;background:var(--sup);border-top:1px solid var(--linha)}
.ch-opc button{border:1px solid var(--linha);border-radius:999px;padding:7px 12px;font-size:13px}
.ch-opc button.on{background:var(--acento-bg);border-color:var(--acento);color:var(--acento-tx);font-weight:600}
.ch-opc button.u.on{background:var(--sup2);border-color:var(--tx2);color:var(--tx)}
.ch-opc .sep{flex-basis:100%;height:0}
.ch-opc + .ch-in{border-top:0}
.selo:not(.ok):not(.atencao){background:var(--sup2);color:var(--tx2)}
.bb .tag{font-size:11.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.02em}
.bb.alvo{outline:2px solid var(--verde)}
/* Os dois botões do chat do dia: "?" pergunta, "!" avisa ou pede */
.ch-cancela{position:sticky;bottom:0;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--sup);border-top:1px solid var(--linha)}
.ch-dois{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--sup);border-top:1px solid var(--linha)}
.ch-dois button{display:flex;align-items:center;gap:9px;min-width:0;padding:9px 11px;border-radius:14px;border:1px solid var(--linha);background:var(--bg);text-align:left}
.ch-dois .ic{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:19px}
.ch-dois .p .ic{background:var(--sup2);color:var(--tx)}
.ch-dois .a .ic{background:var(--acento);color:#fff}
.ch-dois b{display:block;font-size:14.5px;font-weight:600}
.ch-dois small{display:block;font-size:11.5px;color:var(--tx3);line-height:1.25}
.ch-in .modo{width:auto;height:auto;border-radius:999px;background:none;font-size:22px;color:var(--tx3);padding:0 2px;align-self:center}
.ch-in .mtag{align-self:center;flex-shrink:0;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sup2);color:var(--tx)}
.ch-in .mtag.a{background:var(--acento-bg);color:var(--acento-tx)}
.bb .mt{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-bottom:3px;background:var(--sup2);color:var(--tx2)}
.bb .mt.a{background:var(--acento);color:#fff}
.bb .rec{margin-top:5px;border:1px solid var(--linha);border-radius:9px;padding:6px 9px;background:var(--bg);font-size:13.5px}
.bb .rec div{display:flex;justify-content:space-between;gap:8px}
.bb .rec span{color:var(--tx3)}
.bb ol{margin:4px 0;padding-left:20px}
.bb .pensa{color:var(--tx3);font-style:italic}
.bb .vid b{display:block;font-family:var(--serif);font-weight:500;font-size:16px}
.bb .vid small{display:block;color:var(--tx3);font-size:13px;margin:2px 0 6px}
.bb .vid video{display:block;width:100%;max-width:420px;max-height:62vh;border-radius:9px;background:#000}
.bb:has(.vid){max-width:94%}
.ch-folga{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--tx2);padding:40px 24px}
.ch-folga b{display:block;font-family:var(--serif);font-weight:500;font-size:24px;color:var(--tx);margin-bottom:6px}
.ch-mes{padding:12px 14px}
.ch-mes .tt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch-mes .tt b{font-family:var(--serif);font-weight:500;font-size:19px}
.ch-mes .tt button{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--tx2)}
.ch-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.ch-grade .cab{font-size:10.5px;color:var(--tx3);text-align:center;text-transform:uppercase}
.ch-grade button,.ch-grade span.cel{aspect-ratio:1/1.05;border-radius:10px;background:var(--sup);border:1px solid var(--linha);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px}
.ch-grade span.vz{background:none;border:0}
.ch-grade .hj{outline:2px solid var(--acento);color:var(--acento-tx);font-weight:700}
.ch-grade span.fut{color:var(--tx3);background:var(--sup2)}
.ch-leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--tx2)}
.ch-leg span{display:inline-flex;align-items:center;gap:5px}
.ch-leg .pt{margin:0}
.ch-mat{width:100%;border-collapse:collapse;font-size:13px}
.ch-mat th{font-size:10.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;text-align:center;padding:6px 2px;border-bottom:1px solid var(--linha)}
.ch-mat th:first-child,.ch-mat td:first-child{text-align:left;padding-left:14px}
.ch-mat td{text-align:center;padding:0;border-bottom:1px solid var(--linha)}
.ch-mat td:first-child{font-weight:600;white-space:nowrap;padding-top:9px;padding-bottom:9px}
.ch-mat td button{width:100%;padding:12px 0}
.ch-mat .hj{background:var(--acento-bg)}
.ch-sec{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);padding:16px 14px 6px}
/* Lista de conversas: grupos em cartões, ícone por tipo, número em pílula. */
.ch-lista{padding:2px 0 28px}
.ch-lista .ch-sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:20px 18px 8px}
.ch-lista .ch-sec small{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
.ch-grupo{margin:0 12px;background:var(--sup);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.ch-grupo .ch-conv:last-child{border-bottom:0}
.ch-grupo .ch-conv{padding:12px 14px}
.ch-av.ico{background:var(--sup2);color:var(--tx2)}
.ch-av.ico.forte{background:var(--acento);color:var(--sup)}
.ch-av.ico.verde{background:var(--verde-bg);color:var(--verde-tx)}
.ch-conv .l2{display:flex;align-items:center;gap:8px;margin-top:1px}
.ch-conv .l2 .ult{flex:1;min-width:0}
.ch-pill{flex-shrink:0;font-size:11.5px;font-weight:600;line-height:1;padding:4px 8px;border-radius:999px;background:var(--acento-bg);color:var(--acento-tx)}
.ch-pill.sr{background:var(--coral-bg);color:var(--coral-tx)}
.ch-nota{padding:2px 18px 8px;color:var(--tx3);font-size:13px}
.ch-livres{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.ch-livres-t{display:block;width:100%;font-size:12.5px;color:var(--tx3)}
.ch-livres button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border:1px solid var(--linha);border-radius:999px;background:var(--bg);color:var(--tx2);font-size:13.5px}
.ch-conv{display:flex;gap:11px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--linha);width:100%;text-align:left}
.ch-conv .t{flex:1;min-width:0}
.ch-conv .l1{display:flex;justify-content:space-between;gap:8px}
.ch-conv .l1 b{font-size:15px}
.ch-conv .l1 small{font-size:11.5px;color:var(--tx3);flex-shrink:0}
.ch-conv .ult{display:block;color:var(--tx2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:899px){body:not(.modo-chat) .ch{min-height:0}body:not(.modo-chat) .ch-in{bottom:calc(64px + env(safe-area-inset-bottom))}}

    pendentes: function (f) { return busca('pendentes', function () { return api('/api/acessos/pendentes'); }, f); },
    // 26 semanas é o teto da rota: cobre a contagem anterior mesmo quando o
    // bar fica meses sem contar (aconteceu entre 07/09 e 09/11).
    historico: function (f) { return busca('historico', function () { return api('/api/contagem/historico', { metodo: 'POST', corpo: { semanas: 26 } }); }, f); },
    quebras: function (f) { return busca('quebras', function () { return api('/api/quebras/historico', { metodo: 'POST', corpo: { meses: 6 } }); }, f); },

    escala: function (desde, ate, f) { return busca('escala', function () { return api('/api/escala?oficial=1&desde=' + desde + '&ate=' + ate); }, f); },

  // --- Lido / não lido: a MESMA marca do sino do site (portal_gen, bloco do
  // sino), na mesma chave do aparelho. Ler aqui apaga o ponto lá, e vice-versa.
  function vKey() { return 'bento_sino_visto_' + (S.pessoa || S.nivel || 'x'); }
  function lidos() { try { return JSON.parse(ls(vKey()) || '{}') || {}; } catch (e) { return {}; } }
  function idAv(x) { return 'r:' + (x.chave || (x.tipo + ':' + (x.quando || ''))); }
  function marcaLidos(lista) {
    var v = lidos();

  function naoLidos(itens) { var v = lidos(); return itens.filter(function (x) { return !v[idAv(x)]; }); }
  function poeConta(n) {

  var CTX = null;

  function estado(titulo, texto, rotulo, href) {

  function abre() {
    var como = S.nivel === 'admin' ? (ls(LS.como) || '') : '';
    api('/api/app' + (como ? '?como=' + encodeURIComponent(como) : '')).then(function (r) {
      if (r.status === 401) {
        estado('Sua sessão venceu', 'Entre de novo com a sua senha. Depois disso você volta direto para cá.',
          'Entrar', 'index.html?trocar=1&volta=app#acesso');

      }
      if (r.status === 403 && r.d.erro_codigo === 'fora_do_piloto') {
        estado('O app novo ainda não é para o seu acesso',
          'Por enquanto o piloto é só para Equipe de Bar, Maîtres e Administração. O site de sempre continua igual.',
          'Voltar ao site', 'index.html');

          : 'O servidor não respondeu como devia. Tente de novo em instantes.', 'Tentar de novo', 'app.html');

  function montaMoldura() {
    // Chave do topo, em toda tela: Chat (conversa do dia, com calendário) ou
    // Funções (as telas do rodapé). Fica lembrada neste aparelho.
    var f = '<div class="fx1"><span class="modo" role="group" aria-label="Modo do app">' +

      }).join('') + '</span><span class="fx-dir"><span class="piloto" title="App novo, em teste">Piloto</span>' +
      '<a class="site" href="' + HOME[CTX.nivel_real] + '">Site atual</a></span></div>';

    Array.prototype.forEach.call(document.querySelectorAll('[data-como]'), function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-como');
        lsPoe(LS.como, v === 'admin' ? null : v);
        // Outro nível começa da lista de conversas: a conversa aberta antes
        // (o chat de outra pessoa, a fila de todos) não existe na prévia.
        CH_CAMPOS.forEach(function (k) { CH[k] = null; });
        CH.vista = 'dia';
        $('conteudo').innerHTML = '<div class="esq"></div><div class="esq"></div>';
        abre();
      });
    });
    var quem = CTX.pessoa ? esc(CTX.pessoa) + ' · ' + NOME[CTX.nivel_real] : NOME[CTX.nivel_real];
    $('lado').innerHTML = '<div class="marca">Bento</div><div class="quem">' + quem + '</div>' +
      CTX.nav.map(function (n) {
        return '<button type="button" data-tela="' + n.id + '">' + ic(n.icone) + '<span>' + esc(n.rotulo) + '</span>' +
          (n.id === 'caixa' ? '<span class="cont" data-cont hidden></span>' : '') + '</button>';
      }).join('');
    // No celular a Caixa de entrada é o sino do topo de cada tela, não um
    // botão a mais na barra (com sete, nenhum rótulo caberia).
    var bn = $('barra-nav');
    bn.innerHTML = CTX.nav.filter(function (n) { return n.id !== 'caixa'; }).map(function (n) {
      return '<button type="button" data-tela="' + n.id + '">' + ic(n.icone, 22) + '<span>' + esc(n.curto || n.rotulo) + '</span></button>';
    }).join('');
    bn.hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll('[data-tela]'), function (b) {
      b.addEventListener('click', function () { location.hash = '#/' + b.getAttribute('data-tela'); });
    });
  }

  // Copos e Contagem viraram partes do Inventário (24/11/2026). Link antigo
  // (#/copos, #/contagem, inclusive em bom dia já gravado) cai na parte certa.
  var ALIAS_TELA = { copos: 'inventario', contagem: 'inventario' };
  function telaAtual() {
    var id = (location.hash.match(/^#\/([a-z]+)/) || [])[1] || 'chat';
    if (ALIAS_TELA[id] && CTX.nav.some(function (n) { return n.id === ALIAS_TELA[id]; })) id = ALIAS_TELA[id];
    if (CTX.nav.some(function (n) { return n.id === id; })) return id;
    return CTX.nav.length ? CTX.nav[0].id : 'chat';
  }

  var TELAS = {};
  function modo() { return pode('chat.ver') && ls(LS.modo) !== 'funcoes' ? 'chat' : 'funcoes'; }
  function poeModo(m) {
    lsPoe(LS.modo, m);
    irChat(m === 'chat' ? { dia: null, pessoa: null, sala: null, vista: 'dia' } : {});
  }
  // --- Botão voltar do celular ------------------------------------------------
  // Cada tela do chat (grupo, setor, conversa, mês) e a troca Chat | Funções
  // entram no histórico do navegador: o voltar do Android volta para a tela
  // anterior, como no WhatsApp, em vez de sair do app.
  var navN = 0, popEm = 0;
  var CH_CAMPOS = ['dia', 'pessoa', 'vista', 'mes', 'sala', 'fila', 'alvo', 'pergunta'];
  function estadoApp() {
    var ch = {};
    CH_CAMPOS.forEach(function (k) { ch[k] = CH[k] == null ? null : CH[k]; });
    return { app: 1, n: navN, modo: modo(), ch: ch };
  }
  function irChat(m) {
    Object.keys(m).forEach(function (k) { CH[k] = m[k]; });
    navN++;
    try { history.pushState(estadoApp(), ''); } catch (e) {}
    vai();
  }
  window.addEventListener('popstate', function (e) {
    var s = e.state;
    if (!s || !s.app || !CTX) return;
    popEm = Date.now();
    navN = s.n || 0;
    lsPoe(LS.modo, s.modo);
    CH_CAMPOS.forEach(function (k) { CH[k] = s.ch ? s.ch[k] : null; });
    if (!CH.vista) CH.vista = 'dia';
    vai();
  });
  function vai() {
    if (!CTX) return;
    var m = modo();
    document.body.classList.toggle('modo-chat', m === 'chat');
    Array.prototype.forEach.call(document.querySelectorAll('[data-modo]'), function (b) {
      var on = b.getAttribute('data-modo') === m;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    if (m === 'chat') {
      var cc = $('conteudo');
      cc.innerHTML = '';
      telaChat(cc, true);
      contaNaoLidos();
      return;
    }
    var id = telaAtual();
    Array.prototype.forEach.call(document.querySelectorAll('[data-tela]'), function (b) {
      var on = b.getAttribute('data-tela') === id;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    var c = $('conteudo');
    c.innerHTML = '';
    if (CTX.como) {
      c.insertAdjacentHTML('beforeend', '<div class="nota"><b>Vendo como ' + esc(NOME[CTX.nivel]) +
        '.</b> Os blocos são os deste nível e os dados são os reais. Marcar item fica desligado nesta prévia.</div>');
    }
    (TELAS[id] || TELAS.chat)(c);
    contaNaoLidos();
    window.scrollTo(0, 0);
  }
  // Link para uma tela (#/turno, #/contagem...) sai do modo chat: é o "abrir"
  // dos botões do bom dia e do sino.
  window.addEventListener('hashchange', function () {
    // O voltar que mudou o endereço já foi tratado no popstate.
    if (Date.now() - popEm < 500) return;
    if (CTX && modo() === 'chat' && /^#\/[a-z]/.test(location.hash)) lsPoe(LS.modo, 'funcoes');
    vai();
  });

  function topo(c, titulo, sub) {
    var sino = pode('caixa.ver') && telaAtual() !== 'caixa'
      ? '<a class="sino-m" href="#/caixa" aria-label="Caixa de entrada">' + ic('sino', 22) +
        '<span class="cont" data-cont hidden></span></a>' : '';
    c.insertAdjacentHTML('beforeend', '<div class="topo"><div><h1>' + esc(titulo) + '</h1>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div><div class="topo-ac">' + BOTAO_COMP + sino + '</div></div>');
  }
  // --- Compartilhar o app (24/11/2026) ----------------------------------------
  // O link leva só o endereço do app e a tela (#/fichas, #/inventario/copos);
  // a query (?como=, prévia) nunca vai junto. Quem recebe entra com a própria
  // senha do portal.
  var BOTAO_COMP = '<button type="button" class="comp-m" data-comp-abre aria-label="Compartilhar o app" title="Compartilhar o app">' + ic('compartilhar', 20) + '</button>';
  function linkDoApp() {
    var h = /^#\/[a-z]+(\/[a-z]+)?$/.test(location.hash) ? location.hash : '';
    return location.origin + location.pathname + h;
  }
  function fechaComp() { var d = document.getElementById('comp-dlg'); if (d) { if (d.close) d.close(); else d.removeAttribute('open'); } }
  function abreComp() {
    var d = document.getElementById('comp-dlg');
    if (!d) {
      d = document.createElement('dialog');
      d.id = 'comp-dlg'; d.className = 'comp-dlg';
      d.setAttribute('aria-labelledby', 'comp-tit');
      d.innerHTML = '<div class="comp-cab"><h3 id="comp-tit">Compartilhar o app</h3>' +
        '<button type="button" class="comp-x" data-comp="fechar" aria-label="Fechar">&times;</button></div>' +
        '<p class="comp-txt">O link abre o app nesta tela. Quem receber entra com a própria senha do portal.</p>' +
        '<input id="comp-link" readonly aria-label="Link do app">' +
        '<div class="comp-acoes"><button type="button" data-comp="copiar">Copiar link</button>' +
        '<button type="button" class="pri" data-comp="enviar" hidden>Compartilhar</button></div>';
      document.body.appendChild(d);
      d.addEventListener('click', function (ev) {
        if (ev.target === d) { fechaComp(); return; }
        var b = ev.target.closest && ev.target.closest('[data-comp]');
        if (!b) return;
        var a = b.getAttribute('data-comp'), campo = d.querySelector('#comp-link');
        if (a === 'fechar') fechaComp();
        else if (a === 'enviar') {
          navigator.share({ title: 'Bento · App', url: campo.value }).then(fechaComp, function () {});
        } else {
          var feito = function () { fechaComp(); toast('Link copiado'); };
          var reserva = function () {
            campo.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            if (ok) feito(); else toast('Selecione e copie o link');
          };
          if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(campo.value).then(feito, reserva);
          else reserva();
        }
      });
    }
    d.querySelector('#comp-link').value = linkDoApp();
    d.querySelector('[data-comp="enviar"]').hidden = !navigator.share;
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-comp-abre]')) abreComp();
  });
  // Cada bloco nasce como esqueleto na ordem certa e se preenche sozinho: um
  // pedido lento não empurra os outros nem muda a ordem da tela.
  function bloco(c, cls) {
    var b = document.createElement('div');
    b.className = 'blk' + (cls ? ' ' + cls : '');
    b.innerHTML = '<div class="esq" style="height:52px"></div>';
    c.appendChild(b);
    return b;
  }
  function falhou(b, titulo, r) {
    var msg = r && r.status === 0 ? 'Sem conexão agora.' : (r && r.d && r.d.erro) ? r.d.erro : 'Não consegui carregar.';
    b.innerHTML = '<h2>' + esc(titulo) + '</h2><p class="vazio">' + esc(msg) + '</p>' +
      '<div class="acoes"><button type="button" class="btn sec" data-de-novo>Tentar de novo</button></div>';
    b.querySelector('[data-de-novo]').addEventListener('click', function () { vai(); });
  }

  // --- Rotina do dia: as contas são as do mural (bartender-painel.js) ------
  function turnoAgora() { return BP.turnoDoMomento(new Date()); }
  // Almoço inteiro registrado: o que vem agora é a abertura do jantar, mesmo
  // antes das 15h. Uma tela que segue mostrando um turno fechado ensina a
  // ignorar o card.
  function turnoPadrao(d) {
    var t = turnoAgora();
    if (t === 'Dia' && BP.faseDoMomento(d.turnos_enviados, 'Dia').concluido) return 'Noite';
    return t;
  }
  function donosPorItem(d, turno) {
    var out = {};
    var div = (d.hoje && d.hoje.divisao && d.hoje.divisao[turno]) || {};
    Object.keys(div).forEach(function (p) {
      (div[p] || []).forEach(function (id) { (out[id] = out[id] || []).push(p); });
    });
    return out;
  }
  function meusIds(d, turno) {
    if (!CTX.pessoa) return null;
    var div = (d.hoje && d.hoje.divisao && d.hoje.divisao[turno]) || {};
    var meu = null;
    Object.keys(div).forEach(function (p) {
      if (p.toLowerCase() === CTX.pessoa.toLowerCase()) meu = div[p] || [];
    });
    return meu;
  }

  // Semana da contagem: a de início mais recente que já começou. Sem página
  // da semana não é "atrasada": a página nasce pelo robô de sexta.
  function situacaoSemana(lista, tipo) {
    var hoje = RC.hoje();
    var doTipo = lista.filter(function (x) { return x.tipo === tipo && x.inicio && x.inicio <= hoje; })
      .sort(function (a, b) { return a.inicio < b.inicio ? 1 : -1; });
    var s = doTipo[0];
    if (!s) return { rotulo: 'sem semana aberta', cls: '', detalhe: 'Nenhuma semana nos últimos dois meses', semana: null };
    var dias = Math.round((new Date(hoje) - new Date(s.inicio)) / 86400000);
    var atual = dias < 7;
    if (s.itens) {
      return { rotulo: atual ? 'feita' : 'última feita', cls: atual ? 'ok' : 'atencao', semana: s,
        detalhe: rotSemana(s.semana) + ' · ' + s.itens + ' itens' + (s.responsavel ? ' · ' + quemContou(s.responsavel) : '') +
          (s.data ? ' · ' + dataBr(s.data) : '') };
    }
    return { rotulo: atual ? 'falta contar' : 'atrasada', cls: atual ? 'atencao' : 'ruim', semana: s,
      detalhe: rotSemana(s.semana) + ' aberta em ' + dataBr(s.inicio) };
  }

  // --- Turno: o checklist do dia, marcável -----------------------------------
  var turnoSel = null, faseSel = null, soMeus = null;

  TELAS.turno = function (c) {
    topo(c, 'Turno', 'Rotina de hoje · ' + hojeExtenso());
    var b = bloco(c);
    var bl = bloco(c);
    dados.rotinas().then(function (r) {
      if (!r.ok) {
        if (r.status === 404) { b.innerHTML = '<h2>Rotina</h2><p class="vazio">A rotina de hoje ainda não foi publicada.</p>'; bl.remove(); return; }
        falhou(b, 'Rotina', r); bl.remove(); return;
      }
      var d = r.d;
      if (!turnoSel) turnoSel = turnoPadrao(d);
      if (!faseSel) faseSel = BP.faseDoMomento(d.turnos_enviados, turnoSel).fase;
      var meus = meusIds(d, turnoSel);
      if (soMeus === null) soMeus = CTX.nivel === 'equipe' && !!(meus && meus.length);
      desenhaTurno(b, bl, d);
    });
  };

  function desenhaTurno(b, bl, d) {
    var meus = meusIds(d, turnoSel);
    var blocos = RC.blocosDaFase(faseSel);
    var prog = BP.progressoDoTurno(d, blocos, turnoSel);
    var rotProg = 'itens do time marcados neste turno';
    if (soMeus && meus && meus.length) {
      // Com o filtro, a barra conta o que a pessoa VÊ: a régua do time numa
      // lista só com os itens dela faria "0 de 9" com três itens na tela.
      var feitosT = BP.feitosNoTurno(d, turnoSel), mi = 0, mf = 0;
      BP.idsDaFase(d, blocos).forEach(function (id) {
        if (meus.indexOf(id) < 0) return;
        mi++; if (feitosT[id]) mf++;
      });
      prog = { feitos: mf, total: mi, pct: mi ? Math.round(mf / mi * 100) : 0 };
      rotProg = 'dos seus itens marcados';
    }
    var h = '<div class="controles">' +
      '<div class="seg" role="group" aria-label="Turno">' + ['Dia', 'Noite'].map(function (t) {
        return '<button type="button" data-turno="' + t + '" class="' + (t === turnoSel ? 'on' : '') + '" aria-pressed="' + (t === turnoSel) + '">' + TURNO_ROT[t] + '</button>';
      }).join('') + '</div>' +
      '<div class="seg" role="group" aria-label="Fase">' + [['abertura', 'Abertura'], ['fechamento', 'Fechamento']].map(function (f) {
        return '<button type="button" data-fase="' + f[0] + '" class="' + (f[0] === faseSel ? 'on' : '') + '" aria-pressed="' + (f[0] === faseSel) + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      (meus && meus.length ? '<label class="chk"><input type="checkbox" id="so-meus"' + (soMeus ? ' checked' : '') + '> Só os meus</label>' : '') +
      '</div>' +
      '<div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="' + prog.total + '" aria-valuenow="' + prog.feitos +
      '"><i style="width:' + prog.pct + '%"></i></div><p class="vazio">' + prog.feitos + ' de ' + prog.total + ' ' + rotProg + '</p>';
    if (pode('turno.envios')) {
      var env = d.turnos_enviados || [];
      h += '<div class="envios" style="margin-top:10px">' + [['Dia', 'abertura'], ['Dia', 'fechamento'], ['Noite', 'abertura'], ['Noite', 'fechamento']].map(function (x) {
        var e = env.filter(function (y) { return BP._mesmoTurno(y.turno, x[0]) && y.fase === x[1]; })[0];
        return '<span class="pill ' + (e ? 'ok' : '') + '">' + TURNO_ROT[x[0]] + ' · ' + x[1] + (e ? ' · ' + esc(primeiroNome(e.pessoa)) : ' · não enviado') + '</span>';
      }).join('') + '</div>';
    }
    if (pode('turno.enviar')) {
      h += '<div class="acoes"><a class="btn sec" href="' + legado(faseSel === 'abertura' ? 'turno-abertura.html' : 'turno.html') +
        '">' + ic('camera', 18) + (faseSel === 'abertura' ? 'Enviar a abertura' : 'Enviar o fechamento') + ' com foto</a></div>';
    }
    b.innerHTML = h;
    Array.prototype.forEach.call(b.querySelectorAll('[data-turno]'), function (x) {
      x.addEventListener('click', function () {
        turnoSel = x.getAttribute('data-turno');
        faseSel = BP.faseDoMomento(d.turnos_enviados, turnoSel).fase;
        desenhaTurno(b, bl, d);
      });
    });
    Array.prototype.forEach.call(b.querySelectorAll('[data-fase]'), function (x) {
      x.addEventListener('click', function () { faseSel = x.getAttribute('data-fase'); desenhaTurno(b, bl, d); });
    });
    var sm = $('so-meus');
    if (sm) sm.addEventListener('change', function () { soMeus = sm.checked; desenhaTurno(b, bl, d); });
    desenhaLista(bl, d, blocos, meus);
  }

  function desenhaLista(bl, d, blocos, meus) {
    var feitos = BP.feitosNoTurno(d, turnoSel);
    var donos = pode('turno.divisao') ? donosPorItem(d, turnoSel) : {};
    var filtro = soMeus && meus ? meus : null;
    var meta = {};
    (d.blocos || []).forEach(function (x) { meta[x.chave] = x.rotulo; });
    var tarefasPorBloco = {};
    (d.tarefas || []).forEach(function (t) { (tarefasPorBloco[t.bloco || 'durante'] = tarefasPorBloco[t.bloco || 'durante'] || []).push(t); });
    var podeMarcar = pode('turno.marcar') && !CTX.como;
    var h = '';
    blocos.forEach(function (bk) {
      var ids = ((d.hoje && d.hoje.blocos && d.hoje.blocos[bk]) || []).filter(function (id) {
        return d.itens && d.itens[id] && (!filtro || filtro.indexOf(id) >= 0);
      });
      // Tarefa sem responsável é do time e aparece sempre; com responsável, o
      // filtro "Só os meus" esconde a dos outros.
      var tar = (tarefasPorBloco[bk] || []).filter(function (t) {
        return !filtro || !t.responsavel || t.responsavel.toLowerCase() === String(CTX.pessoa || '').toLowerCase();
      });
      if (!ids.length && !tar.length) return;
      h += '<div class="grupo"><h3>' + esc(meta[bk] || bk) + '</h3>';
      ids.forEach(function (id) {
        var it = d.itens[id];
        var tags = [];
        if (it.prio) tags.push('<span class="pill atencao">prioritário</span>');
        var fq = RC.freqLegivel(it.freq);
        if (fq) tags.push('<span>' + fq + '</span>');
        if (donos[id]) tags.push('<span>' + esc(donos[id].join(', ')) + '</span>');
        if (feitos[id] && feitos[id].pessoa) tags.push('<span>marcado por ' + esc(primeiroNome(feitos[id].pessoa)) + '</span>');
        h += item(id, it.t, !!feitos[id], tags, podeMarcar);
      });
      tar.forEach(function (t) {
        var tags = ['<span class="pill">tarefa</span>'];
        if (t.prio) tags.push('<span class="pill atencao">prioritário</span>');
        if (t.prazo) tags.push('<span>até ' + dataBr(t.prazo) + '</span>');
        if (t.responsavel) tags.push('<span>para ' + esc(t.responsavel) + '</span>');
        h += item(t.id, t.titulo, !!feitos[t.id], tags, podeMarcar);
      });
      h += '</div>';
    });
    bl.innerHTML = h || '<p class="vazio">' + (filtro ? 'Nada seu nesta fase. Desmarque "Só os meus" para ver o resto.' : 'Nada nesta fase hoje.') + '</p>';
    Array.prototype.forEach.call(bl.querySelectorAll('.ck'), function (x) {
      x.addEventListener('click', function () { marca(x, bl, d); });
    });
  }

  function item(id, titulo, feito, tags, podeMarcar) {
    return '<button type="button" class="ck' + (feito ? ' feito' : '') + '" data-id="' + esc(id) + '" data-feito="' + (feito ? 1 : 0) +
      '" aria-pressed="' + feito + '"' + (podeMarcar ? '' : ' aria-disabled="true"') + '><span class="box">' + ic('check-circle', 16) +
      '</span><span class="t"><span>' + esc(titulo) + '</span>' + (tags.length ? '<span class="tags">' + tags.join('') + '</span>' : '') + '</span></button>';
  }

  var pendente = null;
  function marca(x, bl, d) {
    if (CTX.como) { toast('Na prévia de outro nível, marcar fica desligado.'); return; }
    if (!pode('turno.marcar')) return;
    if (x.classList.contains('ocupado')) return;
    var senha = ls(LS.senha);
    if (!senha) { pedeSenha(x, bl, d, ''); return; }
    envia(x, bl, d, senha);
  }

  function envia(x, bl, d, senha) {
    var feito = x.getAttribute('data-feito') !== '1';
    x.classList.add('ocupado');
    api('/api/rotina/concluir', { metodo: 'POST', corpo: {
      senha_pessoa: senha, dia: RC.diaOperacional(), turno: turnoSel, item_id: x.getAttribute('data-id'), feito: feito,
    } }).then(function (r) {
      if (r.ok && r.d.ok) {
        lsPoe(LS.senha, senha);
        fechaSenha();
        toast(feito ? 'Marcado.' : 'Desmarcado.');
        // Recarrega do servidor: se alguém marcou no mesmo minuto, a tela
        // mostra a verdade dela também.
        dados.rotinas(true).then(function (n) {
          if (n.ok) { cache.rotinas = { em: Date.now(), p: Promise.resolve(n) }; desenhaTurno(bl.previousSibling, bl, n.d); }
          else x.classList.remove('ocupado');
        });
        return;
      }
      x.classList.remove('ocupado');
      if (r.status === 403 && /senha/i.test(r.d.erro || '')) {
        lsPoe(LS.senha, null);
        pedeSenha(x, bl, d, r.d.erro);
        return;
      }
      if (pendente) $('folha-erro').textContent = r.d.erro || 'Não consegui marcar agora.';
      toast(r.status === 0 ? 'Sem conexão: não marcou. Tente de novo com sinal.' : (r.d.erro || 'Não consegui marcar agora.'));
    });
  }

  function pedeSenha(x, bl, d, erro) {
    pendente = { x: x, bl: bl, d: d };
    $('folha-erro').textContent = erro || '';
    $('folha-senha').value = '';
    $('folha').classList.add('on');
    setTimeout(function () { $('folha-senha').focus(); }, 50);
  }
  function fechaSenha() { pendente = null; $('folha').classList.remove('on'); }
  $('folha-cancela').addEventListener('click', fechaSenha);
  $('folha').addEventListener('click', function (e) { if (e.target === $('folha')) fechaSenha(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pendente) fechaSenha(); });
  $('folha-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = $('folha-senha').value.trim();
    if (!s || !pendente) return;
    $('folha-erro').textContent = 'Conferindo...';
    envia(pendente.x, pendente.bl, pendente.d, s);
  });

  // --- Copos: a contagem contra o par e contra a anterior ---------------------
  // A conta de sumiço e quebra é a do mural do maître (reconcilia-vidraria.js),
  // nunca uma cópia. Aqui só se junta o que ela não cobre: o par do cadastro,
  // o que ficou sem contar e o que falta comprar. Dinheiro não entra nesta tela.
  function nomeK(s) { return RV ? RV._norm(s) : String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }

  function semanasUteis(hist) {
    return ((hist && hist.semanas) || []).map(function (s) {
      var d = '', tem = false;
      (s.copos || []).forEach(function (x) {
        if ((x.data || '') > d) d = x.data;
        if (typeof x.contagem === 'number' && x.contagem > 0) tem = true;
      });
      return { semana: s.semana, data: d, copos: s.copos || [], util: tem };
    }).filter(function (s) { return s.util; })
      .sort(function (a, b) { return a.data < b.data ? 1 : -1; });
  }

  function porNome(lista) {
    var m = {};
    lista.forEach(function (x) {
      var k = nomeK(x.nome);
      if (!k) return;
      if (m[k]) m[k].contagem += x.contagem || 0;
      else m[k] = { nome: x.nome, contagem: x.contagem || 0, lastro: x.lastro == null ? null : x.lastro, responsavel: x.responsavel || '' };
    });
    return m;
  }

  function controleCopos(hist, queb) {
    var uteis = semanasUteis(hist);
    if (!uteis.length) return null;
    var at = uteis[0], an = uteis[1] || null;
    var mA = porNome(at.copos), mB = an ? porNome(an.copos) : {};
    var rec = an && RV ? RV.reconciliaVidraria({ semanas: hist.semanas || [], meses: (queb && queb.meses) || [] }) : null;
    var recPor = {};
    if (rec && rec.ok) rec.itens.forEach(function (i) { recPor[nomeK(i.nome)] = i; });
    var linhas = [], vistos = {};
    function poe(nome, grupo, parCad) {
      var k = nomeK(nome);
      if (!k || vistos[k]) return;
      vistos[k] = 1;
      var a = mA[k], b = mB[k], r = recPor[k];
      // Par: o do cadastro manda; sem cadastro, o que veio carimbado na contagem.
      var par = parCad != null ? parCad : (a && a.lastro != null ? a.lastro : null);
      linhas.push({
        nome: (a && a.nome) || nome, grupo: grupo, par: par,
        atual: a ? a.contagem : null, anterior: b ? b.contagem : null,
        falta: a && par != null && par > a.contagem ? par - a.contagem : 0,
        reportado: r ? r.reportado : null, semExpl: r ? r.semExplicacao : null, incons: r ? !!r.inconsistente : false,
      });
    }
    COPOS.forEach(function (x) { poe(x.nome, x.grupo, x.lastro); });
    Object.keys(mA).forEach(function (k) { poe(mA[k].nome, 'outro', null); });
    Object.keys(mB).forEach(function (k) { poe(mB[k].nome, 'outro', null); });
    // Agrupa pela ordem dos grupos sem mexer na ordem da prateleira dentro de
    // cada um (é a ordem em que se conta).
    var ordemG = { copo: 0, equipamento: 1, outro: 2 };
    function og(g) { return Object.prototype.hasOwnProperty.call(ordemG, g) ? ordemG[g] : 2; }
    linhas = linhas.map(function (l, i) { return [l, i]; }).sort(function (x, y) {
      return (og(x[0].grupo) - og(y[0].grupo)) || x[1] - y[1];
    }).map(function (x) { return x[0]; });
    var resp = '';
    Object.keys(mA).some(function (k) { resp = mA[k].responsavel; return !!resp; });
    return { atual: at, anterior: an, rec: rec && rec.ok ? rec : null, linhas: linhas, responsavel: resp };
  }

  function totaisCopos(k) {
    var t = { abaixo: 0, itensAbaixo: 0, semPar: [], foraComPar: [], fora: [], sumiu: null, reportado: null, semExpl: null };
    k.linhas.forEach(function (l) {
      if (l.atual == null) { (l.par != null ? t.foraComPar : t.fora).push(l); return; }
      if (l.par == null) t.semPar.push(l);
      if (l.falta) { t.abaixo += l.falta; t.itensAbaixo++; }
    });
    if (k.rec) { t.sumiu = k.rec.totais.sumiu; t.reportado = k.rec.totais.reportado; t.semExpl = k.rec.totais.semExplicacao; }
    return t;
  }

  function kpi(valor, rotulo, cls) {
    return '<div class="kpi ' + (cls || '') + '"><b>' + (valor == null ? '—' : esc(valor)) + '</b><span>' + esc(rotulo) + '</span></div>';
  }

  // --- Inventário (24/11/2026) -------------------------------------------------
  // Uma tela com partes: Copos (contagem, par, quebras), Insumos e produções
  // (contagens semanais), Equipamentos e Utensílios. Cada parte aparece para
  // quem tem a regra dela na PODE_APP. A parte vai no endereço:
  // #/inventario/<parte>.
  var INV_PARTES = [['copos', 'Copos', 'copos.ver'], ['insumos', 'Insumos e produções', 'contagem.ver'],
    ['equipamentos', 'Equipamentos', 'inventario.equipamentos'], ['utensilios', 'Utensílios', 'inventario.equipamentos']];
  var INV_DESENHA = {};
  function parteInventario() {
    var m = location.hash.match(/^#\/([a-z]+)(?:\/([a-z]+))?/) || [];
    if (m[1] === 'copos') return 'copos';
    if (m[1] === 'contagem') return 'insumos';
    return m[2] || '';
  }
  function telaInventario(c, forca) {
    var partes = INV_PARTES.filter(function (p) { return pode(p[2]); });
    var atual = forca || parteInventario();
    if (!partes.some(function (p) { return p[0] === atual; })) atual = partes.length ? partes[0][0] : '';
    topo(c, 'Inventário', 'Copos, insumos, equipamentos e utensílios');
    if (partes.length > 1) {
      c.insertAdjacentHTML('beforeend', '<div class="chips inv-partes" role="tablist">' + partes.map(function (p) {
        var on = p[0] === atual;
        return '<button type="button" role="tab" aria-selected="' + on + '" data-inv="' + p[0] + '"' + (on ? ' class="on"' : '') + '>' + esc(p[1]) + '</button>';
      }).join('') + '</div>');
      Array.prototype.forEach.call(c.querySelectorAll('[data-inv]'), function (b) {
        b.addEventListener('click', function () {
          var alvo = '#/inventario/' + b.getAttribute('data-inv');
          // Trocar de parte não empilha histórico: o voltar sai do Inventário.
          if (location.hash === alvo) return;
          history.replaceState(history.state, '', alvo);
          vai();
        });
      });
    }
    if (atual) INV_DESENHA[atual](c);
  }
  TELAS.inventario = function (c) { telaInventario(c); };
  // Worker anterior ao Inventário ainda manda Copos e Contagem no menu.
  TELAS.copos = function (c) { telaInventario(c, 'copos'); };
  TELAS.contagem = function (c) { telaInventario(c, 'insumos'); };

  INV_DESENHA.copos = function (c) {
    var controle = pode('copos.controle');
    var b1 = bloco(c);
    dados.semanas().then(function (r) {
      if (!r.ok) { falhou(b1, 'Contagem da semana', r); return; }
      var st = situacaoSemana(r.d.contagens || [], 'copos');
      b1.innerHTML = '<h2>Contagem da semana</h2><div class="linha"><div class="t">Copos e vidraria<small>' + esc(st.detalhe) +
        '</small></div><span class="v"><span class="pill ' + st.cls + '">' + esc(st.rotulo) + '</span></span></div>' +
        '<div class="acoes">' + (pode('copos.contar') ? '<a class="btn" href="' + legado('contagem-copos.html') + '">Contar copos</a>' : '') +
        (pode('copos.quebra') ? '<a class="btn sec" href="' + legado('quebras.html') + '">' + ic('taca-trincada', 18) + 'Registrar quebra</a>' : '') + '</div>' +
        '<p class="vazio" style="margin-top:10px">Quebrou? Registre na hora. Quebra registrada explica a diferença; a que ninguém registra aparece como sumiço na contagem seguinte.</p>';
    });

    if (!controle) {
      var grupos = {};
      COPOS.forEach(function (x) { (grupos[x.grupo] = grupos[x.grupo] || []).push(x); });
      var h = '<div class="blk"><h2>O que se conta</h2>';
      ['copo', 'equipamento', 'outro'].forEach(function (g) {
        if (!grupos[g]) return;
        h += '<div class="grupo"><h3>' + esc(GRUPO_ROT[g]) + '</h3>' + grupos[g].map(function (x) {
          return '<div class="linha"><div class="t">' + esc(x.nome) + '</div><span class="v">' + (x.lastro != null ? 'par ' + esc(x.lastro) : '') + '</span></div>';
        }).join('') + '</div>';
      });
      c.insertAdjacentHTML('beforeend', h + '</div>');
      return;
    }

    var bR = bloco(c, 'destaque'), bP = bloco(c), bT = bloco(c);
    var bQ = pode('copos.quebras') ? bloco(c) : null;
    Promise.all([dados.historico(), bQ ? dados.quebras() : Promise.resolve(null)]).then(function (rs) {
      var rh = rs[0], rq = rs[1];
      if (!rh.ok) { falhou(bR, 'Controle de copos', rh); bP.remove(); bT.remove(); if (bQ) bQ.remove(); return; }
      var queb = rq && rq.ok ? rq.d : null;
      var k = controleCopos(rh.d, queb);
      if (!k) {
        bR.innerHTML = '<h2>Controle de copos</h2><p class="vazio">Nenhuma contagem de copos com número nos últimos seis meses.</p>';
        bP.remove(); bT.remove(); if (bQ) bQ.remove(); return;
      }
      desenhaResumoCopos(bR, k);
      desenhaReporCopos(bP, k);
      desenhaTabelaCopos(bT, k);
      if (bQ) desenhaQuebrasCopos(bQ, k, rq);
    });
  };

  function desenhaResumoCopos(b, k) {
    var t = totaisCopos(k);
    var desde = k.anterior ? dataBr(k.anterior.data) : '';
    var h = '<h2>Última contagem</h2><div class="agora"><div class="tt">' + dataBr(k.atual.data) +
      (k.responsavel ? ' · ' + esc(quemContou(k.responsavel)) : '') + '</div></div>' +
      '<p class="vazio">' + (k.anterior ? 'Comparada com a contagem de ' + desde + ' (' + esc(rotSemana(k.anterior.semana)) + ').'
        : 'É a primeira contagem com número: a comparação começa na próxima.') + '</p>' +
      '<div class="kpis">' +
      kpi(t.abaixo, 'peças abaixo do par em ' + t.itensAbaixo + (t.itensAbaixo === 1 ? ' item' : ' itens'), t.abaixo ? 'atencao' : '') +
      kpi(t.foraComPar.length + t.fora.length, 'itens sem contar nesta contagem', t.foraComPar.length ? 'ruim' : '') +
      kpi(t.sumiu, k.anterior ? 'peças a menos desde ' + desde : 'peças a menos', t.sumiu ? 'ruim' : '') +
      kpi(t.reportado, 'quebras registradas no período', '') + '</div>';
    if (t.semExpl) {
      h += '<p style="margin-top:8px"><b>' + t.semExpl + (t.semExpl === 1 ? ' peça sumiu' : ' peças sumiram') +
        ' sem quebra registrada</b> entre ' + desde + ' e ' + dataBr(k.atual.data) + '.</p>';
    }
    if (t.foraComPar.length || t.fora.length) {
      h += '<div class="fora">Ficaram fora desta contagem: ' + t.foraComPar.concat(t.fora).map(function (l) {
        return '<span class="pill ' + (l.par != null ? 'ruim' : '') + '">' + esc(l.nome) + (l.par != null ? ' · par ' + l.par : '') + '</span>';
      }).join('') + '</div>';
    }
    b.innerHTML = h;
  }

  function desenhaReporCopos(b, k) {
    var t = totaisCopos(k);
    var abaixo = k.linhas.filter(function (l) { return l.falta > 0; }).sort(function (x, y) { return y.falta - x.falta; });
    var h = '<h2>Para repor até o par</h2>';
    h += abaixo.length ? abaixo.map(function (l) {
      var cls = l.atual * 2 < l.par ? 'ruim' : 'atencao';
      return '<div class="linha"><div class="t">' + esc(l.nome) + '<small>tem ' + l.atual + ' de ' + l.par + '</small></div>' +
        '<span class="v"><span class="pill ' + cls + '">faltam ' + l.falta + '</span></span></div>';
    }).join('') : '<p class="vazio">Tudo o que foi contado está no par ou acima.</p>';
    if (t.semPar.length) {
      h += '<p class="vazio" style="margin-top:10px">Sem par definido, então sem conta de reposição: ' +
        esc(t.semPar.map(function (l) { return l.nome + ' (' + l.atual + ')'; }).join(', ')) + '. O par se define no Catálogo de Copos.</p>';
    }
    h += '<p class="vazio" style="margin-top:6px">Par é a quantidade de referência do cadastro de copos. Item que ficou sem contar não entra nesta lista.</p>';
    b.innerHTML = h;
  }

  function dif(l) {
    if (l.atual == null || l.anterior == null) return '';
    var d = l.atual - l.anterior;
    if (!d) return '0';
    return '<span class="' + (d < 0 ? 'menos' : 'mais') + '">' + (d < 0 ? '−' + (-d) : '+' + d) + '</span>';
  }

  function desenhaTabelaCopos(b, k) {
    var dA = dataBr(k.atual.data), dB = k.anterior ? dataBr(k.anterior.data) : '';
    var h = '<h2>Item a item</h2><div class="tab-wrap"><table><thead><tr><th>Item</th><th class="n">Par</th>' +
      (k.anterior ? '<th class="n">' + dB + '</th>' : '') + '<th class="n">' + dA + '</th>' +
      (k.anterior ? '<th class="n">Dif.</th><th class="n">Quebras</th>' : '') + '</tr></thead><tbody>';
    var ultimo = '';
    k.linhas.forEach(function (l) {
      if (l.grupo !== ultimo) {
        ultimo = l.grupo;
        h += '<tr class="sec"><td colspan="' + (k.anterior ? 6 : 3) + '">' + esc(GRUPO_ROT[l.grupo] || l.grupo) + '</td></tr>';
      }
      // Quebra maior que o sumiço só é suspeita quando o número não subiu: se
      // subiu, entrou copo (compra) e a quebra cabe na diferença.
      var nota = l.atual == null ? '<small>não contado em ' + dA + '</small>'
        : l.incons && l.atual <= l.anterior ? '<small>mais quebra registrada que sumiço: conferir a contagem</small>' : '';
      h += '<tr><td>' + esc(l.nome) + nota + '</td><td class="n">' + (l.par == null ? '—' : l.par) + '</td>' +
        (k.anterior ? '<td class="n">' + (l.anterior == null ? '—' : l.anterior) + '</td>' : '') +
        '<td class="n">' + (l.atual == null ? '—' : '<b>' + l.atual + '</b>') + '</td>' +
        (k.anterior ? '<td class="n">' + dif(l) + '</td><td class="n">' + (l.reportado ? l.reportado : '') + '</td>' : '') + '</tr>';
    });
    h += '</tbody></table></div>';
    if (k.anterior) h += '<p class="vazio" style="margin-top:8px">Dif. compara as duas contagens; Quebras são as registradas entre ' + dB + ' e ' + dA + '. Número a mais quer dizer compra, peça achada ou contagem anterior incompleta.</p>';
    b.innerHTML = h;
  }

  function desenhaQuebrasCopos(b, k, rq) {
    if (!rq || !rq.ok) { falhou(b, 'Quebras registradas', rq); return; }
    var todas = [];
    (rq.d.meses || []).forEach(function (m) { (m.entradas || []).forEach(function (e) { todas.push(e); }); });
    todas.sort(function (x, y) { return (x.data || '') < (y.data || '') ? 1 : -1; });
    var depois = todas.filter(function (e) { return (e.data || '') > k.atual.data; });
    var nDepois = depois.reduce(function (s, e) { return s + (e.quantidade || 0); }, 0);
    var h = '<h2>Quebras registradas</h2><div class="linha"><div class="t">Desde a última contagem (' + dataBr(k.atual.data) + ')</div><span class="v">' +
      (nDepois ? '<span class="pill atencao">' + nDepois + (nDepois === 1 ? ' peça' : ' peças') + '</span>' : 'nenhuma') + '</span></div>';
    h += todas.length ? todas.slice(0, 6).map(function (e) {
      return '<div class="linha"><div class="t">' + esc(e.nome) + '<small>' + esc(e.motivo || '') + (e.responsavel ? ' · ' + esc(e.responsavel) : '') +
        '</small></div><span class="v">' + esc(e.quantidade) + ' · ' + dataBr(e.data) + '</span></div>';

  // --- Escala (24/11/2026) -----------------------------------------------------
  // Os próximos 7 dias pela versão OFICIAL de cada semana: GET
  // /api/escala?oficial=1, a mesma rota da página Minha escala do site. Quem é a
  // pessoa vem da sessão; sem pessoa (senha do nível), mostra a casa. Dia sem
  // linha na base cai no padrão da pessoa, e a tela diz isso.
  var ESC_DIA_NOME = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  var ESC_DIA_CURTO = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  function isoLocal(x) { return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); }
  function chaveNome(n) { return semAcento(n).trim(); }
  function linhasEscala(dt, dias, padrao) {
    var data = isoLocal(dt), nomeDia = ESC_DIA_NOME[dt.getDay()], por = {};
    dias.forEach(function (x) { if (x.data === data) por[chaveNome(x.pessoa)] = x; });
    padrao.forEach(function (pp) {
      if (!pp.ativo || por[chaveNome(pp.pessoa)]) return;
      var folga = pp.folgaFixa === nomeDia;
      por[chaveNome(pp.pessoa)] = { pessoa: pp.pessoa, turno: folga ? 'Folga' : pp.turnoBase,
        entrada: folga ? '' : pp.entradaBase, saida: folga ? '' : pp.saidaBase, doPadrao: true };
    });
    return Object.keys(por).map(function (k) { return por[k]; });
  }

  TELAS.escala = function (c) {
    topo(c, 'Minha escala', 'Os próximos 7 dias, pela escala oficial');
    var b = bloco(c);
    b.innerHTML = '<p class="vazio">Carregando…</p>';
    var hoje = new Date(); hoje.setHours(12, 0, 0, 0);
    var datas = [];
    for (var i = 0; i < 7; i++) { var d = new Date(hoje); d.setDate(hoje.getDate() + i); datas.push(d); }
    dados.escala(isoLocal(datas[0]), isoLocal(datas[6])).then(function (r) {
      if (!r.ok) { falhou(b, 'Minha escala', r); return; }
      var dias = r.d.dias || [], padrao = r.d.padrao || [];
      var eu = chaveNome(CTX.pessoa || '');
      var conhecido = eu && padrao.concat(dias).some(function (x) { return chaveNome(x.pessoa) === eu; });
      var sub = c.querySelector('.topo .sub');
      if (sub && !conhecido) sub.textContent = eu ? 'Seu nome não está na escala: esta é a da casa' : 'Escala da casa (entrou sem nome)';
      b.innerHTML = '<h2>' + (conhecido ? 'Seus dias' : 'A casa') + '</h2>' + datas.map(function (dt, i) {
        var ls = linhasEscala(dt, dias, padrao);
        var trab = ls.filter(function (x) { return x.turno && x.turno !== 'Folga'; });
        var quando = (i === 0 ? 'Hoje' : ESC_DIA_CURTO[dt.getDay()]) + ' · ' + dataBr(isoLocal(dt));
        if (conhecido) {
          var m = ls.filter(function (x) { return chaveNome(x.pessoa) === eu; })[0];
          if (!m) return '<div class="linha"><div class="t">' + esc(quando) + '<small>Sem escala lançada</small></div></div>';
          if (m.turno === 'Folga') {
            return '<div class="linha"><div class="t">' + esc(quando) + (m.doPadrao ? '<small>Pelo padrão: a semana ainda não foi montada</small>' : '') +
              '</div><span class="v"><span class="pill ok">Folga</span></span></div>';
          }
          var com = trab.filter(function (x) { return x.turno === m.turno && chaveNome(x.pessoa) !== eu; }).map(function (x) { return primeiroNome(x.pessoa); });
          var det = (m.entrada && m.saida ? m.entrada + ' – ' + m.saida : 'horário a confirmar') +
            ' · ' + (com.length ? 'com ' + com.join(', ') : 'só você no turno') + (m.doPadrao ? ' · pelo padrão' : '');
          return '<div class="linha"><div class="t">' + esc(quando) + '<small>' + esc(det) + '</small></div><span class="v"><span class="pill' +
            (i === 0 ? ' atencao' : '') + '">' + esc(m.turno) + '</span></span></div>';
        }
        var txt = ['Dia', 'Noite'].map(function (t) {
          var ps = trab.filter(function (x) { return x.turno === t; }).map(function (x) { return primeiroNome(x.pessoa); });
          return ps.length ? t + ': ' + ps.join(', ') : '';
        }).filter(Boolean).join(' · ') || 'Sem escala lançada';
        return '<div class="linha"><div class="t">' + esc(quando) + '<small>' + esc(txt) + '</small></div></div>';
      }).join('');
    });
  };

  // --- Caixa de entrada --------------------------------------------------------
  // A lista é a do sino do site (GET /api/notificacoes): a rota decide o que

  var TIPO_AV = {
    aviso: { rot: 'Aviso', ic: 'sino' },
    demanda: { rot: 'Demanda nova', ic: 'inbox' },
    resposta: { rot: 'Resposta', ic: 'check-circle' },

  function linkAviso(x) {
    if (x.tipo === 'aviso') return legado('avisos.html');

  function quandoTxt(q) {
    if (!q) return '';
    // Data pura ("2026-11-20") vira meia-noite UTC no new Date, que em Goiânia
    // é o dia anterior: monta no fuso local.
    var soDia = /^\d{4}-\d{2}-\d{2}$/.test(String(q));
    var p = String(q).slice(0, 10).split('-');
    var d = soDia ? new Date(+p[0], +p[1] - 1, +p[2]) : new Date(q);
    if (isNaN(d)) return dataBr(q);
    try { return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + (soDia ? '' : ' · ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })); }
    catch (e) { return dataBr(q); }
  }

  // --- Fichas técnicas -----------------------------------------------------------
  var BRL = null;
  try { BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }); } catch (e) {}
  function dinheiro(v, casas) {
    if (v == null || isNaN(v)) return '—';
    if (casas != null) { try { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: casas, maximumFractionDigits: casas }).format(v); } catch (e) {} }
    return BRL ? BRL.format(v) : String(v);

  function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

  var fichaSec = 'todas', fichaBusca = '';

  function fichasVisiveis(lista) {

  function desenhaFichas(bL, lista, precif) {
    var abertos = {};
    Array.prototype.forEach.call(bL.querySelectorAll('.fc[open]'), function (d) { abertos[d.getAttribute('data-k')] = 1; });

      var resumo = f.sf ? 'Receita ainda não registrada' : f.i.slice(0, 4).map(function (x) { return x[1]; }).join(' · ') + (f.i.length > 4 ? ' …' : '');
      var foto = f.f ? '<img class="foto" src="fotos/' + esc(f.f) + '" alt="" loading="lazy" decoding="async" width="52" height="52">'

  // PDF das fichas (24/11/2026): monta uma folha limpa em #impressao e chama a

  // --- Chat (PLANO_CHAT_APP_BENTO.md, 24/11/2026) ---------------------------
  // Um chat por pessoa e por dia. No modo Chat (chave do topo) há a faixa da
  // semana, o calendário do mês e, para a administração, a lista de conversas.
  // Na aba "Chat do dia" das Funções, só o chat de hoje.
  // sala: null = lista de conversas; 'meu' = o próprio chat do dia; 'grupo' =
  // Equipe Bento; 'setor:<slug>' = pedidos daquele setor; 'conversas' = chats
  // de todos (admin). pessoa: chat de outra pessoa aberto pela administração.
  var CH = { dia: null, pessoa: null, vista: 'dia', mes: null, sala: null, timer: null };
  var DIAS_SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var DIAS_EXT = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function dDate(d) { return new Date(d + 'T12:00:00Z'); }
  function somaDias(d, n) { var x = dDate(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function semanaDe(d) { var dow = (dDate(d).getUTCDay() + 6) % 7, seg = somaDias(d, -dow), out = []; for (var i = 0; i < 7; i++) out.push(somaDias(seg, i)); return out; }
  function diaTxt(d) { var x = dDate(d); return DIAS_EXT[x.getUTCDay()] + ', ' + dataBr(d); }
  function hora(ms) { var x = new Date(ms); return ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

  // Pergunta de receita: a casca casa com uma ficha que ela já tem e manda só
  // o nome; o worker não guarda receita. Só casa quando a mensagem pede a
  // receita ou é praticamente só o nome: "acabou o gin do negroni" é problema
  // para a coordenação, não pedido de ficha.
  var PEDE_RECEITA = /\b(receita|ficha|como (faz|fazer|faco|prepara|preparar|monta|montar)|preparo|ingrediente|quantos? ml|dose)\b/;
  // "Acabou o negroni", "cadê o gin do negroni": é aviso, não pedido de ficha.
  var PARECE_AVISO = /\b(acab\w*|falt\w*|termin\w*|zerou|quebr\w*|cade|sumiu|estrag\w*|vencid\w*|nao tem|sem)\b/;
  var PALAVRA_VAZIA = { a: 1, o: 1, as: 1, os: 1, de: 1, da: 1, do: 1, das: 1, dos: 1, e: 1, um: 1, uma: 1, no: 1, na: 1, pro: 1, pra: 1 };
  // Apelido que sozinho não diz qual drink é ("Bento", "base", "mocktail").
  var APELIDO_GENERICO = { bento: 1, base: 1, mocktail: 1, drink: 1, classico: 1 };
  function palavras(s) { return norm(s).split(' ').filter(function (w) { return w && !PALAVRA_VAZIA[w]; }); }
  // Nomes pelos quais a ficha é chamada: o nome sem o parêntese e cada apelido
  // de dentro dele. "Gin & Tônica (Gin Tônica, Bento)" casa com "gin tônica";
  // antes o nome inteiro, com o parêntese, nunca casava com nada.
  function nomesFicha(f) {
    if (f._nomes) return f._nomes;
    var n = String(f.n || ''), m = /^(.*?)\s*\((.*)\)\s*$/.exec(n);
    var cand = [m ? m[1] : n];
    if (m) m[2].split(/[,;/]|\s[—–-]\s/).forEach(function (x) { cand.push(x); });
    f._nomes = cand.map(palavras).filter(function (ws) {
      return ws.length > 1 || (ws.length === 1 && ws[0].length >= 4 && !APELIDO_GENERICO[ws[0]]);
    });
    return f._nomes;
  }
  function casaFicha(texto) {
    var nt = norm(texto), t = palavras(texto);
    if (!t.length) return null;
    var ts = ' ' + t.join(' ') + ' ';
    var melhor = null, pontos = 0, usadas = 0, empate = false;
    (FICHAS.fichas || []).forEach(function (f) {
      var p = 0, u = 0;
      nomesFicha(f).forEach(function (ws) {
        // Nome inteiro vale mais que começo de nome; nome longo ("Suco/limão
        // taiti espremido") casa pelas duas primeiras palavras ("suco de limão").
        if (ts.indexOf(' ' + ws.join(' ') + ' ') >= 0) { if (ws.length * 10 + 5 > p) { p = ws.length * 10 + 5; u = ws.length; } }
        else if (ws.length >= 3 && ts.indexOf(' ' + ws.slice(0, 2).join(' ') + ' ') >= 0 && 20 > p) { p = 20; u = 2; }
      });
      if (!p) return;
      if (p > pontos) { pontos = p; melhor = f; usadas = u; empate = false; }
      else if (p === pontos && f !== melhor) empate = true;
    });
    // Duas fichas empatadas ("pré-batch" casa com três): melhor perguntar à
    // coordenação do que mostrar a ficha errada.
    if (!melhor || empate) return null;
    var aviso = PARECE_AVISO.test(nt) && !/\b(receita|ficha)\b/.test(nt);
    if (aviso) return null;
    return PEDE_RECEITA.test(nt) || t.length - usadas === 0 ? melhor : null;
  }
  function fichaPorNome(nome) {
    var k = norm(nome);
    return (FICHAS.fichas || []).filter(function (f) { return norm(f.n) === k; })[0] || null;
  }
  function fichaHtml(nome) {
    var f = fichaPorNome(nome);
    if (!f) return '<p>Ficha técnica: ' + esc(nome) + '</p>';
    var h = '<div class="ficha"><b>' + esc(f.n) + '</b>';
    if (f.sf || f.sm) h += '<p class="aviso-f">Proporções ainda não registradas: confirme com a coordenação.</p>';
    h += f.i.map(function (x) { return '<div class="ing"><span class="d">' + esc(x[0]) + '</span><span>' + esc(x[1]) + '</span></div>'; }).join('');
    if (f.m.length) h += '<div class="metas">' + f.m.map(function (m) { return '<p>' + esc(m) + '</p>'; }).join('') + '</div>';
    return h + '</div><a class="ir" href="#/fichas">Ver ficha completa ›</a>';
  }

  // "Como funciona a contagem?", "vídeo do turno", "onde vejo os copos?": o
  // "?" responde com o vídeo do assunto. Precisa pedir ajuda (como, onde,
  // vídeo...) E citar o assunto; sem isso é pergunta normal para a coordenação.
  var PEDE_AJUDA = /\b(como|onde|video|videos|tutorial|ensina|explica|aprender|ajuda|nao sei usar|nao entendi)\b/;
  function videosDoNivel() {
    return (VIDEOS || []).filter(function (v) { return v.n.indexOf(CTX.nivel) >= 0; });
  }
  function casaVideo(texto) {
    var t = ' ' + norm(texto) + ' ';
    if (!PEDE_AJUDA.test(t)) return null;
    var melhor = null, pontos = 0;
    videosDoNivel().forEach(function (v) {
      var p = 0;
      v.p.forEach(function (w) { if (t.indexOf(' ' + norm(w) + ' ') >= 0) p += norm(w).split(' ').length; });
      if (p > pontos) { pontos = p; melhor = v; }
    });
    return melhor;
  }
  function videoPorId(id) { return (VIDEOS || []).filter(function (v) { return v.id === id; })[0] || null; }
  function videoHtml(id) {

  var mesCache = {};
  function situacaoMes(pessoa, mes) {
    var k = (pessoa || '') + '|' + mes, c = mesCache[k];
    if (c && Date.now() - c.em < 60000) return c.p;

    var reg = { em: Date.now(), p: p };
    mesCache[k] = reg;
    p.then(function (r) { if (!r.ok && mesCache[k] === reg) delete mesCache[k]; });
    return p;
  }

  function telaChat(c, completo) {

  function voltaChat() {

  function chatDia(c, completo) {

      var h = '<div class="ch">' + topoChat(titulo, sub, { volta: completo, mes: completo, sino: !completo, inicial: pessoa || 'B' });
      if (completo) h += '<nav class="ch-sem" id="ch-sem" aria-label="Dias da semana">' + semanaDe(d.dia).map(function (x) {
